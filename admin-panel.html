<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broker-OS — لوحة إدارة المنصة</title>
<link rel="icon" type="image/png" href="broker-os-symbol.png">
<link rel="apple-touch-icon" href="broker-os-symbol.png">
<meta name="theme-color" content="#3636AE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy:#0B1F3A;--navy-dark:#071527;--navy-light:#15366A;
  --gold:#C9A227;--gold-2:#E9CE73;--gold-soft:#2C2412;
  --bg:#0B1220;--panel:#101A2C;--card:#141F35;--card-2:#172440;
  --text:#EAF0FB;--text-2:#B9C4DA;--muted:#8090AC;--line:#22304A;--line-soft:#1A2740;
  --ok:#22C55E;--ok-bg:#0F2A1E;--warn:#F5A524;--warn-bg:#2E2210;--bad:#F0554A;--bad-bg:#301616;--info:#5B9BF5;--info-bg:#132540;--purple:#9B87F5;--purple-bg:#211A3A;
  --radius-sm:10px;--radius-md:14px;--radius-lg:20px;--radius-xl:26px;--radius-full:999px;
  --shadow-sm:0 2px 10px rgba(0,0,0,.25);--shadow-md:0 8px 26px rgba(0,0,0,.35);--shadow-lg:0 18px 50px rgba(0,0,0,.45);
  --shadow-gold:0 8px 24px rgba(201,162,39,.28);
  --sidebar-w:258px;--trans:.22s cubic-bezier(.4,0,.2,1);--trans-bounce:.3s cubic-bezier(.34,1.56,.64,1);
  --font:'Cairo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
button,input,select,textarea{font-family:inherit;outline:none;color:inherit}
button{cursor:pointer;border:none;background:none}
img{display:block}
h1,h2,h3{font-weight:800}
.hidden{display:none!important}
.logo-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--gold-2));display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy-dark);font-size:16px;letter-spacing:-.5px;box-shadow:var(--shadow-gold);flex-shrink:0}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);font-weight:700;font-size:13px;transition:all var(--trans-bounce)}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:var(--navy-dark);box-shadow:var(--shadow-gold)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(201,162,39,.4)}
.btn-outline{background:var(--card);border:1.5px solid var(--line);color:var(--text-2)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-ghost{background:transparent;color:var(--muted);padding:8px 12px}
.btn-ghost:hover{color:var(--text)}
.btn-sm{padding:6px 12px;font-size:11.5px}
.btn-danger{background:var(--bad-bg);color:#ff9d94;border:1px solid #4a2320}

/* ===== layout ===== */
.wrap{display:flex;min-height:100vh}
.side{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:linear-gradient(180deg,var(--navy-dark),var(--navy) 55%,var(--navy-light));position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.3)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.brand b{font-size:17px;color:#fff;display:block}
.brand span{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.3px}
.nav-g{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:rgba(255,255,255,.32);font-weight:700;padding:16px 12px 6px;display:flex;align-items:center;gap:7px}
.nav-g::before{content:'';width:10px;height:2px;background:var(--gold);border-radius:2px;opacity:.8}
.nav-g:first-of-type{padding-top:8px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:rgba(255,255,255,.7);font-size:13.5px;font-weight:600;margin-bottom:2px;transition:all var(--trans-bounce);position:relative}
.nav a i{width:18px;text-align:center;font-size:13.5px;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(-3px)}
.nav a.active{background:linear-gradient(135deg,rgba(201,162,39,.22),rgba(201,162,39,.08));color:#FFE8AE}
.side-foot{margin-top:auto;padding-top:14px}
.connbox{padding:11px 12px;border-radius:12px;font-size:10.5px;line-height:1.7;margin-bottom:8px}
.conn-demo{background:#2E2210;color:#F5CE7A;border:1px solid #4a3a15}
.conn-live{background:#0F2A1E;color:#8CE8B3;border:1px solid #1f4d34}
.signout{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6);padding:9px;border-radius:10px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.signout:hover{color:#fff;border-color:rgba(255,255,255,.2)}

.main{flex:1;min-width:0;padding:22px 28px 70px;max-width:1240px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:21px}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.top-right{display:flex;align-items:center;gap:10px}
.pill{background:var(--card);border:1px solid var(--line);padding:8px 15px;border-radius:99px;font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
.pill b{color:var(--gold)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:14px;transition:all var(--trans)}
.iconbtn:hover{color:var(--gold);border-color:var(--gold)}

.banner{background:linear-gradient(135deg,#1a2f16,#182a12);border:1px solid #3a5218;color:#d9f2b0;border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:20px;font-size:12.5px;line-height:1.9;display:flex;gap:12px}
.banner i{color:#a4d36b;font-size:16px;margin-top:2px}
.banner b{color:#fff}.banner code{background:#0c1608;padding:2px 7px;border-radius:6px;font-size:11px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden;transition:transform var(--trans)}
.kpi:hover{transform:translateY(-3px)}
.kpi::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:3.5px;background:linear-gradient(var(--gold),var(--gold-2))}
.kpi .top{display:flex;justify-content:space-between;align-items:flex-start}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px}
.kpi .v{font-size:24px;font-weight:800;margin-top:10px}
.kpi .l{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.kpi .trend{font-size:10.5px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:4px}
.trend.up{color:var(--ok)}.trend.down{color:var(--bad)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:19px 20px;margin-bottom:18px}
.card h2{font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .htxt{display:flex;align-items:center;gap:9px}
.card h2 i{color:var(--gold);font-size:14px}
.card p.sub{font-size:11.5px;color:var(--muted);margin:5px 0 14px;line-height:1.7}
.tag{font-size:10px;background:var(--info-bg);color:var(--info);padding:4px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--gold-2)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}.main{padding:18px}}

.row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line-soft);gap:10px}
.row:last-child{border-bottom:none}
.row .name{font-size:13px;font-weight:700}.row .desc{font-size:11px;color:var(--muted);margin-top:2px}
.row-ic{width:32px;height:32px;border-radius:10px;background:var(--card-2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gold);flex-shrink:0}

.switch{position:relative;width:42px;height:24px;flex:0 0 42px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:#26324a;border-radius:99px;cursor:pointer;transition:.2s}
.slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
input:checked+.slider{background:linear-gradient(135deg,var(--gold),var(--gold-2))}
input:checked+.slider:before{transform:translateX(-18px)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:start;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:9px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.015)}
.sel,.inl,.txtarea{background:#0B1424;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12px;width:100%}
.sel:focus,.inl:focus,.txtarea:focus{border-color:var(--gold)}
.txtarea{resize:vertical;font-family:inherit}

.badge{padding:4px 11px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.b-new,.b-info,.b-active{background:var(--info-bg);color:var(--info)}
.b-review,.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-approved,.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-rejected,.b-suspended,.b-bad{background:var(--bad-bg);color:#ff8a80}
.b-demo{background:var(--purple-bg);color:var(--purple)}
.b-active::before,.b-ok::before{content:'●';font-size:8px}

.empty{color:var(--muted);font-size:12px;text-align:center;padding:26px 10px}
.log-item{font-size:12px;padding:9px 2px;border-bottom:1px solid var(--line-soft);color:var(--text-2);display:flex;gap:10px}
.log-item:last-child{border-bottom:none}
.log-item i{color:var(--gold);margin-top:2px;font-size:11px}
.log-item b{color:var(--text)}.log-item .muted{color:#5c6b85}

.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card-2);border:1px solid var(--line);color:var(--text);font-size:11.5px;padding:6px 8px 6px 12px;border-radius:99px;margin:0 6px 7px 0;font-weight:600}
.chip button{color:var(--bad);font-size:14px;font-weight:800;line-height:1}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}

.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--navy-light),var(--navy));color:var(--gold-2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;border:1px solid rgba(201,162,39,.3);flex-shrink:0}

.bar-bg{background:#0B1424;border-radius:99px;height:7px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}

/* ===== login ===== */
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 15%,var(--navy-light) 0%,var(--navy) 45%,var(--navy-dark) 100%);padding:20px}
.login-box{width:min(400px,92vw);background:rgba(20,31,53,.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-xl);padding:42px 34px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.login-box .logo-mark{width:64px;height:64px;font-size:22px;margin:0 auto 18px;border-radius:18px}
.login-box h1{text-align:center;font-size:21px;color:#fff}
.login-box .subtitle{text-align:center;color:var(--muted);font-size:12.5px;margin:6px 0 26px;line-height:1.7}
.login-box .subtitle code{background:#0B1424;padding:2px 6px;border-radius:5px;color:var(--gold-2)}
.field{margin-bottom:15px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:#0B1424;color:#fff;font-size:13.5px;transition:all var(--trans)}
.field input:focus{border-color:var(--gold)}
.login-box .btn{width:100%;justify-content:center;padding:13px;font-size:13.5px;margin-top:4px}
.loginerr{color:#ff8a80;font-size:11.5px;margin-top:10px;min-height:14px;text-align:center}

/* ===== toast + modal ===== */
.toastwrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .25s ease;display:flex;align-items:center;gap:8px}
.toast i{color:var(--ok)}.toast.err i{color:var(--bad)}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.overlay{position:fixed;inset:0;background:rgba(5,9,18,.65);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;width:min(440px,92vw);box-shadow:var(--shadow-lg);transform:scale(.95);transition:transform .2s}
.overlay.show .modal{transform:scale(1)}
.modal h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.modal h3 i{color:var(--gold)}
.modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}

/* ===== Broker-OS visual identity refresh ===== */
:root{
  --navy:#3636AE;--navy-dark:#12102E;--navy-light:#5840B8;
  --gold:#8C6CEB;--gold-2:#B06ADD;--gold-soft:#2A2148;
  --bg:#0E0C1D;--panel:#15122B;--card:#181533;--card-2:#211C43;
  --text:#F7F4FF;--text-2:#CEC7E7;--muted:#9189AE;--line:#2C2850;--line-soft:#24203F;
  --info:#8B8AFF;--info-bg:#20204A;--purple:#B06ADD;--purple-bg:#2C2041;
  --shadow-gold:0 10px 28px rgba(139,108,235,.28);
}
body{background:radial-gradient(circle at 50% -10%,rgba(176,106,221,.13),transparent 34%),var(--bg);}
.side{background:linear-gradient(180deg,#100D2B 0%,#21184A 55%,#3B2A7A 100%);box-shadow:10px 0 34px rgba(15,10,40,.45);}
.brand{padding-top:6px;}
.brand .logo-mark{background:#fff;border:1px solid rgba(255,255,255,.45);box-shadow:0 10px 26px rgba(176,106,221,.22);padding:7px;}
.brand .logo-mark img{width:100%;height:100%;object-fit:contain;}
.brand b{letter-spacing:.2px;}
.nav a.active{background:linear-gradient(135deg,rgba(176,106,221,.24),rgba(139,108,235,.12));color:#F1E9FF;box-shadow:inset 0 0 0 1px rgba(176,106,221,.08);}
.nav a:hover{background:rgba(176,106,221,.10);}
.kpi,.card,.pill,.iconbtn,.toast{border-color:rgba(176,106,221,.12);}
.kpi::before{background:linear-gradient(var(--gold),var(--gold-2));}
.btn-gold{background:linear-gradient(135deg,#7C62E6,#B06ADD);color:#fff;box-shadow:0 10px 24px rgba(139,108,235,.25);}
.btn-gold:hover{box-shadow:0 14px 34px rgba(176,106,221,.32);}
.btn-outline:hover{border-color:#9D82F5;color:#C6B6FF;}
.banner{background:linear-gradient(135deg,#241D45,#1C1736);border-color:#3F356C;color:#E9E1FF;}
.banner code{background:#11102A;color:#CDBBFF;}
.sel,.inl,.txtarea,.field input{background:#0F0D23;border-color:#2A2650;}
.sel:focus,.inl:focus,.txtarea:focus,.field input:focus{border-color:#9B82F2;box-shadow:0 0 0 3px rgba(139,108,235,.10);}
.avatar{background:linear-gradient(135deg,#4D37A6,#B06ADD);color:#fff;border-color:rgba(176,106,221,.35);}
.login-box{border-color:rgba(176,106,221,.18);background:rgba(22,18,48,.92);}
.login-box .logo-mark{background:#fff;padding:8px;box-shadow:0 12px 30px rgba(176,106,221,.18);}
.login-box .logo-mark img{width:100%;height:100%;object-fit:contain;}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:18px;}
.login-brand img{width:175px;max-width:70%;height:auto;object-fit:contain;filter:drop-shadow(0 12px 26px rgba(176,106,221,.14));}
.login-brand span{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;color:#A99FC8;font-weight:700;}
.toast{box-shadow:0 20px 50px rgba(7,4,24,.45);}
@media(max-width:900px){.main{padding:18px 16px 60px}}

</style>
</head>
<body>
<div id="app"></div>
<div class="toastwrap" id="toastwrap"></div>

<div class="overlay" id="orgOverlay"><div class="modal">
  <h3><i class="fa-solid fa-building"></i> إضافة مكتب وساطة جديد</h3>

  <div class="field"><label>عدد المقاعد</label><input class="inl" id="orgSeats" type="number" value="5" min="1"></div>
  <div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="closeModal('orgOverlay')">إلغاء</button><button class="btn btn-gold btn-sm" onclick="createOrg()"><i class="fa-solid fa-check"></i> إضافة المكتب</button></div>
</div></div>

const DEMO = firebaseConfig.apiKey.indexOf('YOUR_')===0;

/* ============ Local demo-mode storage ============ */
const FLAGS_KEY='brokeros_flags', LEADS_KEY='brokeros_leads', AUDIT_KEY='brokeros_audit_log',
      USERS_KEY='brokeros_users', INSURERS_KEY='brokeros_insurers', PRODUCTS_KEY='brokeros_products',
      NOTIFS_KEY='brokeros_notifications', CONTENT_KEY='brokeros_page_content', ORGS_KEY='brokeros_orgs';
function J(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function W(k,v){localStorage.setItem(k,JSON.stringify(v))}
function toast(msg,err){const w=document.getElementById('toastwrap');const t=document.createElement('div');t.className='toast'+(err?' err':'');t.innerHTML=`<i class="fa-solid ${err?'fa-circle-exclamation':'fa-circle-check'}"></i>${msg}`;w.appendChild(t);setTimeout(()=>t.remove(),3200);}
function openModal(id){document.getElementById(id).classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}

let CACHE={pages:{},widgets:{},pageContent:{},users:[],orgs:[],insurers:[],products:[],notifications:[],leads:[],audit:[]};
PAGES.forEach(p=>CACHE.pages[p.key]=true); WIDGETS.forEach(w=>CACHE.widgets[w.key]=true);

function pushAuditDemo(t){const log=J(AUDIT_KEY,[]);log.push({text:t,time:new Date().toLocaleString('ar-EG')});W(AUDIT_KEY,log.slice(-50));CACHE.audit=[...log].reverse();}
function pushAudit(t){ if(DEMO){pushAuditDemo(t);renderAudit();return;} db.collection('auditLogs').add({text:t,by:ME_NAME,time:new Date().toLocaleString('ar-EG'),ts:firebase.firestore.FieldValue.serverTimestamp()}); }

function loadDemoAll(){
  const flagsRaw=J(FLAGS_KEY,{}); CACHE.pages={...CACHE.pages,...(flagsRaw.pages||{})}; CACHE.widgets={...CACHE.widgets,...(flagsRaw.widgets||{})};
  CACHE.pageContent=J(CONTENT_KEY,{});
  CACHE.users=J(USERS_KEY,null)||(W(USERS_KEY,DEFAULT_USERS),DEFAULT_USERS);
  CACHE.orgs=J(ORGS_KEY,null)||(W(ORGS_KEY,DEFAULT_ORGS),DEFAULT_ORGS);
  CACHE.insurers=J(INSURERS_KEY,DEFAULT_INSURERS);
  CACHE.products=J(PRODUCTS_KEY,DEFAULT_PRODUCTS);
  CACHE.notifications=J(NOTIFS_KEY,[]);
  CACHE.leads=J(LEADS_KEY,[]);
  CACHE.audit=[...J(AUDIT_KEY,[])].reverse();
}
function bindFirebaseListeners(){
  db.collection('platformSettings').doc('appConfig').onSnapshot(doc=>{ const d=doc.data()||{}; CACHE.pages={...CACHE.pages,...(d.pages||{})}; CACHE.widgets={...CACHE.widgets,...(d.widgets||{})}; CACHE.pageContent=d.pageContent||{}; renderAll(); });
  db.collection('users').onSnapshot(snap=>{CACHE.users=snap.docs.map(d=>({id:d.id,...d.data()})); renderUsers(); renderCounts();});
  db.collection('organizations').onSnapshot(snap=>{CACHE.orgs=snap.docs.map(d=>({id:d.id,...d.data()})); renderOrgs(); renderCounts();});
  db.collection('insurers').onSnapshot(snap=>{CACHE.insurers=snap.docs.map(d=>({id:d.id,name:d.data().name})); renderChips('insurers');});
  db.collection('products').onSnapshot(snap=>{CACHE.products=snap.docs.map(d=>({id:d.id,name:d.data().name})); renderChips('products');});
  db.collection('leads').orderBy('createdAt','desc').limit(100).onSnapshot(snap=>{CACHE.leads=snap.docs.map(d=>({id:d.id,...d.data()})); renderLeads(); renderCounts();});
  db.collection('auditLogs').orderBy('ts','desc').limit(50).onSnapshot(snap=>{CACHE.audit=snap.docs.map(d=>d.data()); renderAudit();});
}
function saveConfigPatch(patch){
  if(DEMO){
    const cur=J(FLAGS_KEY,{pages:{},widgets:{}}); const merged={pages:{...cur.pages,...(patch.pages||{})},widgets:{...cur.widgets,...(patch.widgets||{})}};
    W(FLAGS_KEY,merged);
    if(patch.pageContent){const c=J(CONTENT_KEY,{});W(CONTENT_KEY,{...c,...patch.pageContent});}
    Object.assign(CACHE.pages,patch.pages||{}); Object.assign(CACHE.widgets,patch.widgets||{});
    if(patch.pageContent) Object.assign(CACHE.pageContent,patch.pageContent);
    return;
  }
  db.collection('platformSettings').doc('appConfig').set(patch,{merge:true});
}
function renderToggleList(container,items,section){
  container.innerHTML='';
  items.forEach(it=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div style="display:flex;gap:11px;align-items:center">${it.ic?`<span class="row-ic"><i class="fa-solid ${it.ic}"></i></span>`:''}<div><div class="name">${it.name}</div><div class="desc">${it.desc}</div></div></div>
      <label class="switch"><input type="checkbox" data-section="${section}" data-key="${it.key}" ${CACHE[section][it.key]!==false?'checked':''}><span class="slider"></span></label>`;
    container.appendChild(row);
  });
  container.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{
    const sec=e.target.dataset.section,key=e.target.dataset.key;
    saveConfigPatch({[sec]:{[key]:e.target.checked}});
    const label=(sec==='pages'?PAGES:WIDGETS).find(x=>x.key===key)?.name||key;
    pushAudit(`تم ${e.target.checked?'تفعيل':'تعطيل'} "${label}" في تطبيق الوسيط`);
    toast(`تم ${e.target.checked?'تفعيل':'تعطيل'} "${label}"`);
    renderCounts();
  }));
}
function renderCounts(){
  document.getElementById('kPages').textContent=`${PAGES.filter(p=>CACHE.pages[p.key]!==false).length}/${PAGES.length}`;
  document.getElementById('kWidgets').textContent=`${WIDGETS.filter(w=>CACHE.widgets[w.key]!==false).length}/${WIDGETS.length}`;
  document.getElementById('kActiveUsers').textContent=CACHE.users.filter(u=>(u.status||'نشط')==='نشط').length;
  document.getElementById('kOrgs').textContent=CACHE.orgs.length;
  document.getElementById('kNew').textContent=CACHE.leads.filter(l=>l.status==='جديد').length;
  const premTotal=CACHE.orgs.reduce((s,o)=>s+parseInt((o.premium||'0').replace(/,/g,'')||0,0),0);
  const polTotal=CACHE.orgs.reduce((s,o)=>s+(o.policies||0),0);
  document.getElementById('kPremium').textContent=premTotal.toLocaleString('en-US');
  document.getElementById('kPolicies').textContent=polTotal.toLocaleString('en-US');
}

/* ============ Organizations (brokerage firms / tenants) ============ */
function renderOrgs(){
  const tbody=document.getElementById('orgsTbody'); tbody.innerHTML='';
  CACHE.orgs.forEach(o=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><div style="display:flex;gap:9px;align-items:center"><div class="avatar"><i class="fa-solid fa-building" style="font-size:12px"></i></div>
        <div><div class="name">${o.name}</div><div class="desc">${o.owner}</div></div></div></td>
      <td><span class="tag gold">${o.plan}</span></td>
      <td>${o.used||0}/${o.seats} مقعد</td>
      <td>${(o.policies||0).toLocaleString('en-US')} بوليصة</td>
      <td>${o.premium||0} ج.م</td>
      <td><span class="badge ${o.status==='نشط'?'b-active':o.status==='تجريبي'?'b-review':'b-suspended'}">${o.status}</span></td>
      <td><label class="switch"><input type="checkbox" data-id="${o.id}" ${o.status!=='موقوف'?'checked':''}><span class="slider"></span></label></td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{
    const org=CACHE.orgs.find(x=>x.id===e.target.dataset.id); if(!org) return;
    org.status=e.target.checked?'نشط':'موقوف';
    if(DEMO) W(ORGS_KEY,CACHE.orgs); else db.collection('organizations').doc(org.id).set({status:org.status},{merge:true});
    pushAudit(`تم ${e.target.checked?'تفعيل':'إيقاف'} مكتب "${org.name}"`);
    toast(`تم ${e.target.checked?'تفعيل':'إيقاف'} مكتب "${org.name}"`);
    renderOrgs();
  }));
}
function createOrg(){
  const name=document.getElementById('orgName').value.trim();
  const owner=document.getElementById('orgOwner').value.trim();
  const plan=document.getElementById('orgPlan').value;
  const seats=parseInt(document.getElementById('orgSeats').value||'1',10);
  if(!name||!owner){toast('من فضلك أدخل اسم المكتب والبريد الإلكتروني',true);return;}
  const org={id:'org_'+Date.now(),name,owner,plan,seats,used:0,status:'نشط',joined:new Date().toLocaleDateString('ar-EG'),policies:0,premium:'0'};
  if(DEMO){CACHE.orgs.push(org); W(ORGS_KEY,CACHE.orgs);} else {db.collection('organizations').add(org);}
  pushAudit(`تم إنشاء مكتب وساطة جديد: "${name}"`);
  toast('تم إضافة المكتب بنجاح');
  closeModal('orgOverlay'); renderOrgs(); renderCounts();
  document.getElementById('orgName').value=''; document.getElementById('orgOwner').value='';
}

/* ============ Users ============ */
function setUserField(id,field,value){ if(DEMO){const u=CACHE.users.find(x=>x.id===id); if(u) u[field]=value; W(USERS_KEY,CACHE.users); return;} db.collection('users').doc(id).set({[field]:value},{merge:true}); }
function renderUsers(){
  const tbody=document.getElementById('usersTbody'); tbody.innerHTML='';
  CACHE.users.forEach(u=>{
    const name=u.name||u.email||u.id, role=u.role||'وسيط', status=u.status||'نشط';
    const leadsCount=CACHE.leads.filter(l=>(l.createdBy===u.id)||(l.submittedBy===name)).length;
    const org=CACHE.orgs.find(o=>o.id===u.orgId);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><div style="display:flex;gap:9px;align-items:center"><div class="avatar">${name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
        <div><div class="name">${name}${u.isDemo?' <span class="badge b-demo">تجريبي</span>':''}</div><div class="desc">${u.email||'—'}${org?' · '+org.name:''}</div></div></div></td>
      <td><select class="sel" data-id="${u.id}" data-f="role">${['وسيط','وسيط أول','مدير مكتب'].map(r=>`<option ${r===role?'selected':''}>${r}</option>`).join('')}</select></td>
      <td>${leadsCount} طلب مُدخل</td>
      <td><span class="badge ${status==='نشط'?'b-active':'b-suspended'}">${status}</span></td>
      <td><label class="switch"><input type="checkbox" data-id="${u.id}" data-f="status" ${status==='نشط'?'checked':''}><span class="slider"></span></label></td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('select[data-f=role]').forEach(s=>s.addEventListener('change',e=>{
    setUserField(e.target.dataset.id,'role',e.target.value);
    pushAudit(`تم تغيير دور "${CACHE.users.find(x=>x.id===e.target.dataset.id)?.name||e.target.dataset.id}" إلى ${e.target.value}`);
    toast('تم تحديث الدور'); if(DEMO) renderUsers();
  }));
  tbody.querySelectorAll('input[data-f=status]').forEach(c=>c.addEventListener('change',e=>{
    const val=e.target.checked?'نشط':'موقوف'; setUserField(e.target.dataset.id,'status',val);
    pushAudit(`تم ${e.target.checked?'تفعيل':'إيقاف'} حساب "${CACHE.users.find(x=>x.id===e.target.dataset.id)?.name||e.target.dataset.id}"`);
    toast(`تم ${e.target.checked?'تفعيل':'إيقاف'} الحساب`);
    if(DEMO){renderUsers();renderCounts();}
  }));
}
function seedDemoUsers(){
  const batch=DEMO_SEED_NAMES.map((n,i)=>({id:'demo_'+Date.now()+'_'+i,name:n,email:n.replace(' ','.')+'@demo.brokeros.app',role:'وسيط',status:'نشط',isDemo:true,joined:new Date().toLocaleDateString('ar-EG')}));
  if(DEMO){CACHE.users=[...CACHE.users,...batch]; W(USERS_KEY,CACHE.users); renderUsers(); renderCounts(); pushAudit(`تمت إضافة ${batch.length} مستخدمين تجريبيين`); toast('تمت إضافة مستخدمين تجريبيين'); return;}
  batch.forEach(u=>{const {id,...data}=u; db.collection('users').doc(id).set(data);});
  pushAudit(`تمت إضافة ${batch.length} مستخدمين تجريبيين إلى Firestore`);
}
function clearDemoUsers(){
  if(DEMO){CACHE.users=CACHE.users.filter(u=>!u.isDemo); W(USERS_KEY,CACHE.users); renderUsers(); renderCounts(); pushAudit('تم حذف كل المستخدمين التجريبيين'); toast('تم الحذف'); return;}
  db.collection('users').where('isDemo','==',true).get().then(snap=>snap.forEach(d=>d.ref.delete()));
}

/* ============ Catalog: insurers / products ============ */
function renderChips(type){
  const list=type==='insurers'?CACHE.insurers:CACHE.products;
  const wrap=document.getElementById(type==='insurers'?'insurersChips':'productsChips'); wrap.innerHTML='';
  list.forEach((item,i)=>{
    const name=typeof item==='string'?item:item.name;
    const c=document.createElement('span'); c.className='chip'; c.innerHTML=`${name}<button data-i="${i}" data-id="${item.id||''}">×</button>`;
    wrap.appendChild(c);
  });
  wrap.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{
    const i=+e.target.dataset.i, id=e.target.dataset.id, name=typeof list[i]==='string'?list[i]:list[i].name;
    if(DEMO){list.splice(i,1); W(type==='insurers'?INSURERS_KEY:PRODUCTS_KEY,list); renderChips(type);}
    else{db.collection(type).doc(id).delete();}
    pushAudit(`تم حذف "${name}" من ${type==='insurers'?'شركات التأمين':'أنواع المنتجات'}`);
  }));
}
function addItem(type){
  const inputId=type==='insurers'?'insurerInput':'productInput'; const input=document.getElementById(inputId); const val=input.value.trim(); if(!val) return;
  if(DEMO){const key=type==='insurers'?INSURERS_KEY:PRODUCTS_KEY; const list=type==='insurers'?CACHE.insurers:CACHE.products; list.push(val); W(key,list); renderChips(type);}
  else{db.collection(type).add({name:val});}
  input.value=''; pushAudit(`تم إضافة "${val}" إلى ${type==='insurers'?'شركات التأمين':'أنواع المنتجات'}`); toast('تمت الإضافة');
}

/* ============ Page content editor ============ */
function loadPageEditor(){ const sel=document.getElementById('pcPageSelect'); sel.innerHTML=PAGES.map(p=>`<option value="${p.key}">${p.name}</option>`).join(''); fillPageEditor(); sel.onchange=fillPageEditor; }
function fillPageEditor(){ const key=document.getElementById('pcPageSelect').value; const c=CACHE.pageContent[key]||{}; document.getElementById('pcTitle').value=c.title||''; document.getElementById('pcSubtitle').value=c.subtitle||''; }
function savePageContent(){
  const key=document.getElementById('pcPageSelect').value;
  const title=document.getElementById('pcTitle').value.trim(), subtitle=document.getElementById('pcSubtitle').value.trim();
  saveConfigPatch({pageContent:{[key]:{title,subtitle}}});
  pushAudit(`تم تعديل محتوى صفحة "${PAGES.find(p=>p.key===key).name}"`); toast('تم الحفظ');
}

/* ============ Broadcast + leads queue + audit ============ */
function sendBroadcast(){
  const el=document.getElementById('broadcastText'); const text=el.value.trim(); if(!text) return;
  if(DEMO){const list=J(NOTIFS_KEY,[]); list.unshift({t:text,d:'الآن'}); W(NOTIFS_KEY,list.slice(0,30));}
  else{db.collection('broadcastNotifications').add({t:text,d:'الآن',ts:firebase.firestore.FieldValue.serverTimestamp()});}
  el.value=''; pushAudit(`تم بث إشعار جديد لكل المستخدمين: "${text}"`); toast('تم البث لكل المستخدمين');
}
function setLeadStatus(id,val){
  if(DEMO){const all=CACHE.leads; const l=all.find(x=>x.id===id); if(l){const prev=l.status; l.status=val; W(LEADS_KEY,all); pushAudit(`تغيير حالة طلب «${l.name}» من "${prev}" إلى "${val}"`); renderLeads(); renderCounts();}}
  else{db.collection('leads').doc(id).update({status:val}); pushAudit(`تغيير حالة طلب إلى "${val}"`);}
}
function renderLeads(){
  document.getElementById('qTag').textContent=CACHE.leads.length;
  const tbody=document.querySelector('#leadsTable tbody'); tbody.innerHTML='';
  [...CACHE.leads].reverse().forEach(l=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${l.name}</td><td>${l.phone||'—'}</td><td>${l.type}</td><td>${l.submittedBy||l.createdBy||'—'}</td>
      <td><select class="sel" data-id="${l.id}">${['جديد','قيد المراجعة','مقبول','مرفوض'].map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('emptyMsg').style.display=CACHE.leads.length?'none':'block';
  document.querySelectorAll('#leadsTable select').forEach(sel=>sel.addEventListener('change',e=>setLeadStatus(e.target.dataset.id,e.target.value)));
}
function renderAudit(){
  const wrap=document.getElementById('auditList'); wrap.innerHTML=CACHE.audit.length?'':'<div class="empty">لا توجد أحداث بعد.</div>';
  CACHE.audit.forEach(l=>{const d=document.createElement('div');d.className='log-item';d.innerHTML=`<i class="fa-solid fa-circle-dot"></i><div><b>${l.time}</b> — ${l.text}${l.by?` <span class="muted">(${l.by})</span>`:''}</div>`;wrap.appendChild(d);});
}
function renderAll(){
  renderToggleList(document.getElementById('pagesList'),PAGES,'pages');
  renderToggleList(document.getElementById('widgetsList'),WIDGETS,'widgets');
  renderChips('insurers'); renderChips('products'); loadPageEditor();
  renderCounts(); renderUsers(); renderOrgs(); renderLeads(); renderAudit();
}

function loginHTML(err){
  return `<div id="login"><div class="login-box"><div class="login-brand"><img src="broker-os-logo.png" alt="Broker-OS"><span>Technology Platform</span></div><h1>تسجيل دخول المدير</h1><p class="subtitle">هذا الحساب يجب أن يكون له مستند في مجموعة <code>platformAdmins</code> في Firestore.</p>
    <div class="field"><label>البريد الإلكتروني</label><input id="loginEmail" type="email" placeholder="admin@brokeros.app"></div>
    <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" placeholder="••••••••"></div>
    <button class="btn btn-gold" onclick="doSignIn()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button><div class="loginerr">${err||''}</div></div></div>`;
}
function doSignIn(){
  const email=document.getElementById('loginEmail').value.trim(), pass=document.getElementById('loginPass').value;
  auth.signInWithEmailAndPassword(email,pass).then(cred=>{
    return db.collection('platformAdmins').doc(cred.user.uid).get().then(doc=>{
      if(!doc.exists){auth.signOut(); mount(loginHTML('هذا الحساب ليس لديه صلاحيات Platform Admin.')); return;}
      ME_UID=cred.user.uid; ME_NAME=cred.user.email;
      mount(dashboardHTML()); bindFirebaseListeners(); loadPageEditor();
    });
  }).catch(e=>mount(loginHTML('فشل تسجيل الدخول: '+e.message)));
}
function doSignOut(){auth.signOut(); mount(loginHTML());}
function mount(html){document.getElementById('app').innerHTML=html;}

if(DEMO){
  loadDemoAll(); mount(dashboardHTML()); renderAll();
  window.addEventListener('storage',()=>{loadDemoAll();renderAll();});
  setInterval(()=>{loadDemoAll();renderAll();},2500);
}else{
  mount(loginHTML());
  auth.onAuthStateChanged(user=>{
    if(user){ db.collection('platformAdmins').doc(user.uid).get().then(doc=>{ if(doc.exists){ME_UID=user.uid;ME_NAME=user.email; mount(dashboardHTML()); bindFirebaseListeners(); loadPageEditor();} }); }
  });
}
document.addEventListener('click',e=>{ if(e.target.classList&&e.target.classList.contains('overlay')) e.target.classList.remove('show'); });
</script>
