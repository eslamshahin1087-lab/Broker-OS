<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broker OS — لوحة إدارة المنصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{--navy:#0B1F3A;--gold:#C9A227;--gold2:#E4C660;--bg:#0F1620;--panel:#141D2B;--card:#1A2434;--text:#E9EDF4;--muted:#8C99B0;--line:#26324A;
--ok:#22C55E;--warn:#F59E0B;--bad:#EF4444;--info:#60A5FA}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2c3a52;border-radius:8px}
.side{width:230px;flex:0 0 230px;background:var(--panel);border-inline-end:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy)}
.brand b{font-size:15.5px}.brand span{display:block;font-size:10.5px;color:var(--muted)}
.nav-g{font-size:10.5px;color:#5c6b85;margin:14px 6px 5px}
.nav a{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:9px;color:#cfd8e8;font-size:13.5px;margin-bottom:2px}
.nav a:hover{background:#1f2b40}
.connbox{margin-top:14px;padding:10px;border-radius:10px;font-size:10.5px;line-height:1.6}
.conn-demo{background:#3a2c0f;color:#fcd34d;border:1px solid #5a4419}
.conn-live{background:#123420;color:#86efac;border:1px solid #1f5c38}
.signout{margin-top:8px;width:100%;background:none;border:1px solid var(--line);color:var(--muted);padding:6px;border-radius:8px;font-family:inherit;font-size:11px;cursor:pointer}
.main{flex:1;min-width:0;padding:20px 24px 60px;max-width:1060px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.topbar h1{font-size:19px;margin:0}
.pill{background:#152036;border:1px solid var(--line);padding:7px 13px;border-radius:30px;font-size:11.5px;color:var(--muted)}
.pill b{color:var(--gold)}
.banner{background:#1c2a10;border:1px solid #3a5218;color:#d9f2b0;border-radius:14px;padding:14px 16px;margin-bottom:18px;font-size:12.5px;line-height:1.8}
.banner b{color:#fff}
.banner code{background:#0F1826;padding:1px 6px;border-radius:5px;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;position:relative}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--gold);border-radius:4px 0 0 4px}
.kpi .v{font-size:21px;font-weight:800}.kpi .l{font-size:11px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:14.5px;margin:0 0 3px;display:flex;justify-content:space-between;align-items:center}
.card p.sub{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.tag{font-size:10.5px;background:#152036;color:var(--info);padding:3px 8px;border-radius:20px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .name{font-size:13px;font-weight:600}.row .desc{font-size:11px;color:var(--muted)}
.ic{width:24px;text-align:center;font-size:14px}
.switch{position:relative;width:40px;height:23px;flex:0 0 40px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#2c3a52;border-radius:24px;cursor:pointer;transition:.2s}
.slider:before{content:"";position:absolute;height:17px;width:17px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
input:checked+.slider{background:var(--gold)}input:checked+.slider:before{transform:translateX(-17px)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:start;color:var(--muted);font-weight:600;font-size:11px;padding:7px;border-bottom:1px solid var(--line)}
td{padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
select.sel,input.inl,textarea.inl{background:#0F1826;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-family:inherit;font-size:11.5px}
.badge{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.b-new{background:#152036;color:var(--info)}.b-review{background:#3a2c0f;color:var(--warn)}
.b-approved,.b-active{background:#123420;color:var(--ok)}.b-rejected,.b-suspended{background:#3a1414;color:var(--bad)}
.b-demo{background:#152036;color:#9db3d6}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:14px}
.log-item{font-size:11.5px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.log-item:last-child{border-bottom:none}.log-item b{color:var(--text)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#152036;border:1px solid var(--line);color:var(--text);font-size:11.5px;padding:5px 6px 5px 10px;border-radius:20px;margin:0 5px 6px 0}
.chip button{background:none;border:none;color:var(--bad);font-size:13px;cursor:pointer;font-weight:800}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1}
.addrow button,.actbtn{background:var(--gold);color:var(--navy);border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:11.5px;cursor:pointer;font-family:inherit}
.actbtn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.txtarea{width:100%;background:#0F1826;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;font-size:12.5px;resize:vertical}
.avatar-sm{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--navy),#12315C);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.loginwrap{margin:auto;width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.loginwrap h1{font-size:18px;margin:0 0 4px}
.loginwrap p{font-size:12px;color:var(--muted);margin:0 0 18px}
.loginwrap input{width:100%;padding:11px 13px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:#0F1826;color:var(--text);font-family:inherit;font-size:13px}
.loginwrap button{width:100%;background:var(--gold);color:var(--navy);border:none;padding:11px;border-radius:10px;font-weight:700;font-family:inherit;cursor:pointer}
.loginerr{color:var(--bad);font-size:11.5px;margin-top:8px;min-height:16px}
.cfg-steps{font-size:11px;color:var(--muted);line-height:1.8;margin-top:6px}
</style>
</head>
<body>
<div id="app" style="display:flex;width:100%"></div>

<script>
/* ============ 1) Firebase config — matches project broker-os-7df4b ============
   authDomain/projectId are already correct for this project.
   apiKey / appId / messagingSenderId / storageBucket are NOT secret but are project-specific:
   get them from Firebase Console → Project settings (gear icon) → General →
   "Your apps" → Web app → SDK setup and configuration, then paste them below.
   Until you do, this panel runs in local Demo Mode (no real data, safe to explore). */
const firebaseConfig = {
  apiKey: "AIzaSyBc_zK1eS5vBo1lRFL53cavstrU9ncdydI",
  authDomain: "broker-os-7df4b.firebaseapp.com",
  projectId: "broker-os-7df4b",
  storageBucket: "broker-os-7df4b.firebasestorage.app",
  messagingSenderId: "882880749734",
  appId: "1:882880749734:web:24df7eb1a914100e841467",
  measurementId: "G-W6L9G9RM47"
};
const DEMO = firebaseConfig.apiKey.indexOf('YOUR_')===0;
let db=null, auth=null, ME_UID=null, ME_NAME='مدير المنصة';

if(!DEMO){
  firebase.initializeApp(firebaseConfig);
  db=firebase.firestore(); auth=firebase.auth();
}

/* ============ 2) Local demo-mode storage (used until real config is added) ============ */
const FLAGS_KEY='brokeros_flags', LEADS_KEY='brokeros_leads', AUDIT_KEY='brokeros_audit_log',
      USERS_KEY='brokeros_users', INSURERS_KEY='brokeros_insurers', PRODUCTS_KEY='brokeros_products',
      NOTIFS_KEY='brokeros_notifications', CONTENT_KEY='brokeros_page_content';
function J(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function W(k,v){localStorage.setItem(k,JSON.stringify(v))}

/* ============ 3) Catalog of every page & home-widget the app can show ============ */
const PAGES=[
  {key:'home',name:'الرئيسية',desc:'الشاشة الافتتاحية والمؤشرات',ic:'⌂'},
  {key:'clients',name:'العملاء',desc:'قائمة العملاء وبياناتهم',ic:'◧'},
  {key:'leads',name:'العملاء المحتملون',desc:'استقبال طلبات جديدة',ic:'◈'},
  {key:'quotes',name:'عروض الأسعار',desc:'إنشاء ومتابعة العروض',ic:'◫'},
  {key:'policies',name:'وثائقي (بوليصات)',desc:'البوليصات النشطة',ic:'◉'},
  {key:'claims',name:'المطالبات',desc:'متابعة مطالبات العملاء',ic:'✦'},
  {key:'payments',name:'المدفوعات',desc:'سجل التحصيل والمدفوعات',ic:'◍'},
  {key:'renewals',name:'التجديدات',desc:'تنبيهات التجديد القادمة',ic:'⟳'},
  {key:'documents',name:'المستندات',desc:'خزنة الوثائق الآمنة',ic:'▤'},
  {key:'notifications',name:'الإشعارات',desc:'مركز الإشعارات',ic:'●'},
  {key:'analytics',name:'أداء الوسيط',desc:'تحليلات ومؤشرات الأداء',ic:'▲'},
  {key:'medical',name:'الاستهلاك الطبي',desc:'تحليل استخدام التأمين الصحي',ic:'✚'},
  {key:'commissions',name:'العمولات',desc:'متابعة العمولات المستحقة',ic:'¤'},
  {key:'compare',name:'مقارنة العروض',desc:'مقارنة عروض شركات التأمين',ic:'⇄'},
  {key:'profile',name:'حسابي',desc:'الإعدادات والدعم الفني',ic:'◐'},
];
const WIDGETS=[
  {key:'kpi',name:'بطاقات المؤشرات',desc:'عدد العملاء، الفرص، التحصيل'},
  {key:'funnel',name:'مسار العمل (Funnel)',desc:'Lead → Opportunity → Policy'},
  {key:'quickActions',name:'الإجراءات السريعة',desc:'إضافة عميل، عرض سعر، مستند'},
  {key:'renewalAlerts',name:'تنبيه التجديدات',desc:'شريط تنبيه البوليصات القريبة من الانتهاء'},
  {key:'activityFeed',name:'آخر النشاطات',desc:'سجل الأحداث الأخيرة'},
  {key:'supportCard',name:'بطاقة الدعم الفني',desc:'تواصل سريع مع فريق الدعم'},
];
const DEFAULT_USERS=[
  {id:'u1',name:'إسلام شاهين',email:'eslam@brokeros.app',role:'وسيط أول',status:'نشط',joined:'2025-11-02'},
  {id:'u2',name:'مايكل عزيز',email:'michael@brokeros.app',role:'وسيط',status:'نشط',joined:'2026-01-15'},
  {id:'u3',name:'ندى حسن',email:'nada@brokeros.app',role:'وسيط',status:'نشط',joined:'2026-03-20'},
];
const DEFAULT_INSURERS=['مصر للتأمين','اليانز','ميت لايف','إكسا','ساكو'];
const DEFAULT_PRODUCTS=['تأمين سيارات','تأمين صحي','تأمين حياة','تأمين ممتلكات'];
const DEMO_SEED_NAMES=['مصطفى الجندي','هبة سالم','يوسف مراد','ريهام فوزي','عمر شكري'];

/* ============ 4) In-memory live cache (filled either by Firestore listeners or demo reads) ============ */
let CACHE={pages:{},widgets:{},pageContent:{},users:[],insurers:[],products:[],notifications:[],leads:[],audit:[]};
PAGES.forEach(p=>CACHE.pages[p.key]=true); WIDGETS.forEach(w=>CACHE.widgets[w.key]=true);

function pushAuditDemo(t){const log=J(AUDIT_KEY,[]);log.push({text:t,time:new Date().toLocaleString('ar-EG')});W(AUDIT_KEY,log.slice(-50));CACHE.audit=[...log].reverse();}
function pushAudit(t){
  if(DEMO){pushAuditDemo(t);renderAudit();return;}
  db.collection('auditLogs').add({text:t,by:ME_NAME,time:new Date().toLocaleString('ar-EG'),ts:firebase.firestore.FieldValue.serverTimestamp()});
}

/* ============ 5) Data layer: identical render functions read from CACHE either way ============ */
function loadDemoAll(){
  const flagsRaw=J(FLAGS_KEY,{}); CACHE.pages={...CACHE.pages,...(flagsRaw.pages||{})}; CACHE.widgets={...CACHE.widgets,...(flagsRaw.widgets||{})};
  CACHE.pageContent=J(CONTENT_KEY,{});
  CACHE.users=J(USERS_KEY,null)||(W(USERS_KEY,DEFAULT_USERS),DEFAULT_USERS);
  CACHE.insurers=J(INSURERS_KEY,DEFAULT_INSURERS);
  CACHE.products=J(PRODUCTS_KEY,DEFAULT_PRODUCTS);
  CACHE.notifications=J(NOTIFS_KEY,[]);
  CACHE.leads=J(LEADS_KEY,[]);
  CACHE.audit=[...J(AUDIT_KEY,[])].reverse();
}
function bindFirebaseListeners(){
  db.collection('platformSettings').doc('appConfig').onSnapshot(doc=>{
    const d=doc.data()||{};
    CACHE.pages={...CACHE.pages,...(d.pages||{})}; CACHE.widgets={...CACHE.widgets,...(d.widgets||{})};
    CACHE.pageContent=d.pageContent||{}; renderAll();
  });
  db.collection('users').onSnapshot(snap=>{CACHE.users=snap.docs.map(d=>({id:d.id,...d.data()})); renderUsers(); renderCounts();});
  db.collection('insurers').onSnapshot(snap=>{CACHE.insurers=snap.docs.map(d=>({id:d.id,name:d.data().name})); renderChips('insurers');});
  db.collection('products').onSnapshot(snap=>{CACHE.products=snap.docs.map(d=>({id:d.id,name:d.data().name})); renderChips('products');});
  db.collection('broadcastNotifications').orderBy('ts','desc').limit(30).onSnapshot(snap=>{CACHE.notifications=snap.docs.map(d=>d.data());});
  db.collection('leads').orderBy('createdAt','desc').limit(100).onSnapshot(snap=>{CACHE.leads=snap.docs.map(d=>({id:d.id,...d.data()})); renderLeads(); renderCounts();});
  db.collection('auditLogs').orderBy('ts','desc').limit(50).onSnapshot(snap=>{CACHE.audit=snap.docs.map(d=>d.data()); renderAudit();});
}

/* ============ 6) Flags / page-content writes ============ */
function saveConfigPatch(patch){
  if(DEMO){
    const cur=J(FLAGS_KEY,{pages:{},widgets:{}}); const merged={pages:{...cur.pages,...(patch.pages||{})},widgets:{...cur.widgets,...(patch.widgets||{})}};
    W(FLAGS_KEY,merged);
    if(patch.pageContent){const c=J(CONTENT_KEY,{});W(CONTENT_KEY,{...c,...patch.pageContent});}
    Object.assign(CACHE.pages,patch.pages||{}); Object.assign(CACHE.widgets,patch.widgets||{});
    if(patch.pageContent) Object.assign(CACHE.pageContent,patch.pageContent);
    return;
  }
  db.collection('platformSettings').doc('appConfig').set(patch,{merge:true});
}

function renderToggleList(container,items,section){
  container.innerHTML='';
  items.forEach(it=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div style="display:flex;gap:9px;align-items:center">${it.ic?`<span class="ic">${it.ic}</span>`:''}<div><div class="name">${it.name}</div><div class="desc">${it.desc}</div></div></div>
      <label class="switch"><input type="checkbox" data-section="${section}" data-key="${it.key}" ${CACHE[section][it.key]!==false?'checked':''}><span class="slider"></span></label>`;
    container.appendChild(row);
  });
  container.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{
    const sec=e.target.dataset.section,key=e.target.dataset.key;
    saveConfigPatch({[sec]:{[key]:e.target.checked}});
    const label=(sec==='pages'?PAGES:WIDGETS).find(x=>x.key===key)?.name||key;
    pushAudit(`تم ${e.target.checked?'تفعيل':'تعطيل'} "${label}" في تطبيق المستخدم`);
    renderCounts();
  }));
}
function renderCounts(){
  document.getElementById('kPages').textContent=`${PAGES.filter(p=>CACHE.pages[p.key]!==false).length}/${PAGES.length}`;
  document.getElementById('kWidgets').textContent=`${WIDGETS.filter(w=>CACHE.widgets[w.key]!==false).length}/${WIDGETS.length}`;
  document.getElementById('kActiveUsers').textContent=CACHE.users.filter(u=>(u.status||'نشط')==='نشط').length;
  document.getElementById('kSuspended').textContent=CACHE.users.filter(u=>u.status==='موقوف').length;
  document.getElementById('kNew').textContent=CACHE.leads.filter(l=>l.status==='جديد').length;
}

/* ============ 7) Users: view every account, change role, suspend / activate, seed demo users ============ */
function setUserField(id,field,value){
  if(DEMO){const u=CACHE.users.find(x=>x.id===id); if(u) u[field]=value; W(USERS_KEY,CACHE.users); return;}
  db.collection('users').doc(id).set({[field]:value},{merge:true});
}
function renderUsers(){
  const tbody=document.getElementById('usersTbody'); tbody.innerHTML='';
  CACHE.users.forEach(u=>{
    const name=u.name||u.email||u.id, role=u.role||'وسيط', status=u.status||'نشط';
    const leadsCount=CACHE.leads.filter(l=>(l.createdBy===u.id)||(l.submittedBy===name)).length;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><div style="display:flex;gap:8px;align-items:center"><div class="avatar-sm">${name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>
        <div><div class="name">${name}${u.isDemo?' <span class="badge b-demo">تجريبي</span>':''}</div><div class="desc">${u.email||u.organizationId||'—'}</div></div></div></td>
      <td><select class="sel" data-id="${u.id}" data-f="role">${['وسيط','وسيط أول','مدير'].map(r=>`<option ${r===role?'selected':''}>${r}</option>`).join('')}</select></td>
      <td>${leadsCount} طلب مُدخل</td>
      <td><span class="badge ${status==='نشط'?'b-active':'b-suspended'}">${status}</span></td>
      <td><label class="switch"><input type="checkbox" data-id="${u.id}" data-f="status" ${status==='نشط'?'checked':''}><span class="slider"></span></label></td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('select[data-f=role]').forEach(s=>s.addEventListener('change',e=>{
    setUserField(e.target.dataset.id,'role',e.target.value);
    pushAudit(`تم تغيير دور "${CACHE.users.find(x=>x.id===e.target.dataset.id)?.name||e.target.dataset.id}" إلى ${e.target.value}`);
    if(DEMO) renderUsers();
  }));
  tbody.querySelectorAll('input[data-f=status]').forEach(c=>c.addEventListener('change',e=>{
    const val=e.target.checked?'نشط':'موقوف'; setUserField(e.target.dataset.id,'status',val);
    pushAudit(`تم ${e.target.checked?'تفعيل':'إيقاف'} حساب "${CACHE.users.find(x=>x.id===e.target.dataset.id)?.name||e.target.dataset.id}"`);
    if(DEMO){renderUsers();renderCounts();}
  }));
}
function seedDemoUsers(){
  const batch=DEMO_SEED_NAMES.map((n,i)=>({id:'demo_'+Date.now()+'_'+i,name:n,email:n.replace(' ','.')+'@demo.brokeros.app',role:'وسيط',status:'نشط',isDemo:true,joined:new Date().toLocaleDateString('ar-EG')}));
  if(DEMO){CACHE.users=[...CACHE.users,...batch]; W(USERS_KEY,CACHE.users); renderUsers(); renderCounts(); pushAudit(`تمت إضافة ${batch.length} مستخدمين تجريبيين`); return;}
  batch.forEach(u=>{const {id,...data}=u; db.collection('users').doc(id).set(data);});
  pushAudit(`تمت إضافة ${batch.length} مستخدمين تجريبيين إلى Firestore`);
}
function clearDemoUsers(){
  if(DEMO){CACHE.users=CACHE.users.filter(u=>!u.isDemo); W(USERS_KEY,CACHE.users); renderUsers(); renderCounts(); pushAudit('تم حذف كل المستخدمين التجريبيين'); return;}
  db.collection('users').where('isDemo','==',true).get().then(snap=>snap.forEach(d=>d.ref.delete()));
  pushAudit('تم حذف كل المستخدمين التجريبيين من Firestore');
}

/* ============ 8) Insurers / products catalog — add or remove freely ============ */
function renderChips(type){
  const list=type==='insurers'?CACHE.insurers:CACHE.products;
  const wrap=document.getElementById(type==='insurers'?'insurersChips':'productsChips'); wrap.innerHTML='';
  list.forEach((item,i)=>{
    const name=typeof item==='string'?item:item.name;
    const c=document.createElement('span'); c.className='chip'; c.innerHTML=`${name}<button data-i="${i}" data-id="${item.id||''}">×</button>`;
    wrap.appendChild(c);
  });
  wrap.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{
    const i=+e.target.dataset.i, id=e.target.dataset.id, name=typeof list[i]==='string'?list[i]:list[i].name;
    if(DEMO){list.splice(i,1); W(type==='insurers'?INSURERS_KEY:PRODUCTS_KEY,list); renderChips(type);}
    else{db.collection(type).doc(id).delete();}
    pushAudit(`تم حذف "${name}" من ${type==='insurers'?'شركات التأمين':'أنواع المنتجات'}`);
  }));
}
function addItem(type){
  const inputId=type==='insurers'?'insurerInput':'productInput'; const input=document.getElementById(inputId); const val=input.value.trim(); if(!val) return;
  if(DEMO){const key=type==='insurers'?INSURERS_KEY:PRODUCTS_KEY; const list=type==='insurers'?CACHE.insurers:CACHE.products; list.push(val); W(key,list); renderChips(type);}
  else{db.collection(type).add({name:val});}
  input.value=''; pushAudit(`تم إضافة "${val}" إلى ${type==='insurers'?'شركات التأمين':'أنواع المنتجات'}`);
}

/* ============ 9) Page content editor — edit any page's title/subtitle now or later ============ */
function loadPageEditor(){
  const sel=document.getElementById('pcPageSelect'); sel.innerHTML=PAGES.map(p=>`<option value="${p.key}">${p.name}</option>`).join('');
  fillPageEditor(); sel.onchange=fillPageEditor;
}
function fillPageEditor(){
  const key=document.getElementById('pcPageSelect').value; const c=CACHE.pageContent[key]||{};
  document.getElementById('pcTitle').value=c.title||''; document.getElementById('pcSubtitle').value=c.subtitle||'';
}
function savePageContent(){
  const key=document.getElementById('pcPageSelect').value;
  const title=document.getElementById('pcTitle').value.trim(), subtitle=document.getElementById('pcSubtitle').value.trim();
  saveConfigPatch({pageContent:{[key]:{title,subtitle}}});
  pushAudit(`تم تعديل محتوى صفحة "${PAGES.find(p=>p.key===key).name}"`);
}

/* ============ 10) Broadcast + leads queue + audit log ============ */
function sendBroadcast(){
  const el=document.getElementById('broadcastText'); const text=el.value.trim(); if(!text) return;
  if(DEMO){const list=J(NOTIFS_KEY,[]); list.unshift({t:text,d:'الآن'}); W(NOTIFS_KEY,list.slice(0,30));}
  else{db.collection('broadcastNotifications').add({t:text,d:'الآن',ts:firebase.firestore.FieldValue.serverTimestamp()});}
  el.value=''; pushAudit(`تم بث إشعار جديد لكل المستخدمين: "${text}"`);
}
function statusBadge(s){const m={'جديد':'b-new','قيد المراجعة':'b-review','مقبول':'b-approved','مرفوض':'b-rejected'};return `<span class="badge ${m[s]||'b-new'}">${s}</span>`}
function setLeadStatus(id,val){
  if(DEMO){const all=CACHE.leads; const l=all.find(x=>x.id===id); if(l){const prev=l.status; l.status=val; W(LEADS_KEY,all); pushAudit(`تغيير حالة طلب «${l.name}» من "${prev}" إلى "${val}"`); renderLeads(); renderCounts();}}
  else{db.collection('leads').doc(id).update({status:val}); pushAudit(`تغيير حالة طلب إلى "${val}"`);}
}
function renderLeads(){
  document.getElementById('qTag').textContent=CACHE.leads.length;
  const tbody=document.querySelector('#leadsTable tbody'); tbody.innerHTML='';
  [...CACHE.leads].reverse().forEach(l=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${l.name}</td><td>${l.phone||'—'}</td><td>${l.type}</td><td>${l.submittedBy||l.createdBy||'—'}</td>
      <td><select class="sel" data-id="${l.id}">${['جديد','قيد المراجعة','مقبول','مرفوض'].map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('emptyMsg').style.display=CACHE.leads.length?'none':'block';
  document.querySelectorAll('#leadsTable select').forEach(sel=>sel.addEventListener('change',e=>setLeadStatus(e.target.dataset.id,e.target.value)));
}
function renderAudit(){
  const wrap=document.getElementById('auditList'); wrap.innerHTML=CACHE.audit.length?'':'<div class="empty">لا توجد أحداث بعد.</div>';
  CACHE.audit.forEach(l=>{const d=document.createElement('div');d.className='log-item';d.innerHTML=`<b>${l.time}</b> — ${l.text}${l.by?` <span style="color:#5c6b85">(${l.by})</span>`:''}`;wrap.appendChild(d);});
}

function renderAll(){
  renderToggleList(document.getElementById('pagesList'),PAGES,'pages');
  renderToggleList(document.getElementById('widgetsList'),WIDGETS,'widgets');
  renderChips('insurers'); renderChips('products'); loadPageEditor();
  renderCounts(); renderUsers(); renderLeads(); renderAudit();
}

function loginHTML(err){
  return `<div class="loginwrap"><h1>تسجيل دخول المدير</h1><p>هذا الحساب يجب أن يكون له مستند في مجموعة <code style="background:#0F1826;padding:1px 6px;border-radius:5px">platformAdmins</code> في Firestore.</p>
    <input id="loginEmail" type="email" placeholder="البريد الإلكتروني">
    <input id="loginPass" type="password" placeholder="كلمة المرور">
    <button onclick="doSignIn()">دخول</button><div class="loginerr">${err||''}</div></div>`;
}
function doSignIn(){
  const email=document.getElementById('loginEmail').value.trim(), pass=document.getElementById('loginPass').value;
  auth.signInWithEmailAndPassword(email,pass).then(cred=>{
    return db.collection('platformAdmins').doc(cred.user.uid).get().then(doc=>{
      if(!doc.exists){auth.signOut(); mount(loginHTML('هذا الحساب ليس لديه صلاحيات Platform Admin.')); return;}
      ME_UID=cred.user.uid; ME_NAME=cred.user.email;
      mount(dashboardHTML()); bindFirebaseListeners(); loadPageEditor();
    });
  }).catch(e=>mount(loginHTML('فشل تسجيل الدخول: '+e.message)));
}
function doSignOut(){auth.signOut(); mount(loginHTML());}
function mount(html){document.getElementById('app').innerHTML=html; document.getElementById('app').style.display=html.indexOf('loginwrap')>-1?'flex':'flex';}

if(DEMO){
  loadDemoAll(); mount(dashboardHTML()); renderAll();
  window.addEventListener('storage',()=>{loadDemoAll();renderAll();});
  setInterval(()=>{loadDemoAll();renderAll();},2500);
}else{
  mount(loginHTML());
  auth.onAuthStateChanged(user=>{
    if(user){
      db.collection('platformAdmins').doc(user.uid).get().then(doc=>{
        if(doc.exists){ME_UID=user.uid;ME_NAME=user.email; mount(dashboardHTML()); bindFirebaseListeners(); loadPageEditor();}
      });
    }
  });
}
