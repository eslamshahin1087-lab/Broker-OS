<style>
/* ============================================================
   BROKER OS v20 — TOKENS
   ============================================================ */
:root{
  --font-app:'IBM Plex Sans Arabic','Readex Pro',system-ui,-apple-system,sans-serif;
  --font-latin:'Manrope',system-ui,sans-serif;

  --fs-2xs:10px;--fs-xs:11px;--fs-sm:12px;--fs-base:13px;
  --fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:24px;

  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;--fw-black:800;

  --lh-tight:1.15;--lh-snug:1.3;--lh-normal:1.5;--lh-relaxed:1.7;
  --tracking-tight:-.3px;--tracking-normal:0;--tracking-wide:.3px;--tracking-wider:.6px;

  --brand-500:#4E3FC7;--brand-600:#3F32A8;--brand-400:#7C5AE0;--brand-300:#A66CDA;
  --brand-gradient:linear-gradient(135deg,#4E3FC7 0%,#7C5AE0 55%,#A66CDA 100%);
  --brand-gradient-soft:linear-gradient(135deg,rgba(78,63,199,.08) 0%,rgba(166,108,218,.06) 100%);
  --gold-gradient:linear-gradient(135deg,#F59E0B 0%,#FBBF24 55%,#FCD34D 100%);

  --success-500:#1B9A62;--warning-500:#C1811A;--danger-500:#D93025;--info-500:#3569D6;

  --r-xs:8px;--r-sm:10px;--r-md:12px;--r-lg:16px;--r-xl:20px;--r-2xl:26px;--r-full:999px;

  --sp-1:4px;--sp-2:6px;--sp-3:8px;--sp-4:12px;--sp-5:16px;--sp-6:20px;--sp-7:24px;--sp-8:32px;

  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --dur-fast:140ms;--dur:200ms;--dur-slow:320ms;

  --app-width:430px;
  --topbar-h:72px;
  --bottomnav-h:76px;
  --gutter:16px;
}

:root,
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F5F6FA;
  --bg-elev-0:#F5F6FA;--bg-elev-1:#FFFFFF;--bg-elev-2:#FAFAFC;--bg-elev-3:#F1F1F5;
  --surface:#FFFFFF;--surface-2:#FAFAFC;--surface-3:#F4F4F8;--surface-inverse:#1B1A20;
  --line:#E7E5EE;--line-strong:#D4D1DE;
  --text-1:#171522;--text-2:#4A4656;--text-3:#7A7688;--text-inverse:#FFFFFF;
  --icon-1:#4A4656;--icon-2:#7A7688;
  --primary:#4E3FC7;--primary-hover:#3F32A8;--primary-soft:#EFEBFF;--primary-on-soft:#4E3FC7;
  --success-bg:#E6F5EE;--success-fg:#0E7A4C;
  --warning-bg:#FEF3E2;--warning-fg:#9C6810;
  --danger-bg:#FCEAE8;--danger-fg:#B0241A;
  --info-bg:#EBF0FE;--info-fg:#2751B0;
  --gold-bg:#FEF6E0;--gold-fg:#9C6810;
  --shadow-sm:0 1px 2px rgba(23,21,34,.04),0 2px 6px rgba(23,21,34,.03);
  --shadow-md:0 4px 12px rgba(23,21,34,.06),0 8px 20px rgba(23,21,34,.04);
  --shadow-lg:0 12px 28px rgba(23,21,34,.10),0 24px 60px rgba(23,21,34,.08);
  --shadow-fab:0 14px 30px rgba(78,63,199,.32),0 6px 12px rgba(78,63,199,.20);
  --overlay:rgba(20,18,32,.45);
}

:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B14;
  --bg-elev-0:#0B0B14;--bg-elev-1:#15141F;--bg-elev-2:#1C1B28;--bg-elev-3:#242333;
  --surface:#15141F;--surface-2:#1C1B28;--surface-3:#242333;--surface-inverse:#F5F5F7;
  --line:#2A2838;--line-strong:#3A374D;
  --text-1:#F2F0F7;--text-2:#C8C4D4;--text-3:#8F8A9E;--text-inverse:#0B0B14;
  --icon-1:#C8C4D4;--icon-2:#8F8A9E;
  --primary:#9B84F2;--primary-hover:#B096F7;--primary-soft:rgba(155,132,242,.14);--primary-on-soft:#C5B6FB;
  --success-bg:rgba(27,154,98,.16);--success-fg:#4ED9A0;
  --warning-bg:rgba(193,129,26,.16);--warning-fg:#F0B854;
  --danger-bg:rgba(217,48,37,.16);--danger-fg:#F17A70;
  --info-bg:rgba(53,105,214,.16);--info-fg:#7BA0F0;
  --gold-bg:rgba(245,158,11,.16);--gold-fg:#FBBF24;
  --shadow-sm:0 1px 2px rgba(0,0,0,.32),0 2px 6px rgba(0,0,0,.24);
  --shadow-md:0 4px 14px rgba(0,0,0,.42),0 8px 22px rgba(0,0,0,.28);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55),0 28px 70px rgba(0,0,0,.40);
  --shadow-fab:0 14px 30px rgba(0,0,0,.55),0 6px 12px rgba(0,0,0,.35);
  --overlay:rgba(0,0,0,.66);
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:var(--font-app);font-size:var(--fs-base);font-weight:var(--fw-regular);
  line-height:var(--lh-normal);letter-spacing:var(--tracking-normal);color:var(--text-1);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;font-feature-settings:"kern","liga","calt";
  display:flex;justify-content:center;align-items:center;overscroll-behavior:none;touch-action:manipulation;
  transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease);
}
button,input,select,textarea{font:inherit;font-family:var(--font-app);color:inherit}
button{border:0;cursor:pointer;background:none}
a{color:inherit;text-decoration:none}

[data-lucide],svg.lucide{
  width:1em;height:1em;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  flex:0 0 auto;color:currentColor;vertical-align:middle;
  transition:color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
}

#app{width:100%;height:100dvh;display:flex;justify-content:center;align-items:stretch;background:var(--bg)}
.shell.mobile-app-shell{
  width:min(100%,var(--app-width));height:min(100dvh,920px);
  margin:0;border-radius:0;overflow:hidden;background:var(--bg);box-shadow:none;
  display:block;position:relative;
}
.mobile-app-shell .workspace{
  height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--bg);position:relative;
}

/* TOPBAR */
.app-topbar{
  min-height:var(--topbar-h);
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter) 10px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:var(--sp-3);position:relative;z-index:30;
}
.brand-inline{min-width:0;display:flex;align-items:center;gap:10px;overflow:hidden}
.app-symbol{
  width:40px;height:40px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;flex:0 0 auto;padding:3px;box-shadow:var(--shadow-sm);
  transition:transform var(--dur-fast) var(--ease);
}
.app-symbol:active{transform:scale(.94)}
.app-symbol svg{width:100%;height:100%;display:block}
.page-back{
  width:36px;height:36px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--icon-1);display:grid;place-items:center;flex:0 0 auto;
  transition:all var(--dur-fast) var(--ease);
}
.page-back:active{transform:scale(.94);background:var(--surface-3)}
.page-back svg{width:18px;height:18px}
.page-title{min-width:0;flex:1;overflow:hidden;display:grid;gap:1px}
.page-title .eyebrow{
  font-size:var(--fs-2xs);font-weight:var(--fw-medium);color:var(--text-3);
  letter-spacing:var(--tracking-wider);text-transform:uppercase;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.page-title h1{
  font-size:var(--fs-lg);font-weight:var(--fw-semibold);line-height:var(--lh-snug);
  letter-spacing:var(--tracking-tight);color:var(--text-1);margin:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top-actions{display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto}

.icon-btn{
  width:38px;height:38px;min-width:38px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);color:var(--icon-1);
  display:inline-flex;align-items:center;justify-content:center;
  transition:all var(--dur-fast) var(--ease);position:relative;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text-1);border-color:var(--line-strong)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.accent{
  background:var(--primary);color:#fff;border-color:transparent;
  box-shadow:0 4px 10px color-mix(in srgb,var(--primary) 28%,transparent);
}
.icon-btn.accent:hover{background:var(--primary-hover)}
.icon-btn.accent svg{color:#fff}
.icon-btn.lang-badge{
  width:auto!important;min-width:48px!important;height:38px!important;padding:0 12px!important;
  font-family:var(--font-latin)!important;font-weight:800!important;font-size:11px!important;
  letter-spacing:.6px;color:var(--primary)!important;background:var(--primary-soft)!important;border-color:transparent!important;
}
.icon-btn.lang-badge:hover{background:color-mix(in srgb,var(--primary) 22%,transparent)!important}
.icon-btn.lang-badge:active{transform:scale(.94)}

/* Subscription status dot on avatar */
.avatar{
  width:38px;height:38px;border-radius:var(--r-md);
  background:var(--brand-gradient);color:#fff;
  font-weight:var(--fw-bold);font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;
  border:0;position:relative;letter-spacing:.2px;
  transition:transform var(--dur-fast) var(--ease);
}
.avatar:active{transform:scale(.94)}
.avatar .sub-dot{
  position:absolute;bottom:-1px;inset-inline-end:-1px;
  width:12px;height:12px;border-radius:50%;
  background:var(--surface);display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface);
}
.avatar .sub-dot::after{
  content:"";width:8px;height:8px;border-radius:50%;
  background:var(--text-3);
}
.avatar .sub-dot.active::after{background:var(--success-500);animation:pulseDot 2.2s ease-in-out infinite}
.avatar .sub-dot.pending::after{background:var(--warning-500);animation:pulseDot 1.6s ease-in-out infinite}
.avatar .sub-dot.expired::after{background:var(--danger-500)}

.notif-dot{
  position:absolute;width:8px;height:8px;border-radius:50%;
  background:var(--danger-500);top:6px;inset-inline-end:6px;
  box-shadow:0 0 0 2.5px var(--surface);
  animation:pulseDot 2.2s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}

/* CONTENT */
.app-content-scroll{
  position:relative;flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg);
}
.mobile-app-shell .content{
  width:100%;max-width:none;margin:0;
  padding:var(--gutter) var(--gutter) calc(var(--bottomnav-h) + 24px + env(safe-area-inset-bottom,0px));
  background:var(--bg);scrollbar-width:none;
}
.mobile-app-shell .content::-webkit-scrollbar{display:none}

/* BOTTOM NAV */
.app-bottom-nav{
  display:grid;position:absolute;
  left:12px;right:12px;
  bottom:calc(10px + env(safe-area-inset-bottom,0px));
  height:var(--bottomnav-h);grid-template-columns:repeat(5,minmax(0,1fr));
  gap:var(--sp-1);padding:6px;border-radius:var(--r-2xl);
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:70;
}
.app-bottom-nav .nav-btn{
  height:100%;min-height:54px;border-radius:var(--r-lg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;background:transparent;color:var(--text-3);
  transition:all var(--dur-fast) var(--ease);position:relative;padding:4px 2px;
}
.app-bottom-nav .nav-btn:active{transform:scale(.95)}
.app-bottom-nav .nav-btn.active{background:var(--primary-soft);color:var(--primary)}
.app-bottom-nav .nav-icon{width:24px;height:24px;display:grid;place-items:center;transition:transform var(--dur-fast) var(--ease)}
.app-bottom-nav .nav-btn.active .nav-icon{transform:translateY(-1px)}
.app-bottom-nav .nav-icon svg{width:20px;height:20px;stroke-width:2}
.app-bottom-nav .nav-label{font-size:var(--fs-2xs);font-weight:var(--fw-semibold);letter-spacing:.1px;line-height:1}

/* PAGE STRUCTURE */
.page-view{display:grid;gap:var(--sp-4);min-width:0;width:100%}
.grid{display:grid;gap:var(--sp-4)}
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);transition:all var(--dur) var(--ease)}
.card.interactive{cursor:pointer}
.card.interactive:active{transform:scale(.985);box-shadow:var(--shadow-md)}
.pad{padding:var(--sp-5)}

.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.section-head h2,.section-head h3{margin:0;font-size:var(--fs-md);font-weight:var(--fw-semibold);line-height:var(--lh-snug);letter-spacing:var(--tracking-tight);color:var(--text-1)}
.section-head p{margin:3px 0 0;font-size:var(--fs-xs);color:var(--text-3);line-height:var(--lh-normal)}

/* BUTTONS */
.btn{
  min-height:42px;padding:0 14px;border-radius:var(--r-md);
  font-size:var(--fs-sm);font-weight:var(--fw-semibold);
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-3);
  transition:all var(--dur-fast) var(--ease);border:1px solid transparent;line-height:1;white-space:nowrap;
}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--primary) 24%,transparent)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-soft{background:var(--primary-soft);color:var(--primary-on-soft)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--text-1)}
.btn-outline:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-gold{background:var(--gold-gradient);color:#fff;box-shadow:0 6px 16px rgba(245,158,11,.32)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-whatsapp{background:#25D366;color:#fff;box-shadow:0 6px 16px rgba(37,211,102,.32)}
.btn-whatsapp:hover{background:#1FB855}

/* LIST ITEMS */
.list{display:grid;gap:var(--sp-3)}
.list-item{
  display:flex;align-items:center;gap:var(--sp-4);padding:12px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);min-width:0;
  transition:all var(--dur-fast) var(--ease);
}
.list-item:hover{background:var(--surface-2);border-color:var(--line-strong)}
.list-item .li-icon{width:40px;height:40px;border-radius:var(--r-md);background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.list-item .li-icon svg{width:19px;height:19px}
.list-item .li-main{min-width:0;flex:1;overflow:hidden;display:grid;gap:2px}
.list-item .li-title{font-size:var(--fs-base);font-weight:var(--fw-semibold);color:var(--text-1);line-height:var(--lh-snug);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-sub{font-size:var(--fs-xs);color:var(--text-3);line-height:var(--lh-normal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-actions{display:flex;gap:var(--sp-2);flex:0 0 auto}

/* FORM */
.input{
  height:46px;width:100%;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-md);padding:0 14px;font-size:var(--fs-base);color:var(--text-1);
  transition:all var(--dur-fast) var(--ease);
}
.input::placeholder{color:var(--text-3)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent)}
textarea.input{height:auto;min-height:104px;padding:12px;resize:vertical;line-height:var(--lh-relaxed)}
select.input{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--icon-2) 50%),linear-gradient(135deg,var(--icon-2) 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:36px}
html[dir="rtl"] select.input{background-position:18px center,13px center}
.form-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-4)}
.field{display:grid;gap:var(--sp-2)}
.field.full{grid-column:1/-1}
.field label{font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-2);letter-spacing:.1px}
.field small{font-size:var(--fs-2xs);color:var(--text-3)}

/* STATUS */
.status{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-full);font-size:var(--fs-2xs);font-weight:var(--fw-semibold);letter-spacing:.15px;flex:0 0 auto;border:1px solid transparent;line-height:1.2}
.status.ok{background:var(--success-bg);color:var(--success-fg);border-color:color-mix(in srgb,var(--success-500) 18%,transparent)}
.status.warn{background:var(--warning-bg);color:var(--warning-fg);border-color:color-mix(in srgb,var(--warning-500) 18%,transparent)}
.status.bad{background:var(--danger-bg);color:var(--danger-fg);border-color:color-mix(in srgb,var(--danger-500) 18%,transparent)}
.status.info{background:var(--info-bg);color:var(--info-fg);border-color:color-mix(in srgb,var(--info-500) 18%,transparent)}
.status.purple{background:var(--primary-soft);color:var(--primary-on-soft);border-color:color-mix(in srgb,var(--primary) 18%,transparent)}
.status.gold{background:var(--gold-bg);color:var(--gold-fg);border-color:color-mix(in srgb,var(--warning-500) 22%,transparent)}

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface-2);padding:6px 10px;border-radius:var(--r-full);font-size:var(--fs-2xs);font-weight:var(--fw-semibold);color:var(--text-2);line-height:1.2}

/* METRIC CARDS */
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-4)}
.metric-card{
  display:grid;grid-template-columns:42px 1fr;grid-template-rows:auto auto;
  column-gap:var(--sp-4);align-items:center;padding:14px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);transition:all var(--dur) var(--ease);
}
.metric-card:active{transform:scale(.985)}
.metric-card .metric-icon{grid-row:1/3;width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;color:#fff}
.metric-card .metric-icon svg{width:20px;height:20px;color:#fff}
.metric-icon.red{background:linear-gradient(135deg,#4E3FC7,#7C5AE0)}
.metric-icon.violet{background:linear-gradient(135deg,#7C5AE0,#A66CDA)}
.metric-icon.amber{background:linear-gradient(135deg,#C1811A,#E0A140)}
.metric-icon.blue{background:linear-gradient(135deg,#3569D6,#6D8FF0)}
.metric-icon.green{background:linear-gradient(135deg,#1B9A62,#4EC58B)}
.metric-icon.gold{background:var(--gold-gradient)}
.metric-card b{font-size:var(--fs-xl);font-weight:var(--fw-bold);color:var(--text-1);line-height:1.1;letter-spacing:-.4px;font-family:var(--font-latin)}
.metric-card small{font-size:var(--fs-2xs);color:var(--text-3);font-weight:var(--fw-semibold);margin-top:2px;letter-spacing:.1px}
.metric-card .metric-trend{grid-column:2;font-size:var(--fs-2xs);font-weight:var(--fw-semibold);display:inline-flex;align-items:center;gap:4px;margin-top:3px}
.metric-trend.up{color:var(--success-fg)}
.metric-trend.down{color:var(--danger-fg)}

/* HERO */
.welcome-hero{
  display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:var(--sp-4);align-items:stretch;
  padding:20px;border-radius:var(--r-2xl);position:relative;overflow:hidden;min-height:188px;
  background:var(--brand-gradient-soft);
  border:1px solid color-mix(in srgb,var(--primary) 14%,var(--line));color:var(--text-1);
}
:root[data-theme="dark"] .welcome-hero{
  background:linear-gradient(140deg,rgba(78,63,199,.18) 0%,rgba(166,108,218,.10) 60%,rgba(78,63,199,.08) 100%);
  border-color:color-mix(in srgb,var(--primary) 22%,var(--line));
}
.welcome-hero::after{
  content:"";position:absolute;width:240px;height:240px;inset-inline-end:-110px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--primary) 16%,transparent),transparent 68%);pointer-events:none;
}
.welcome-copy{position:relative;z-index:2;min-width:0;display:grid;align-content:start;gap:var(--sp-3)}
.eyebrow-badge{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--r-full);
  background:var(--surface);border:1px solid color-mix(in srgb,var(--primary) 18%,var(--line));
  color:var(--primary-on-soft);font-size:var(--fs-2xs);font-weight:var(--fw-semibold);
  letter-spacing:.15px;line-height:1;align-self:flex-start;
}
.eyebrow-badge svg{width:13px;height:13px}
.welcome-copy h2{font-size:var(--fs-2xl);line-height:1.12;margin:0;color:var(--text-1);letter-spacing:-.5px;font-family:var(--font-latin);font-weight:var(--fw-black)}
.welcome-copy p{margin:0;color:var(--text-2);font-size:var(--fs-sm);line-height:var(--lh-relaxed)}
.hero-cta-row{display:flex;gap:var(--sp-3);margin-top:var(--sp-3);flex-wrap:wrap}
.btn-ghost-light{background:var(--surface);color:var(--primary-on-soft);border:1px solid color-mix(in srgb,var(--primary) 18%,var(--line))}
.btn-ghost-light:hover{background:var(--surface-2)}
.hero-orb{position:relative;z-index:1;display:grid;place-items:center}
.hero-orb > svg{width:72px;height:72px;border-radius:var(--r-xl);box-shadow:var(--shadow-md);position:relative;z-index:3;background:var(--surface);padding:4px}
.orb-ring{position:absolute;border:1px solid color-mix(in srgb,var(--primary) 12%,transparent);border-radius:50%}
.orb-ring.r1{width:92px;height:92px}
.orb-ring.r2{width:130px;height:130px;border-color:color-mix(in srgb,var(--primary) 6%,transparent)}

/* COMMAND STRIP */
.command-strip{display:grid;gap:var(--sp-3)}
.command-search{
  width:100%;height:48px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-lg);display:flex;align-items:center;gap:var(--sp-3);padding:0 14px;
  color:var(--text-3);font-size:var(--fs-sm);font-weight:var(--fw-medium);
  box-shadow:var(--shadow-sm);transition:all var(--dur-fast) var(--ease);text-align:start;
}
.command-search svg{width:18px;height:18px;color:var(--text-3)}
.command-search:hover{border-color:var(--line-strong)}
.command-search:active{transform:scale(.985);border-color:var(--primary)}
.command-search span{flex:1;color:var(--text-3)}
.command-search kbd{
  font-size:var(--fs-2xs);padding:4px 7px;border:1px solid var(--line);border-bottom-width:2px;
  border-radius:6px;background:var(--surface-2);color:var(--text-3);
  font-family:var(--font-latin);font-weight:var(--fw-semibold);letter-spacing:.3px;line-height:1;
}

/* MARQUEE — medium speed 22s */
.insight-strip{
  position:relative;overflow:hidden;padding:2px 0 4px;
  mask-image:linear-gradient(to right,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
}
.insight-strip-track{
  display:flex;gap:var(--sp-3);width:max-content;
  animation:insightMarquee 22s linear infinite;will-change:transform;
  padding-inline-end:var(--sp-3);
}
.insight-strip:hover .insight-strip-track,
.insight-strip:active .insight-strip-track,
.insight-strip:focus-within .insight-strip-track{animation-play-state:paused}
@keyframes insightMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
html[dir="ltr"] .insight-strip-track{animation-name:insightMarqueeLTR}
@keyframes insightMarqueeLTR{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.insight-chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line);
  color:var(--text-2);font-size:var(--fs-xs);font-weight:var(--fw-semibold);
  white-space:nowrap;box-shadow:var(--shadow-sm);line-height:1.2;
}
.insight-chip strong{color:var(--primary);font-size:var(--fs-base);font-weight:var(--fw-bold);font-family:var(--font-latin);letter-spacing:-.2px}
.insight-chip svg{width:13px;height:13px;color:var(--primary)}
.insight-chip.alert svg{color:var(--warning-500)}
.insight-chip.alert strong{color:var(--warning-fg)}

/* FEATURE TILES */
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.feature-tile{
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;
  align-items:center;gap:10px;width:100%;min-height:92px;padding:12px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);text-align:start;transition:all var(--dur) var(--ease);
  position:relative;overflow:hidden;
}
.feature-tile::before{content:"";position:absolute;inset:0;background:var(--brand-gradient-soft);opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none}
.feature-tile:hover::before{opacity:1}
.feature-tile:hover{border-color:color-mix(in srgb,var(--primary) 25%,var(--line));box-shadow:var(--shadow-md)}
.feature-tile:active{transform:scale(.98)}
.feature-icon{
  width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;
  border-radius:var(--r-md);background:var(--primary-soft);color:var(--primary);
  position:relative;z-index:1;
}
.feature-icon svg{width:20px;height:20px}
.feature-tile:nth-child(4n+2) .feature-icon{background:color-mix(in srgb,var(--warning-500) 14%,transparent);color:var(--warning-fg)}
.feature-tile:nth-child(4n+3) .feature-icon{background:color-mix(in srgb,var(--success-500) 14%,transparent);color:var(--success-fg)}
.feature-tile:nth-child(4n) .feature-icon{background:color-mix(in srgb,var(--info-500) 14%,transparent);color:var(--info-fg)}
.feature-copy{min-width:0;display:grid;gap:2px;position:relative;z-index:1}
.feature-copy b{font-size:var(--fs-xs);color:var(--text-1);font-weight:var(--fw-semibold);line-height:var(--lh-snug)}
.feature-copy small{font-size:var(--fs-2xs);line-height:1.4;color:var(--text-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feature-arrow{color:var(--text-3);flex:0 0 auto;position:relative;z-index:1}
.feature-arrow svg{width:15px;height:15px}

/* HOME */
.home-stack{display:grid;gap:var(--sp-5);padding-bottom:var(--sp-3)}
.home-module-section{display:grid;gap:0}
.home-module-section .section-head{margin-bottom:var(--sp-3)}
.home-panels{display:grid;gap:var(--sp-4)}

.mini-row{
  display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;
  width:100%;padding:11px 0;border-top:1px solid var(--line);background:transparent;text-align:start;
  transition:background var(--dur-fast) var(--ease);
}
.mini-row:first-of-type{border-top:0;padding-top:3px}
.mini-row:last-of-type{padding-bottom:3px}
.mini-row:hover{background:var(--surface-2);margin-inline:-10px;padding-inline:10px;border-radius:10px;border-top-color:transparent}
.row-icon{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}
.row-icon svg{width:16px;height:16px}
.mini-row > span:nth-child(2){display:grid;gap:2px;min-width:0}
.mini-row b{font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-1);line-height:var(--lh-snug);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row small{font-size:var(--fs-2xs);color:var(--text-3);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-badge{font-size:var(--fs-2xs);font-weight:var(--fw-bold);padding:4px 9px;border-radius:var(--r-full);background:var(--warning-bg);color:var(--warning-fg);font-family:var(--font-latin);letter-spacing:.1px;line-height:1.2;min-width:38px;text-align:center}
.row-badge.ok{background:var(--success-bg);color:var(--success-fg)}
.row-badge.bad{background:var(--danger-bg);color:var(--danger-fg)}
.row-arrow{color:var(--text-3)}
.row-arrow svg{width:14px;height:14px}

/* AI HOME CARD */
.ai-home-card{
  display:grid;grid-template-columns:50px 1fr;gap:var(--sp-4);align-items:start;padding:16px;
  border-radius:var(--r-xl);background:var(--brand-gradient-soft);
  border:1px solid color-mix(in srgb,var(--primary) 16%,var(--line));
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
:root[data-theme="dark"] .ai-home-card{
  background:linear-gradient(140deg,rgba(78,63,199,.18),rgba(166,108,218,.10));
  border-color:color-mix(in srgb,var(--primary) 24%,var(--line));
}
.ai-home-icon{
  width:50px;height:50px;border-radius:var(--r-lg);display:grid;place-items:center;
  background:var(--brand-gradient);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 30%,transparent);
}
.ai-home-icon svg{width:22px;height:22px}
.ai-home-copy{display:grid;gap:var(--sp-2)}
.ai-home-copy b{font-size:var(--fs-base);color:var(--text-1);font-weight:var(--fw-semibold);line-height:var(--lh-snug)}
.ai-home-copy p{margin:0;font-size:var(--fs-xs);line-height:var(--lh-normal);color:var(--text-2)}
.ai-chips{display:flex;gap:var(--sp-2);overflow:auto;scrollbar-width:none;padding-top:var(--sp-1)}
.ai-chips::-webkit-scrollbar{display:none}
.ai-chips button{
  padding:6px 11px;border-radius:var(--r-sm);background:var(--surface);color:var(--primary-on-soft);
  font-size:var(--fs-2xs);font-weight:var(--fw-semibold);white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--primary) 16%,var(--line));
  transition:all var(--dur-fast) var(--ease);line-height:1.2;
}
.ai-chips button:hover{background:var(--primary-soft);border-color:var(--primary)}

/* EMAIL HOME CARD */
.email-home-card{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-sm);
}
.email-home-card > div:first-child{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.email-copy{min-width:0;flex:1;display:grid;gap:2px}
.email-copy b{font-size:var(--fs-xs);color:var(--text-1);font-weight:var(--fw-semibold);line-height:var(--lh-snug)}
.email-copy span{font-size:var(--fs-2xs);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.email-icon{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:0 0 auto}
.email-icon svg{width:18px;height:18px}
.email-actions{display:flex;gap:var(--sp-2);flex:0 0 auto}
.email-contact{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);margin-top:var(--sp-3)}
.email-contact svg{color:var(--primary);width:16px;height:16px}
.email-contact strong{font-size:var(--fs-xs);color:var(--text-1);display:block;font-weight:var(--fw-semibold)}
.email-contact small{display:block;color:var(--text-3);font-size:var(--fs-2xs);margin-top:1px}

/* SUBSCRIPTION BANNER (dashboard) */
.subscription-banner{
  display:grid;grid-template-columns:48px 1fr auto;gap:var(--sp-4);align-items:center;
  padding:14px 16px;border-radius:var(--r-lg);
  background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--warning-500) 26%,var(--line));
  box-shadow:var(--shadow-sm);cursor:pointer;
  transition:all var(--dur-fast) var(--ease);
}
.subscription-banner:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.subscription-banner:active{transform:scale(.985)}
.subscription-banner.active{background:var(--success-bg);border-color:color-mix(in srgb,var(--success-500) 26%,var(--line))}
.subscription-banner.pending{background:var(--info-bg);border-color:color-mix(in srgb,var(--info-500) 26%,var(--line))}
.subscription-banner.expired{background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger-500) 26%,var(--line))}
.subscription-banner .icon-wrap{
  width:48px;height:48px;border-radius:var(--r-md);display:grid;place-items:center;
  background:var(--gold-gradient);color:#fff;flex:0 0 auto;
}
.subscription-banner.active .icon-wrap{background:linear-gradient(135deg,#1B9A62,#4EC58B)}
.subscription-banner.pending .icon-wrap{background:linear-gradient(135deg,#3569D6,#6D8FF0)}
.subscription-banner.expired .icon-wrap{background:linear-gradient(135deg,#D93025,#F17A70)}
.subscription-banner .icon-wrap svg{width:22px;height:22px;color:#fff}
.subscription-banner .copy{display:grid;gap:3px;min-width:0;flex:1}
.subscription-banner .copy b{font-size:var(--fs-base);font-weight:var(--fw-semibold);color:var(--text-1);line-height:var(--lh-snug)}
.subscription-banner .copy small{font-size:var(--fs-2xs);color:var(--text-2);line-height:1.4}
.subscription-banner .arrow{color:var(--text-3);flex:0 0 auto}
.subscription-banner .arrow svg{width:16px;height:16px}

/* SUBSCRIPTION PAGE / MODAL */
.plan-card{
  padding:20px;border-radius:var(--r-xl);
  background:linear-gradient(135deg,rgba(245,158,11,.10),rgba(251,191,36,.06));
  border:1px solid color-mix(in srgb,var(--warning-500) 24%,var(--line));
  position:relative;overflow:hidden;
}
:root[data-theme="dark"] .plan-card{
  background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(251,191,36,.08));
  border-color:color-mix(in srgb,var(--warning-500) 28%,var(--line));
}
.plan-card::after{
  content:"";position:absolute;width:200px;height:200px;inset-inline-end:-100px;top:-100px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,158,11,.18),transparent 70%);pointer-events:none;
}
.plan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4);position:relative;z-index:1}
.plan-head .crown{
  width:48px;height:48px;border-radius:var(--r-md);
  background:var(--gold-gradient);color:#fff;display:grid;place-items:center;flex:0 0 auto;
  box-shadow:0 8px 20px rgba(245,158,11,.32);
}
.plan-head .crown svg{width:22px;height:22px;color:#fff}
.plan-title{display:grid;gap:3px;min-width:0;flex:1}
.plan-title h3{margin:0;font-size:var(--fs-xl);font-weight:var(--fw-bold);color:var(--text-1);letter-spacing:-.3px;line-height:1.15}
.plan-title p{margin:0;font-size:var(--fs-xs);color:var(--text-3);line-height:1.4}
.plan-price{
  display:flex;align-items:baseline;gap:6px;margin:var(--sp-3) 0 var(--sp-4);
  position:relative;z-index:1;
}
.plan-price .amount{font-size:32px;font-weight:var(--fw-black);color:var(--text-1);letter-spacing:-.8px;font-family:var(--font-latin);line-height:1}
.plan-price .currency{font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--text-2)}
.plan-price .period{font-size:var(--fs-xs);color:var(--text-3);margin-inline-start:2px}
.plan-features{display:grid;gap:10px;margin-bottom:var(--sp-4);position:relative;z-index:1}
.plan-feature{display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);color:var(--text-2);line-height:1.4}
.plan-feature .check{
  width:22px;height:22px;border-radius:50%;background:var(--success-bg);color:var(--success-fg);
  display:grid;place-items:center;flex:0 0 auto;
}
.plan-feature .check svg{width:13px;height:13px}
.plan-actions{display:grid;gap:var(--sp-3);position:relative;z-index:1}

/* Usage meter */
.usage-meter{display:grid;gap:var(--sp-3);padding:14px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line)}
.usage-meter .usage-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.usage-meter .usage-head b{font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--text-1)}
.usage-meter .usage-head span{font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--primary);font-family:var(--font-latin)}
.usage-bar{height:8px;background:var(--surface-3);border-radius:var(--r-full);overflow:hidden}
.usage-bar .fill{height:100%;background:var(--brand-gradient);border-radius:var(--r-full);transition:width var(--dur-slow) var(--ease-out)}
.usage-bar .fill.warning{background:var(--gold-gradient)}
.usage-bar .fill.danger{background:var(--danger-500)}

/* FAB */
.quick-fab{
  position:absolute;right:20px;
  bottom:calc(var(--bottomnav-h) + 24px + env(safe-area-inset-bottom,0px));
  height:54px;border-radius:var(--r-lg);
  background:var(--brand-gradient);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-3);
  padding:0 18px;font-size:var(--fs-sm);font-weight:var(--fw-semibold);
  box-shadow:var(--shadow-fab);z-index:60;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  transition:box-shadow var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
  will-change:left,top;
}
.quick-fab svg{width:20px;height:20px;color:#fff;pointer-events:none}
.quick-fab span{pointer-events:none;white-space:nowrap}
.quick-fab:hover{box-shadow:0 18px 36px color-mix(in srgb,var(--primary) 40%,transparent)}
.quick-fab.dragging{cursor:grabbing;box-shadow:0 22px 44px rgba(78,63,199,.42);transform:scale(1.06);transition:none}
.quick-fab.dragging *{pointer-events:none}
.quick-fab.snapping{transition:left var(--dur-slow) var(--ease-out),top var(--dur-slow) var(--ease-out),transform var(--dur-fast) var(--ease)}

/* PAGE HEAD */
.inner-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4);padding:2px 1px 0}
.inner-page-copy{min-width:0;flex:1;display:grid;gap:var(--sp-1)}
.inner-page-kicker{display:flex;align-items:center;gap:6px;font-size:var(--fs-2xs);color:var(--primary);font-weight:var(--fw-semibold);letter-spacing:.2px;line-height:1.2}
.inner-page-kicker svg{width:14px;height:14px;color:var(--primary)}
.inner-page-copy h2{margin:0;font-size:var(--fs-2xl);line-height:var(--lh-tight);color:var(--text-1);letter-spacing:-.5px;font-weight:var(--fw-bold)}
.inner-page-copy p{margin:0;color:var(--text-3);font-size:var(--fs-xs);line-height:var(--lh-normal)}
.inner-page-actions{display:flex;align-items:center;flex:0 0 auto}
.page-add-btn{height:42px;border-radius:var(--r-md);padding:0 14px;font-size:var(--fs-sm)}

/* TOOLBAR */
.mobile-toolbar{display:block;margin-bottom:var(--sp-4)}
.mobile-search{
  width:100%;min-width:0;height:46px;border-radius:var(--r-md);background:var(--surface);
  display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line);color:var(--text-3);
  transition:all var(--dur-fast) var(--ease);
}
.mobile-search svg{width:16px;height:16px;color:var(--text-3)}
.mobile-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
.mobile-search input{border:0;outline:0;background:transparent;width:100%;font-size:var(--fs-base);color:var(--text-1);font-family:var(--font-app)}
.mobile-search input::placeholder{color:var(--text-3)}

/* COLLECTION */
.collection-card{padding:12px;border-radius:var(--r-xl)}
.collection-summary{display:flex;align-items:center;gap:12px;padding:6px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:11px}
.summary-icon{width:40px;height:40px;border-radius:var(--r-md);background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:0 0 auto}
.summary-icon svg{width:18px;height:18px}
.collection-summary > span:nth-child(2){display:grid;gap:2px;min-width:0;flex:1}
.collection-summary b{font-size:var(--fs-base);color:var(--text-1);font-weight:var(--fw-semibold);line-height:var(--lh-snug)}
.collection-summary small{font-size:var(--fs-2xs);color:var(--text-3);line-height:1.3}
.collection-add-icon{width:40px;height:40px;min-width:40px;border-radius:var(--r-md);background:var(--primary-soft);color:var(--primary);border-color:transparent}
.collection-list{gap:var(--sp-3)}

/* MORE */
.more-page{display:grid;gap:var(--sp-5)}
.more-hero{
  padding:16px;border-radius:var(--r-xl);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:12px;
}
.account-avatar{
  width:50px;height:50px;border-radius:var(--r-lg);background:var(--brand-gradient);color:#fff;
  display:grid;place-items:center;font-size:15px;font-weight:var(--fw-bold);flex:0 0 auto;letter-spacing:.3px;
}
.more-hero .copy{min-width:0;flex:1;display:grid;gap:2px}
.more-hero .copy b{font-size:var(--fs-base);color:var(--text-1);font-weight:var(--fw-semibold);line-height:var(--lh-snug)}
.more-hero .copy small{font-size:var(--fs-2xs);color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.more-section{display:grid;gap:var(--sp-3)}
.more-section-title{font-size:var(--fs-2xs);color:var(--text-3);font-weight:var(--fw-semibold);margin:2px 3px 0;text-transform:uppercase;letter-spacing:var(--tracking-wider);line-height:1.2}
.more-grid-page{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.more-item-row{
  display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);min-width:0;transition:all var(--dur-fast) var(--ease);text-align:start;
}
.more-item-row:hover{background:var(--surface-2);border-color:var(--line-strong);transform:translateY(-1px)}
.more-item-row:active{transform:scale(.98)}
.more-item-icon{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);flex:0 0 auto}
.more-item-icon svg{width:19px;height:19px}
.more-item-copy{display:grid;gap:2px;min-width:0;flex:1}
.more-item-copy b{font-size:var(--fs-xs);color:var(--text-1);font-weight:var(--fw-semibold);line-height:var(--lh-snug)}
.more-item-copy small{font-size:var(--fs-2xs);color:var(--text-3);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more-item-arrow{color:var(--text-3);flex:0 0 auto}
.more-item-arrow svg{width:14px;height:14px}
.more-control-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.more-control{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--sp-2);min-height:72px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-lg);color:var(--text-1);font-size:var(--fs-xs);font-weight:var(--fw-semibold);
  transition:all var(--dur-fast) var(--ease);padding:10px;
}
.more-control svg{width:18px;height:18px}
.more-control:hover{background:var(--surface-2);border-color:var(--line-strong)}
.more-control:active{transform:scale(.98)}
.more-control.danger{color:var(--danger-fg);background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger-500) 22%,var(--line))}
.more-control.gold{color:var(--gold-fg);background:var(--gold-bg);border-color:color-mix(in srgb,var(--warning-500) 22%,var(--line))}
.lang-pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:52px;height:24px;padding:0 10px;border-radius:var(--r-full);
  background:var(--primary-soft);color:var(--primary);
  font-family:var(--font-latin);font-weight:var(--fw-black);font-size:11px;letter-spacing:.6px;line-height:1;
}
.more-control.lang-toggle:hover .lang-pill{background:color-mix(in srgb,var(--primary) 22%,transparent)}

/* MODAL / DRAWER */
.modal-wrap{
  position:fixed;inset:0;z-index:110;background:var(--overlay);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity var(--dur) var(--ease);
}
.modal-wrap.show{display:flex;opacity:1}
.modal{
  width:min(100%,var(--app-width));max-height:88dvh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-2xl) var(--r-2xl) 0 0;box-shadow:var(--shadow-lg);
  animation:slideUp var(--dur-slow) var(--ease-out);
}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);z-index:2}
.modal-head h3{font-size:var(--fs-md);margin:0;font-weight:var(--fw-semibold);color:var(--text-1);letter-spacing:var(--tracking-tight)}
.modal-body{padding:16px 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:var(--sp-3);padding:14px 18px;border-top:1px solid var(--line);background:var(--surface);position:sticky;bottom:0}
.drawer{position:fixed;inset:0;z-index:100;pointer-events:none}
.drawer.show{pointer-events:auto}
.drawer::before{content:"";position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(6px);opacity:0;transition:opacity var(--dur) var(--ease)}
.drawer.show::before{opacity:1}
.drawer-panel{
  position:absolute;inset-inline:0;bottom:0;width:100%;max-height:91dvh;
  background:var(--bg);border-radius:var(--r-2xl) var(--r-2xl) 0 0;
  transform:translateY(100%);transition:transform var(--dur-slow) var(--ease-out);
  box-shadow:var(--shadow-lg);overflow:auto;
}
.drawer.show .drawer-panel{transform:translateY(0)}
.drawer-head{
  position:sticky;top:0;z-index:2;
  background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;
}
.drawer-body{padding:16px}

/* AUTH */
.auth-page{width:100%;min-height:100dvh;display:flex;justify-content:center;background:var(--bg);padding:0}
.auth-shell{width:min(100%,var(--app-width));height:100dvh;min-height:0;display:flex;flex-direction:column;background:var(--surface);overflow:hidden;box-shadow:none}
.auth-brand{padding:28px 20px 20px;text-align:center;background:var(--brand-gradient-soft);border-bottom:1px solid var(--line)}
:root[data-theme="dark"] .auth-brand{background:linear-gradient(180deg,rgba(78,63,199,.20),rgba(166,108,218,.10))}
.auth-brand svg{width:96px;height:96px;margin:0 auto 14px;display:block;border-radius:var(--r-2xl);box-shadow:var(--shadow-md);background:var(--surface);padding:8px}
.auth-brand h1{font-size:var(--fs-2xl);margin:6px 0 4px;color:var(--text-1);font-family:var(--font-latin);font-weight:var(--fw-black);letter-spacing:-.6px;line-height:var(--lh-tight)}
.auth-brand .tagline{font-size:var(--fs-2xs);color:var(--text-3);margin:auto;max-width:290px;line-height:var(--lh-normal)}
.auth-brand .bullets{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:16px}
.auth-brand .bullet{display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--fs-2xs);color:var(--text-2);background:var(--surface);border:1px solid var(--line);padding:9px 6px;border-radius:var(--r-md);font-weight:var(--fw-medium);line-height:1.2}
.auth-brand .bullet svg{width:14px;height:14px;color:var(--primary)}
.auth-card{flex:1;padding:20px 18px 30px;overflow:auto;background:var(--surface)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:var(--r-md);margin-bottom:16px}
.auth-tab{height:40px;border-radius:var(--r-sm);color:var(--text-3);font-size:var(--fs-sm);font-weight:var(--fw-semibold);background:transparent;transition:all var(--dur-fast) var(--ease)}
.auth-tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.auth-title{font-size:var(--fs-xl);margin:0 0 6px;color:var(--text-1);font-weight:var(--fw-bold);letter-spacing:var(--tracking-tight);line-height:var(--lh-snug)}
.auth-sub{margin:0 0 18px;font-size:var(--fs-xs);color:var(--text-3);line-height:var(--lh-normal)}
.auth-form{display:grid;gap:var(--sp-4)}
.auth-row{display:grid;grid-template-columns:1fr;gap:var(--sp-4)}
.checkbox{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--fs-xs);color:var(--text-2)}
.checkbox input{accent-color:var(--primary);width:16px;height:16px}
.account-type-head{display:flex;align-items:flex-start;justify-content:space-between;margin:2px 0 10px}
.account-type-head b{display:block;font-size:var(--fs-base);color:var(--text-1);font-weight:var(--fw-semibold)}
.account-type-head small{display:block;color:var(--text-3);font-size:var(--fs-2xs);margin-top:2px;line-height:var(--lh-normal)}
.account-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin-bottom:var(--sp-4)}
.account-type-option{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:var(--sp-2);padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);cursor:pointer;transition:all var(--dur-fast) var(--ease);min-height:94px}
.account-type-option input{position:absolute;opacity:0;pointer-events:none}
.account-type-option:has(input:checked){border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 16%,transparent)}
.account-type-icon{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface-2);color:var(--primary);flex:0 0 auto}
.account-type-icon svg{width:17px;height:17px}
.account-type-option:has(input:checked) .account-type-icon{background:var(--surface)}
.account-type-option b{display:block;font-size:var(--fs-2xs);color:var(--text-1);font-weight:var(--fw-semibold);line-height:var(--lh-snug)}
.account-type-option small{display:block;font-size:var(--fs-2xs);color:var(--text-3);line-height:1.35;margin-top:2px;opacity:.85}
.auth-foot{text-align:center;margin-top:16px;font-size:var(--fs-2xs);color:var(--text-3);display:grid;gap:var(--sp-3)}
.auth-foot button{color:var(--primary);font-weight:var(--fw-semibold)}
.lang-btn{justify-content:center}

/* MISC */
.empty{padding:40px 20px;text-align:center;color:var(--text-3);font-size:var(--fs-sm);line-height:var(--lh-normal)}
.empty .empty-icon{width:60px;height:60px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px;color:var(--primary)}
.empty .empty-icon svg{width:26px;height:26px}
.loading{display:grid;place-items:center;padding:44px;color:var(--text-3)}
.spinner{width:28px;height:28px;border:2.5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--text-3)}
.mini{font-size:var(--fs-2xs);color:var(--text-3);line-height:var(--lh-normal)}
.helper{font-size:var(--fs-2xs);color:var(--text-3);margin:6px 0 12px;line-height:var(--lh-relaxed)}
.section-space{margin-top:var(--sp-5)}
.split{display:flex;align-items:center;justify-content:space-between;gap:12px}
.actions{display:flex;gap:var(--sp-3);flex-wrap:wrap}
.notice{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:var(--r-md);background:var(--warning-bg);color:var(--warning-fg);font-size:var(--fs-xs);line-height:var(--lh-normal);border:1px solid color-mix(in srgb,var(--warning-500) 22%,transparent)}
.notice svg{width:16px;height:16px;flex:0 0 auto;margin-top:2px}
.notice.info{background:var(--info-bg);color:var(--info-fg);border-color:color-mix(in srgb,var(--info-500) 22%,transparent)}
.notice.ai{background:var(--primary-soft);color:var(--primary-on-soft);border-color:color-mix(in srgb,var(--primary) 22%,transparent)}
.notice.danger{background:var(--danger-bg);color:var(--danger-fg);border-color:color-mix(in srgb,var(--danger-500) 22%,transparent)}
.notice.success{background:var(--success-bg);color:var(--success-fg);border-color:color-mix(in srgb,var(--success-500) 22%,transparent)}
.dropzone{border:1.5px dashed color-mix(in srgb,var(--primary) 30%,var(--line));background:var(--surface-2);padding:26px 16px;border-radius:var(--r-xl);text-align:center;cursor:pointer;display:block;transition:all var(--dur) var(--ease)}
.dropzone:hover{border-color:var(--primary);background:var(--primary-soft)}
.dropzone input{display:none}
.dropzone svg{width:28px;height:28px;color:var(--primary)}
.dropzone strong{display:block;font-size:var(--fs-sm);margin-top:10px;color:var(--text-1);font-weight:var(--fw-semibold)}
.dropzone span{display:block;font-size:var(--fs-2xs);color:var(--text-3);margin-top:6px;line-height:var(--lh-normal)}
.ai-answer{white-space:pre-wrap;font-size:var(--fs-sm);line-height:var(--lh-relaxed);color:var(--text-2)}
.ai-source{font-size:var(--fs-2xs);color:var(--text-3);margin-top:10px;line-height:var(--lh-normal);padding-top:10px;border-top:1px solid var(--line)}
.ai-card{background:var(--surface)}
.timeline{display:grid;gap:12px}
.timeline-item{display:grid;grid-template-columns:32px 1fr;gap:12px}
.timeline-dot{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.timeline-dot svg{width:14px;height:14px}
.timeline-item h4{margin:0;font-size:var(--fs-sm);color:var(--text-1);font-weight:var(--fw-semibold);line-height:var(--lh-snug)}
.timeline-item p{margin:3px 0 0;color:var(--text-3);font-size:var(--fs-2xs)}
.bars{display:flex;align-items:flex-end;gap:var(--sp-3);height:150px;padding:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end}
.bar-fill{width:100%;max-width:42px;border-radius:8px 8px 4px 4px;background:var(--brand-gradient);min-height:4px;transition:height var(--dur-slow) var(--ease-out)}
.bar span{font-size:var(--fs-2xs);color:var(--text-3);font-weight:var(--fw-medium)}
.search-surface{padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);display:flex;align-items:center;gap:10px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.search-surface svg{width:18px;height:18px;color:var(--text-3)}
.search-surface input{border:0;outline:0;background:transparent;width:100%;font-size:var(--fs-base);color:var(--text-1)}
.search-surface input::placeholder{color:var(--text-3)}

/* BOOT */
.boot-screen{position:fixed;inset:0;z-index:999;display:grid;place-items:center;align-content:center;gap:14px;background:var(--bg);color:var(--text-1);text-align:center;padding:32px}
.boot-logo{width:88px;height:88px;border-radius:var(--r-2xl);display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow-lg);padding:8px;margin-bottom:6px}
.boot-logo svg{width:100%;height:100%;display:block}
.boot-brand{font-family:var(--font-latin);font-weight:var(--fw-black);font-size:var(--fs-2xl);letter-spacing:-.6px;color:var(--text-1);line-height:var(--lh-tight)}
.boot-sub{font-family:var(--font-app);font-weight:var(--fw-medium);font-size:var(--fs-xs);color:var(--text-3);max-width:280px;line-height:var(--lh-relaxed)}
.boot-spinner{width:24px;height:24px;border:2.5px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-top:8px}

.icon-btn:focus-visible,.btn:focus-visible,.nav-btn:focus-visible,.input:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 30%,transparent);outline-offset:2px}

@media(max-width:430px){
  #app{align-items:stretch}
  .shell.mobile-app-shell{height:100dvh;border-radius:0;box-shadow:none}
  .auth-shell{height:100dvh}
}
@media(max-width:360px){
  :root{--gutter:12px}
  .feature-grid,.more-grid-page,.more-control-row{grid-template-columns:1fr}
  .quick-fab span{display:none}
  .quick-fab{width:54px;padding:0;justify-content:center}
}
@media(min-width:431px){
  body{padding:18px 0;background:var(--bg-elev-3)}
  .shell.mobile-app-shell,.auth-shell{border-radius:28px;overflow:hidden;box-shadow:var(--shadow-lg);height:calc(100dvh - 36px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ============================================================
   BROKER OS — VISUAL POLISH (header, icons, feature hierarchy)
   ============================================================ */
.app-topbar{
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--primary) 13%,var(--line));
  box-shadow:0 5px 18px rgba(25,20,55,.035);
}
.brand-inline{gap:11px}
.app-symbol{
  width:42px;height:42px;border-radius:15px;padding:4px;
  background:linear-gradient(145deg,var(--surface),var(--primary-soft));
  border:1px solid color-mix(in srgb,var(--primary) 22%,var(--line));
  box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 12%,transparent);
}
.page-title .eyebrow{color:var(--primary);font-weight:700;letter-spacing:.45px}
.page-title h1{font-size:17px;font-weight:800;letter-spacing:-.45px}
.top-actions{gap:7px}
.icon-btn{
  border-radius:14px;background:var(--surface);
  border-color:color-mix(in srgb,var(--primary) 10%,var(--line));
  box-shadow:0 2px 6px rgba(25,20,55,.035);
}
.icon-btn svg{width:19px;height:19px;stroke-width:1.9}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.avatar{border-radius:14px;box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 22%,transparent)}
.app-bottom-nav .nav-btn.active{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--primary) 13%,transparent)}
.app-bottom-nav .nav-icon{
  width:34px;height:30px;border-radius:11px;
}
.app-bottom-nav .nav-btn.active .nav-icon{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.app-bottom-nav .nav-icon svg{width:21px;height:21px;stroke-width:1.9}
.feature-tile{
  min-height:100px;border-radius:18px;padding:13px;
  box-shadow:0 3px 10px rgba(23,21,34,.035);
}
.feature-icon,.li-icon,.row-icon,.more-item-icon,.summary-icon,.email-icon{
  border-radius:14px;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 7%,transparent);
}
.feature-icon{width:46px;height:46px}
.feature-icon svg,.li-icon svg,.row-icon svg,.more-item-icon svg{width:21px;height:21px;stroke-width:1.85}
.metric-card{border-radius:18px}
.metric-card .metric-icon{border-radius:14px}
.list-item,.more-item-row{border-radius:16px}
.section-head{align-items:center}
.plan-feature{padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.plan-feature .check{width:25px;height:25px}
.subscription-pending-card{
  display:grid;gap:14px;padding:17px;border-radius:20px;
  background:linear-gradient(135deg,var(--info-bg),color-mix(in srgb,var(--surface) 80%,var(--info-bg)));
  border:1px solid color-mix(in srgb,var(--info-500) 25%,var(--line));
}

.subscription-pending-icon{

  box-shadow:0 7px 16px rgba(53,105,214,.22)
}
.subscription-pending-icon svg{width:23px;height:23px}
.subscription-pending-card h3{margin:0;font-size:15px;font-weight:800;color:var(--text-1)}

}
.subscription-step .step-icon{display:block;color:var(--info-500);font-size:17px;margin-bottom:4px}
.subscription-step b{display:block;color:var(--text-1);font-size:10px;margin-bottom:2px}
.subscription-linked{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--text-2)
}
.subscription-linked svg{color:var(--primary);width:17px;height:17px}
@media(max-width:360px){

/* ============================================================
   ALGORITHMS
   ============================================================ */
const Algo = {
  businessDays(from, to, holidays=[]){
    const f=new Date(from), t=new Date(to);
    if(!(f instanceof Date)||!(t instanceof Date)||isNaN(f)||isNaN(t)) return 0;
    let count=0; const cur=new Date(f);
    const hSet=new Set(holidays.map(h=>new Date(h).toDateString()));
    while(cur<t){
      cur.setDate(cur.getDate()+1);
      const day=cur.getDay();
      if(day!==5&&day!==6&&!hSet.has(cur.toDateString())) count++;
    }
    return count;
  },
  clientRisk(client, ctx={}){
    const {policies=[], claims=[], renewals=[], tasks=[]} = ctx;
    const cid = client.id;
    const cPol = policies.filter(p=>p.clientId===cid);
    const cClm = claims.filter(c=>c.clientId===cid);
    const cRen = renewals.filter(r=>r.clientId===cid);
    const cTask = tasks.filter(t=>t.clientId===cid);
    let score=30;
    score -= Math.min(20, cPol.length * 5);
    const openClaims = cClm.filter(c=>!['Closed','Paid','Rejected'].includes(c.status));
    score += Math.min(25, openClaims.length * 8);
    const lostRen = cRen.filter(r=>String(r.stage||'').toLowerCase()==='lost');
    score += Math.min(20, lostRen.length * 10);
    const overdueTasks = cTask.filter(t=>String(t.status||'').toLowerCase()!=='closed' && t.dueDate && new Date(t.dueDate) < new Date());
    score += Math.min(15, overdueTasks.length * 5);
    const last = cPol.concat(cClm).map(x=>new Date(x.startDate||x.createdAt||0)).sort((a,b)=>b-a)[0];
    if(last && (Date.now()-last.getTime())>90*86400000) score += 10;
    return Math.max(0, Math.min(100, Math.round(score)));
  },
  renewalProbability(policy, ctx={}){
    const {renewals=[], claims=[], clients=[]} = ctx;
    if(!policy || !policy.expiryDate) return null;
    const days = Math.max(0, (new Date(policy.expiryDate)-Date.now())/86400000);
    const client = clients.find(c=>c.id===policy.clientId);
    const r = renewals.find(x=>x.policyId===policy.id);
    const daysScore = Math.max(0, Math.min(1, 1 - days/120));
    const stageMap = {'Due':0.15,'Contacted':0.35,'Negotiation':0.55,'Quotation':0.70,'Approved':0.88,'Renewed':0.99,'Lost':0.02};
    const stageScore = stageMap[r?.stage] ?? 0.30;
    const claimRatio = (()=>{
      const c = claims.filter(x=>x.policyId===policy.id).reduce((s,x)=>s+(Number(x.requestedAmount)||0),0);
      const p = Number(policy.premium)||1;
      return Math.min(1, c/p);
    })();
    const claimPenalty = 1 - claimRatio*0.4;
    const clientBonus = client?.status==='Active' ? 0.08 : (client?.status==='Review' ? -0.05 : 0);
    const loyaltyBonus = client ? Math.min(0.15, (ctx.policies||[]).filter(p=>p.clientId===client.id).length*0.03) : 0;
    const p = 0.25*daysScore + 0.40*stageScore + 0.15*claimPenalty + clientBonus + loyaltyBonus + 0.05;
    return Math.max(0.02, Math.min(0.98, p));
  },
  claimAnomaly(claim, allClaims=[]){
    const amounts = allClaims.map(c=>Number(c.requestedAmount)||0).filter(n=>n>0);
    if(amounts.length<3 || !claim) return {isAnomaly:false, z:0, severity:'none'};
    const mean = amounts.reduce((a,b)=>a+b,0)/amounts.length;
    const variance = amounts.reduce((s,v)=>s+(v-mean)**2,0)/amounts.length;
    const sd = Math.sqrt(variance) || 1;
    const z = ((Number(claim.requestedAmount)||0) - mean) / sd;
    return {isAnomaly: Math.abs(z) > 2, z, severity: Math.abs(z)>3?'critical':Math.abs(z)>2?'high':'normal', mean, sd};
  },
  portfolioHealth(policies=[], claims=[], renewals=[]){
    if(!policies.length) return {score:0, grade:'—', parts:{}};
    const totalPremium = policies.reduce((s,p)=>s+(Number(p.premium)||0),0);
    const totalClaims = claims.reduce((s,c)=>s+(Number(c.requestedAmount)||0),0);
    const lossRatio = totalPremium ? totalClaims/totalPremium : 0;
    const openClaims = claims.filter(c=>!['Closed','Paid','Rejected'].includes(c.status)).length;
    const closedRens = renewals.filter(r=>['Renewed','Lost'].includes(r.stage));
    const renewed = closedRens.filter(r=>r.stage==='Renewed').length;
    const renewalRate = closedRens.length ? renewed/closedRens.length : 0.7;
    const lossScore = Math.max(0, 100 - lossRatio*250);
    const claimsScore = Math.max(0, 100 - openClaims*8);
    const renewalScore = renewalRate*100;
    const diversityScore = Math.min(100, new Set(policies.map(p=>p.insurer)).size * 20);
    const score = Math.round(0.35*lossScore + 0.25*claimsScore + 0.25*renewalScore + 0.15*diversityScore);
    const grade = score>=85?'A':score>=70?'B':score>=55?'C':score>=40?'D':'E';
    return {score, grade, parts:{lossScore:Math.round(lossScore), claimsScore:Math.round(claimsScore), renewalScore:Math.round(renewalScore), diversityScore}};
  },
  commissionForecast(policies=[], months=3){
    if(!policies.length) return 0;
    const now = new Date();
    const buckets = Array(12).fill(0);
    policies.forEach(p=>{
      const d = new Date(p.startDate||p.expiryDate||now);
      const idx = (now.getMonth()-d.getMonth()+12)%12;
      if(idx<12) buckets[idx] += Number(p.commission)||0;
    });
    const weights = [0.35,0.25,0.15,0.10,0.05,0.04,0.03,0.02,0.005,0.005,0,0];
    let total = 0;
    for(let i=0;i<12;i++) total += buckets[i]*weights[i];
    return Math.round(total * (1 + months*0.05));
  },
  taskPriorityScore(task){
    let score = 50;
    const prio = String(task.priority||'').toLowerCase();
    score += prio==='high'?30 : prio==='medium'?10 : -5;
    if(task.dueDate){
      const days = (new Date(task.dueDate)-Date.now())/86400000;
      if(days<0) score += 25;
      else if(days<2) score += 18;
      else if(days<7) score += 8;
    }
    if(task.type==='Claims') score += 6;
    if(task.type==='Renewal') score += 4;
    return Math.max(0, Math.min(100, score));
  },
  clientLTV(client, ctx={}, years=3, discountRate=0.12){
    const {policies=[]} = ctx;
    const cPol = policies.filter(p=>p.clientId===client.id);
    const avgCommission = cPol.length ? cPol.reduce((s,p)=>s+(Number(p.commission)||0),0)/cPol.length : 0;
    const annualCommission = avgCommission * Math.max(1, cPol.length);
    const retention = String(client.status).toLowerCase()==='active' ? 0.85 : 0.55;
    let ltv = 0, retention_cum = 1;
    for(let y=0;y<years;y++){
      retention_cum *= retention;
      ltv += (annualCommission * retention_cum) / Math.pow(1+discountRate, y+1);
    }
    return Math.round(ltv);
  },
  lossRatio(policies=[], claims=[]){
    const premium = policies.reduce((s,p)=>s+(Number(p.premium)||0),0);
    const losses = claims.reduce((s,c)=>s+(Number(c.requestedAmount)||0),0);
    return premium ? losses/premium : null;
  },
  trend(values=[]){
    if(values.length<2) return 'flat';
    const first = values.slice(0, Math.ceil(values.length/2)).reduce((a,b)=>a+b,0);
    const last = values.slice(-Math.ceil(values.length/2)).reduce((a,b)=>a+b,0);
    const delta = last-first;
    if(Math.abs(delta)/Math.max(1,first) < 0.05) return 'flat';
    return delta>0?'up':'down';
  }
};

/* ============================================================
   SUBSCRIPTION ENGINE (Admin ↔ User linking)
   ============================================================ */
const Subscription = {
  /* Can user perform a mutating operation? */
  canOperate(){
    const s = State.subscription || {status:'free', operationCount:0};
    if(s.status === 'active'){
      if(!s.expiryDate) return {ok:true};
      const exp = new Date(s.expiryDate);
      if(isNaN(exp.getTime())) return {ok:true};
      if(exp > new Date()) return {ok:true};
      return {ok:false, reason:'expired'};
    }
    if(s.status === 'pending') return {ok:false, reason:'pending'};
    if(s.status === 'expired') return {ok:false, reason:'expired'};
    // free
    const used = Number(s.operationCount||0);
    if(used >= SUBSCRIPTION.FREE_LIMIT) return {ok:false, reason:'limit_reached'};
    return {ok:true};
  },

  /* Record a successful operation */
  async recordOperation(){
    // Active subscribers are unlimited
    const s = State.subscription || {status:'free', operationCount:0};
    if(s.status === 'active') return;
    if(State.demo){
      State.subscription = {...s, operationCount: Number(s.operationCount||0) + 1};
      return;
    }
    try{
      await db.collection(CONFIG.userCollection).doc(uid()).set({
        operationCount: firebase.firestore.FieldValue.increment(1)
      },{merge:true});
      State.subscription = {...s, operationCount: Number(s.operationCount||0) + 1};
    }catch(e){ console.warn('recordOperation failed', e); }
  },

  /* Load subscription state from Firestore */
  async load(){
    if(State.demo){
      if(!State.subscription) State.subscription = {status:'free', operationCount:0, expiryDate:null, requestedAt:null};
      return;
    }
    if(!FIREBASE_READY()) return;
    try{
      const profile = await DB.getOne(CONFIG.userCollection, uid());
      State.subscription = {
        status: profile?.subscriptionStatus || 'free',
        operationCount: Number(profile?.operationCount||0),
        expiryDate: profile?.subscriptionExpiry || null,
        requestedAt: profile?.subscriptionRequestedAt || null
      };
    }catch(e){ console.warn('subscription load failed', e); }
  },

  /* Attach realtime listener so admin approval reflects instantly */
  attachListener(){
    if(State.demo || !FIREBASE_READY()) return;
    try{
      db.collection(CONFIG.userCollection).doc(uid()).onSnapshot(snap=>{
        if(!snap.exists) return;
        const d = snap.data();
        const prev = State.subscription?.status || 'free';
        const next = d.subscriptionStatus || 'free';
        State.subscription = {
          status: next,
          operationCount: Number(d.operationCount||0),
          expiryDate: d.subscriptionExpiry || null,
          requestedAt: d.subscriptionRequestedAt || null
        };
        // Admin just activated
        if(prev !== next && next === 'active'){
          UI.toast(State.lang==='ar'?'🎉 تم تفعيل اشتراكك بنجاح!':'🎉 Your subscription is now active!');
          renderPage(); updateSubDot();
        }
        if(prev !== next && next === 'expired'){
          UI.toast(State.lang==='ar'?'انتهى اشتراكك':'Your subscription has expired','bad');
          renderPage(); updateSubDot();
        }
      });
    }catch(e){ console.warn('sub listener', e); }
  },

  /* User requests a subscription → persist first, then open WhatsApp */
  async request(){
    const isAr = State.lang === 'ar';
    const message = isAr
      ? `مرحبًا فريق Broker OS،\n\nأرغب في تفعيل اشتراكي في التطبيق.\n\n📋 بياناتي:\n• الاسم: ${State.profile?.name||'—'}\n• البريد: ${State.user?.email||'—'}\n• المؤسسة: ${State.org?.name||'—'}\n• نوع الحساب: ${State.profile?.accountType||'broker'}\n• الباقة المطلوبة: ${SUBSCRIPTION.PLAN_AR} (${SUBSCRIPTION.PRICE_EGP} ج.م/شهر)\n\nمن فضلك أرسل لي خطوات الدفع لتفعيل الحساب.\n\nشكرًا 🙏`
      : `Hello Broker OS team,\n\nI'd like to activate my subscription.\n\n📋 My details:\n• Name: ${State.profile?.name||'—'}\n• Email: ${State.user?.email||'—'}\n• Org: ${State.org?.name||'—'}\n• Account type: ${State.profile?.accountType||'broker'}\n• Plan: ${SUBSCRIPTION.PLAN_EN} (${SUBSCRIPTION.PRICE_EGP} EGP/month)\n\nPlease share payment steps to activate my account.\n\nThanks 🙏`;

    // Open synchronously during the click so browsers/mobile webviews are less likely to block it.
    let waWindow = null;
    try { waWindow = window.open('about:blank', '_blank'); } catch (_) {}

    if(!State.demo && FIREBASE_READY()){
      try{
        const requests = db.collection(CONFIG.subscriptionCollection);
        const existing = await requests
          .where('userId','==',uid())
          .where('status','==','pending')
          .limit(1).get();

        // Do not create duplicate pending requests, but always synchronize the user's profile.
        if(existing.empty){
          await requests.add({
            userId: uid(),
            orgId: orgId(),
            userName: State.profile?.name||'',
            userEmail: State.user?.email||'',
            userPhone: State.profile?.phone||'',
            orgName: State.org?.name||'',
            accountType: State.profile?.accountType||'broker',
            plan: 'monthly',
            price: SUBSCRIPTION.PRICE_EGP,
            currency: 'EGP',
            status: 'pending',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
        await db.collection(CONFIG.userCollection).doc(uid()).set({
          subscriptionStatus: 'pending',
          subscriptionRequestedAt: firebase.firestore.FieldValue.serverTimestamp()
        },{merge:true});

        State.subscription = {
          ...(State.subscription||{}),
          status:'pending',
          requestedAt:new Date().toISOString()
        };
      }catch(e){
        console.error('Subscription request could not be saved:', e);
        if(waWindow && !waWindow.closed) waWindow.close();
        UI.toast(isAr
          ? 'تعذر تسجيل الطلب. تحقق من اتصالك وصلاحيات Firebase ثم حاول مجددًا.'
          : 'Could not save the request. Check your connection and Firebase rules, then try again.','bad');
        return;
      }
    } else {
      // Preview mode only: this status is local and will not persist after reload.
      State.subscription = {...(State.subscription||{}),status:'pending',requestedAt:new Date().toISOString()};
    }

    renderPage();
    updateSubDot();
    UI.toast(isAr
      ? 'تم تسجيل طلب الاشتراك. ستظل الحالة قيد المراجعة حتى تأكيد الدفع.'
      : 'Subscription request saved. It will remain under review until payment is confirmed.');

    const url = `https://wa.me/${SUBSCRIPTION.WHATSAPP_DIGITS}?text=${encodeURIComponent(message)}`;
    if(waWindow && !waWindow.closed){
      waWindow.location.href = url;
    } else {
      // Fallback for environments that block a new window.
      window.location.href = url;
    }
  },

  openWhatsApp(){
    const isAr = State.lang === 'ar';
    const message = isAr
      ? `مرحبًا فريق Broker OS، أتابع طلب اشتراكي وأرغب في معرفة حالة تأكيد الدفع.\nالبريد: ${State.user?.email||'—'}`
      : `Hello Broker OS team, I'm following up on my subscription request and payment confirmation.\nEmail: ${State.user?.email||'—'}`;
    window.open(`https://wa.me/${SUBSCRIPTION.WHATSAPP_DIGITS}?text=${encodeURIComponent(message)}`,'_blank');
  },

  /* Status labels */
  label(){
    const s = State.subscription || {};
    const isAr = State.lang === 'ar';
    const map = {
      free: isAr?'نسخة مجانية':'Free',
      pending: isAr?'قيد المراجعة':'Pending',
      active: isAr?'مشترك نشط':'Active',
      expired: isAr?'منتهي':'Expired'
    };
    return map[s.status] || map.free;
  },
  statusClass(){
    const s = (State.subscription?.status)||'free';
    if(s === 'active') return 'ok';
    if(s === 'pending') return 'warn';
    if(s === 'expired') return 'bad';
    return 'gold';
  },
  remaining(){
    const s = State.subscription || {};
    if(s.status === 'active') return Infinity;
    if(s.status === 'pending' || s.status === 'expired') return 0;
    return Math.max(0, SUBSCRIPTION.FREE_LIMIT - Number(s.operationCount||0));
  }
};

/* Update avatar status dot */
function updateSubDot(){
  const dot = document.querySelector('.avatar .sub-dot');
  if(!dot) return;
  const s = (State.subscription?.status)||'free';
  dot.className = 'sub-dot ' + s;
}
