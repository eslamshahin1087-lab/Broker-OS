function t(k){return (T[State.lang]&&T[State.lang][k])||k}
function setTheme(theme){State.theme=theme;localStorage.setItem('brokeros_theme',theme);document.documentElement.dataset.theme=theme;render()}
function toggleTheme(){setTheme(State.theme==='light'?'dark':'light')}
function toggleLang(){State.lang=State.lang==='ar'?'en':'ar';localStorage.setItem('brokeros_lang',State.lang);document.documentElement.lang=State.lang;document.documentElement.dir=State.lang==='ar'?'rtl':'ltr';render()}
function uid(){return State.user?.uid||'demo'}
function orgId(){return State.profile?.orgId||State.org?.id||'demo-org'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function initials(name){return String(name||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'BO'}
function money(n){return new Intl.NumberFormat(State.lang==='ar'?'ar-EG':'en-US',{maximumFractionDigits:0}).format(Number(n)||0)}
function daysLeft(date){const d=new Date(date);return Math.ceil((d-new Date())/86400000)}
function formatDate(d){try{return new Date(d).toLocaleDateString(State.lang==='ar'?'ar-EG':'en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch{return '—'}}
function statusClass(s){const x=String(s||'').toLowerCase();
  if(['active','approved','paid','closed','renewed','نشط','مقبول','مسدد','مغلق'].some(v=>x.includes(v)))return'ok';
  if(['rejected','overdue','lost','expired','مرفوض','متأخر','مفقود','منتهي'].some(v=>x.includes(v)))return'bad';
  if(['review','pending','submitted','under','contacted','negotiation','quotation','مراجعة','قيد','متابعة','تفاوض'].some(v=>x.includes(v)))return'warn';
  return'info'}
function v(id){return document.getElementById(id)?.value?.trim()||''}
function nameSafe(s){return String(s).replace(/[^a-zA-Z0-9._/-]+/g,'-')}
function friendlyError(e){
  if(!e) return t('unknownError');
  const code = e.code || '';
  const map = {
    'auth/invalid-email': State.lang==='ar'?'البريد الإلكتروني غير صالح.':'Invalid email address.',
    'auth/user-not-found': State.lang==='ar'?'لا يوجد حساب بهذا البريد.':'No account with this email.',
    'auth/wrong-password': State.lang==='ar'?'كلمة المرور غير صحيحة.':'Incorrect password.',
    'auth/invalid-credential': State.lang==='ar'?'بيانات الاعتماد غير صحيحة.':'Invalid credentials.',
    'auth/email-already-in-use': State.lang==='ar'?'البريد مستخدم بالفعل.':'Email already in use.',
    'auth/weak-password': State.lang==='ar'?'كلمة المرور ضعيفة.':'Password is too weak.',
    'auth/too-many-requests': State.lang==='ar'?'محاولات كثيرة. حاول لاحقًا.':'Too many attempts. Try later.',
    'auth/network-request-failed': State.lang==='ar'?'تحقق من اتصال الإنترنت.':'Check your network.',
    'permission-denied': State.lang==='ar'?'لا توجد صلاحية للوصول.':'Permission denied.',
    'unavailable': State.lang==='ar'?'الخدمة غير متاحة.':'Service unavailable.',
    'not-found': State.lang==='ar'?'العنصر غير موجود.':'Not found.'
  };
  return map[code] || e.message || t('unknownError');
}

const DB = {
  init(){
    if(!window.firebase||!firebase.initializeApp) throw new Error('Firebase SDK unavailable');
    if(!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
    db = firebase.firestore();
    auth = firebase.auth();
    storage = firebase.storage();
    window.db = db; window.auth = auth; window.storage = storage;
    try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch{}
    try{ auth.useDeviceLanguage() }catch{}
  },
  q(col, extra=[]){
    let query = db.collection(col).where('orgId','==',orgId()).limit(CONFIG.batchSize);
    for(const [f,op,val] of extra) query = query.where(f,op,val);
    return query;
  },
  async add(col, data){
    if(!FIREBASE_READY()) throw new Error('Firebase not ready');
    const ref = db.collection(col).doc();
    const payload = {...data,orgId:orgId(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:uid()};
    await ref.set(payload);
    await this.audit('create', col, ref.id, {});
    return ref.id;
  },
  async set(col, id, data){
    if(!FIREBASE_READY()) throw new Error('Firebase not ready');
    await db.collection(col).doc(id).set({...data,orgId:orgId(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    await this.audit('update', col, id, {});
  },
  async del(col, id){
    if(!FIREBASE_READY()) throw new Error('Firebase not ready');
    await db.collection(col).doc(id).delete();
    await this.audit('delete', col, id, {});
  },
  async audit(action, collection, recordId, meta={}){
    try{
      if(!FIREBASE_READY()) return;
      await db.collection('auditLogs').add({orgId:orgId(),actorId:uid(),actorName:State.profile?.name||State.user?.email||'',action,collection,recordId,meta,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    }catch(e){console.warn('Audit failed',e)}
  },
  listen(col, handler, extra=[]){
    if(!FIREBASE_READY()){handler([]);return ()=>{}}
    const unsub = this.q(col, extra).onSnapshot(
      snap => handler(snap.docs.map(d=>({id:d.id,...d.data()}))),
      err => {console.warn('listener error', col, err); handler([])}
    );
    State.listeners.push(unsub);
    return unsub;
  },
  async getOne(col, id){
    if(!FIREBASE_READY()) return null;
    const d = await db.collection(col).doc(id).get();
    return d.exists ? {id:d.id, ...d.data()} : null;
  },
  async getOrg(id){
    if(!FIREBASE_READY()) return null;
    const d = await db.collection(CONFIG.orgCollection).doc(id).get();
    return d.exists ? {id:d.id, ...d.data()} : null;
  }
};

const Auth = {
  async signIn(email,password){ if(!FIREBASE_READY()) throw new Error('Firebase unavailable'); return auth.signInWithEmailAndPassword(email, password); },
  async signUp({name,email,password,phone,organization,accountType='broker',licenseNumber='',experienceYears='',city='',specialization=''}){
    if(!FIREBASE_READY()) throw new Error('Firebase unavailable');
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const user = cred.user;
    const normalizedType = ['broker','office','company'].includes(accountType)?accountType:'broker';
    const isOwner = normalizedType !== 'broker';
    const orgRef = db.collection(CONFIG.orgCollection).doc();
    await orgRef.set({name:organization||`${name} Brokerage`,ownerId:user.uid,accountType:normalizedType,licenseNumber:String(licenseNumber||''),experienceYears:Number(experienceYears)||0,city:String(city||''),specialization:String(specialization||''),officialEmail:String(email||''),plan:'Free',status:'active',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    const permissions = isOwner ? ['crm','policies','claims','renewals','tasks','medical','analytics','reports','team','organization'] : ['crm','policies','claims','renewals','tasks','medical','analytics','reports'];
    await db.collection(CONFIG.userCollection).doc(user.uid).set({
      uid:user.uid,name,email,phone:phone||'',accountType:normalizedType,
      role:isOwner?'brokerage_owner':'broker',orgId:orgRef.id,status:'active',permissions,
      licenseNumber:String(licenseNumber||''),experienceYears:Number(experienceYears)||0,city:String(city||''),
      specialization:String(specialization||''),officialEmail:String(email||''),
      subscriptionStatus:'free', operationCount:0, subscriptionExpiry:null,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    try{await user.updateProfile({displayName:name})}catch{}
    try{await user.sendEmailVerification()}catch{}
    return cred;
  },

function buildLocalAI(prompt){
  const q = String(prompt||'').toLowerCase();
  const c=State.cache.clients||[], p=State.cache.policies||[], cl=State.cache.claims||[], r=State.cache.renewals||[], tks=State.cache.tasks||[];
  const openClaims = cl.filter(x=>!['Closed','Paid','Rejected','مغلق','مسدد','مرفوض'].includes(x.status));
  const duePolicies = p.map(x=>({...x, days:daysLeft(x.expiryDate)})).filter(x=>Number.isFinite(x.days)&&x.days>=0&&x.days<=45).sort((a,b)=>a.days-b.days).slice(0,5);
  const totalPremium = p.reduce((s,x)=>s+(Number(x.premium)||0),0);
  const lr = Algo.lossRatio(p, cl);
  const health = Algo.portfolioHealth(p, cl, r);
  if(/تجديد|renewal|ينته|expiry/.test(q)) return `Renewal analysis\n\nPolicies due within 45 days: ${duePolicies.length}\n${duePolicies.map(x=>`• ${x.policyNumber||'Policy'} — ${Math.max(0,x.days)} ${t('days')} — P(renew): ${(Algo.renewalProbability(x,{renewals:r,claims:cl,clients:c,policies:p})*100).toFixed(0)}%`).join('\n')||'• None currently'}`;
  if(/مطالب|claim|sla/.test(q)) return `Claims snapshot\n\nOpen claims: ${openClaims.length}\nLoss ratio: ${lr==null?'—':(lr*100).toFixed(1)+'%'}`;
  if(/عميل|client|customer/.test(q)) return `CRM snapshot\n\nClients: ${c.length}\nPolicies: ${p.length}\nOpen claims: ${openClaims.length}`;
  if(/شركة|portfolio|محفظ/.test(q)) return `Portfolio health\n\nIndex: ${health.score}/100 (Grade ${health.grade})\nLoss ratio: ${lr==null?'—':(lr*100).toFixed(1)+'%'}`;
  return `Broker OS brief\n\nClients: ${c.length}\nPolicies: ${p.length}\nOpen claims: ${openClaims.length}\nPremium: ${money(totalPremium)}\nPortfolio Health: ${health.score}/100`;
}

const AI = {
  async ask(prompt, context={}){
    if(!String(prompt||'').trim()) throw new Error('Empty prompt');
    if(!CONFIG.aiEndpoint) return {configured:false, local:true, text:buildLocalAI(prompt)};
    const token = State.user ? await State.user.getIdToken() : '';
    const safeContext = {...context,organizationId:orgId()};
    const r = await fetch(CONFIG.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json', ...(token?{Authorization:`Bearer ${token}`}:{})},body: JSON.stringify({prompt:String(prompt).slice(0,2000), context:safeContext})});
    if(!r.ok) throw new Error('AI request failed');
    return await r.json();
  },
  localMedical(rows){
    if(!rows.length) return null;
    const values = rows.map(r=>{for(const k of ['cost','amount','totalCost','approvedAmount','requestedAmount']){const n=Number(r[k]);if(Number.isFinite(n))return n}return 0});
    const total = values.reduce((a,b)=>a+b,0), claims = rows.length, avg = claims?total/claims:0;
    const mean = avg, variance = claims?values.reduce((s,v)=>s+(v-mean)**2,0)/claims:0, sd = Math.sqrt(variance), highCostThreshold = sd?mean+2*sd:mean*2;
    const highCost = rows.filter((_,i)=>values[i]>=highCostThreshold&&values[i]>0).length;
    const inpatient = rows.filter(r=>String(r.type||r.category||'').toLowerCase().includes('inpatient')).length;
    const outpatient = rows.filter(r=>String(r.type||r.category||'').toLowerCase().includes('outpatient')).length;
    const providers = {}; rows.forEach((r,i)=>{const p=r.provider||r.providerName||'Unknown';providers[p]=(providers[p]||0)+values[i]});
    const topProviders = Object.entries(providers).sort((a,b)=>b[1]-a[1]).slice(0,5);
    return {claims,total,avg,inpatient,outpatient,highCost,topProviders};
  }
};

const FAB = {
  el:null, dragging:false, moved:false,
  startX:0, startY:0, startLeft:0, startTop:0,
  container:null,

  attach(){
    this.el = document.querySelector('.quick-fab');
    if(!this.el) return;
    this.container = this.el.closest('.mobile-app-shell');
    if(!this.container) return;

    if(State.fabPosition) this.applyPosition(State.fabPosition.left, State.fabPosition.top, false);

    this.el.addEventListener('pointerdown', this.onDown.bind(this));
    this.el.addEventListener('pointermove', this.onMove.bind(this));
    this.el.addEventListener('pointerup', this.onUp.bind(this));
    this.el.addEventListener('pointercancel', this.onUp.bind(this));

    this.el.addEventListener('click', (e)=>{
      if(this.moved){ e.preventDefault(); e.stopPropagation(); this.moved = false; }
    }, true);

    window.addEventListener('resize', ()=>{ if(State.fabPosition) this.clampToBounds(); });
  },

  getBounds(){
    const rect = this.container.getBoundingClientRect();
    const fabRect = this.el.getBoundingClientRect();
    const pad = 12;
    const topBar = this.container.querySelector('.app-topbar');
    const topBound = topBar ? topBar.getBoundingClientRect().height + pad : pad;
    const navEl = this.container.querySelector('.app-bottom-nav');
    const bottomBound = navEl ? (rect.height - navEl.getBoundingClientRect().height - 20) : (rect.height - fabRect.height - pad);
    return { minX: pad, maxX: rect.width - fabRect.width - pad, minY: topBound, maxY: bottomBound, fabW: fabRect.width, fabH: fabRect.height };
  },

  applyPosition(left, top, animate=false){
    if(!this.el || !this.container) return;
    const bounds = this.getBounds();
    const clampedLeft = Math.max(bounds.minX, Math.min(bounds.maxX, left));
    const clampedTop = Math.max(bounds.minY, Math.min(bounds.maxY, top));
    this.el.style.right = 'auto';
    this.el.style.left = clampedLeft + 'px';
    this.el.style.top = clampedTop + 'px';
    this.el.style.bottom = 'auto';
    if(animate){
      this.el.classList.add('snapping');
      setTimeout(()=>this.el.classList.remove('snapping'), 340);
    }
    State.fabPosition = { left: clampedLeft, top: clampedTop };
    try{ localStorage.setItem('brokeros_fab_pos', JSON.stringify(State.fabPosition)); }catch{}
  },

  clampToBounds(){
    if(!this.el) return;
    const rect = this.el.getBoundingClientRect();
    const cRect = this.container.getBoundingClientRect();
    this.applyPosition(rect.left - cRect.left, rect.top - cRect.top, true);
  },

  onDown(e){
    if(e.button !== undefined && e.button !== 0) return;
    this.dragging = true; this.moved = false;
    this.startX = e.clientX; this.startY = e.clientY;
    const rect = this.el.getBoundingClientRect();
    const cRect = this.container.getBoundingClientRect();
    this.startLeft = rect.left - cRect.left;
    this.startTop = rect.top - cRect.top;
    this.el.style.right = 'auto';
    this.el.style.bottom = 'auto';
    this.el.style.left = this.startLeft + 'px';
    this.el.style.top = this.startTop + 'px';
    this.el.classList.add('dragging');
    this.el.setPointerCapture(e.pointerId);
  },

  onMove(e){
    if(!this.dragging) return;
    const dx = e.clientX - this.startX;
    const dy = e.clientY - this.startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) this.moved = true;
    const bounds = this.getBounds();
    const newLeft = Math.max(bounds.minX, Math.min(bounds.maxX, this.startLeft + dx));
    const newTop = Math.max(bounds.minY, Math.min(bounds.maxY, this.startTop + dy));
    this.el.style.left = newLeft + 'px';
    this.el.style.top = newTop + 'px';
  },

  onUp(e){
    if(!this.dragging) return;
    this.dragging = false;
    this.el.classList.remove('dragging');
    try{ this.el.releasePointerCapture(e.pointerId); }catch{}
    if(this.moved){
      const bounds = this.getBounds();
      const currentLeft = parseFloat(this.el.style.left);
      const currentTop = parseFloat(this.el.style.top);
      const midX = (bounds.minX + bounds.maxX) / 2;
      const snapLeft = currentLeft < midX ? bounds.minX : bounds.maxX;
      this.applyPosition(snapLeft, currentTop, true);
    } else {
      State.fabPosition = null;
      try{ localStorage.removeItem('brokeros_fab_pos'); }catch{}
    }
  },

  detach(){ this.el = null; }
};

function runGlobalSearch(query){
  const q = String(query||'').trim().toLowerCase(), out = document.getElementById('smartSearchResults');
  if(!out) return;
  if(q.length<2){ out.innerHTML = `<div class="empty"><div class="empty-icon">${UI.icon('search',24)}</div><div>${esc(t('smartSearchHint'))}</div></div>`; UI.refreshIcons(); return; }
  const sources = [['clients','clients'],['policies','policies'],['claims','claims'],['renewals','renewals'],['tasks','tasks'],['documents','documents'],['companies','companies'],['products','products']];
  const hits = [];
  for(const [type,label] of sources){
    for(const x of (State.cache[type]||[])){
      if(JSON.stringify(x).toLowerCase().includes(q)) hits.push({type,label,item:x});
      if(hits.length>=14) break;
    }
    if(hits.length>=14) break;
  }
  out.innerHTML = hits.length ? hits.map(h=>{
    const icon = h.type==='clients'?'users-round':h.type==='policies'?'shield-check':h.type==='claims'?'file-warning':h.type==='companies'?'landmark':h.type==='products'?'package':'search';
    const title = h.item.name||h.item.policyNumber||h.item.claimNumber||h.item.title||h.item.stage||'Record';
    return `<button class="list-item" onclick="UI.closeModal();quickView('${h.type}','${esc(h.item.id)}')"><div class="li-icon">${UI.icon(icon,18)}</div><div class="li-main"><div class="li-title">${esc(title)}</div><div class="li-sub">${esc(h.label)} · ${esc(h.item.email||h.item.status||h.item.type||'')}</div></div>${UI.icon('chevron-left',15)}</button>`;
  }).join('') : `<div class="empty"><div class="empty-icon">${UI.icon('search-x',24)}</div><div>${State.lang==='ar'?'لا توجد نتائج.':'No results.'}</div></div>`;
  UI.refreshIcons();
}

function renderSubscriptionBanner(){
  const s = State.subscription || {status:'free'};
  const status = s.status || 'free';
  const isAr = State.lang === 'ar';
  let icon = 'gem', title = '', sub = '';

  if(status === 'active'){
    icon = 'crown';
    title = t('activeNow');
    const exp = s.expiryDate ? formatDate(s.expiryDate) : '';
    sub = exp ? `${t('expiresOn')} ${exp}` : t('securedByAdmin');
  } else if(status === 'pending'){
    icon = 'hourglass';
    title = Subscription.label();
    sub = t('pendingBody');
  } else if(status === 'expired'){
    icon = 'alert-circle';
    title = t('expiredBody');
    sub = isAr?'اضغط للتجديد الآن':'Tap to renew now';
  } else {
    icon = 'gem';
    const remaining = Subscription.remaining();
    title = remaining > 0 ? t('freePlan') : t('limitReached');
    sub = remaining > 0
      ? `${t('trialRemaining')}: ${remaining} — ${isAr?'اضغط للترقية':'Tap to upgrade'}`
      : t('limitReachedBody').slice(0,70)+'…';
  }

  return `<div class="subscription-banner ${status}" onclick="openSubscriptionModal()">
    <div class="icon-wrap">${UI.icon(icon,22)}</div>
    <div class="copy"><b>${esc(title)}</b><small>${esc(sub)}</small></div>
    <span class="arrow">${UI.icon(State.lang==='ar'?'chevron-left':'chevron-right',16)}</span>
  </div>`;
}

async function handleMedicalFile(file){
  const out=document.getElementById('medicalResult'), narrative=document.getElementById('medicalNarrative');
  if(!file) return;
  // Subscription check
  const can = await ensureCanOperate();
  if(!can) { out.innerHTML=''; return; }
  out.innerHTML = `<div class="notice info">${UI.icon('loader-circle',15)} Processing ${esc(file.name)}…</div>`;
  UI.refreshIcons();
  try{
    let rows=[];
    const ext = file.name.toLowerCase().split('.').pop();
    if(ext==='csv'){ rows=parseCSV(await file.text()) }
    else if(['xlsx','xls'].includes(ext)){ const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const sheet=wb.Sheets[wb.SheetNames[0]]; rows=XLSX.utils.sheet_to_json(sheet,{defval:''}); }
    else { out.innerHTML=`<div class="notice ai">${UI.icon('info',15)} PDF/Image ready for backend OCR.</div>`; UI.refreshIcons(); return; }
    const m = AI.localMedical(rows);
    out.innerHTML = `<div class="metric-grid">
      <div class="metric-card"><span class="metric-icon red">${UI.icon('file-warning',20)}</span><b>${m.claims}</b><small>Claims</small></div>
      <div class="metric-card"><span class="metric-icon violet">${UI.icon('hand-coins',20)}</span><b>${money(m.total)}</b><small>Total cost</small></div>
      <div class="metric-card"><span class="metric-icon amber">${UI.icon('activity-square',20)}</span><b>${money(m.avg)}</b><small>Average</small></div>
      <div class="metric-card"><span class="metric-icon blue">${UI.icon('hospital',20)}</span><b>${m.inpatient}</b><small>Inpatient</small></div>
    </div>`;
    narrative.textContent = `Executive Summary\n\nClaims: ${m.claims}\nTotal: ${money(m.total)}\nAverage: ${money(m.avg)}\nInpatient: ${m.inpatient}\nOutpatient: ${m.outpatient}\nHigh-cost: ${m.highCost}`;
    UI.refreshIcons();
    await Subscription.recordOperation();
  }catch(e){ console.error(e); out.innerHTML=`<div class="notice danger">${t('unknownError')}</div>`; UI.refreshIcons(); }
}
function parseCSV(text){const lines=text.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const headers=parseCSVLine(lines[0]);return lines.slice(1).map(line=>{const vals=parseCSVLine(line),o={};headers.forEach((h,i)=>o[h]=vals[i]??'');return o})}
function parseCSVLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}

async function askAI(prompt){
  if(!String(prompt||'').trim()) return;
  const out = document.getElementById('aiResponse');
  const source = document.getElementById('aiSource');
  if(!out) return;
  out.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  const ctx = {clients:State.cache.clients.length,policies:State.cache.policies.length,claims:State.cache.claims.length,renewals:State.cache.renewals.length,tasks:State.cache.tasks.length};
  try{
    const r = await AI.ask(String(prompt).slice(0,2000), ctx);
    out.textContent = r.text || JSON.stringify(r,null,2);
    if(source) source.textContent = r.local ? (State.lang==='ar'?'محرك Insights محلي بقواعد ثابتة.':'Local insights engine.') : (State.lang==='ar'?'تمت الإجابة عبر طبقة AI المصرح بها.':'Answered via authorized AI.');
  }catch(e){ console.error(e); out.textContent = t('unknownError'); if(source) source.textContent = 'AI service unreachable.'; }
}

function exportCSV(type){
  const rows = State.cache[type]||[];
  if(!rows.length) return UI.toast(t('noData'));
  const keys = [...new Set(rows.flatMap(o=>Object.keys(o)))].slice(0,30);
  const csv = [keys.join(','),...rows.map(o=>keys.map(k=>`"${String(o[k]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));

function animateMetricCounts(root){
  if(!root||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-count-target]').forEach(node=>{
    const target = Math.max(0, Number(node.getAttribute('data-count-target')||0));
    if(!target) return;
    const start = performance.now(), duration = 620;
    const step = now=>{
      const p = Math.min(1,(now-start)/duration), e = 1-Math.pow(1-p,3);
      node.textContent = String(Math.round(target*e));
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

async function saveForm(kind){
  const invalid = msg => UI.toast(msg,'bad');

  // === SUBSCRIPTION GUARD ===
  const canOperate = await ensureCanOperate();
  if(!canOperate) return;

  const payload = {};
  try{
    if(kind==='client'){ Object.assign(payload,{name:v('f_name'),company:v('f_company'),phone:v('f_phone'),email:v('f_email'),type:v('f_type'),status:v('f_status'),accountOwner:State.profile?.name||'Demo Broker'}); if(!payload.name) return invalid(State.lang==='ar'?'اكتب اسم العميل.':'Client name is required.') }
    else if(kind==='policy'){ Object.assign(payload,{policyNumber:v('f_policy'),clientId:v('f_client'),insurer:v('f_insurer'),product:v('f_product'),premium:Number(v('f_premium')||0),commission:Number(v('f_commission')||0),startDate:v('f_start'),expiryDate:v('f_expiry'),status:'Active'}); if(!payload.policyNumber||!payload.clientId) return invalid(State.lang==='ar'?'أكمل رقم الوثيقة والعميل.':'Policy number and client required.') }
    else if(kind==='claim'){ Object.assign(payload,{claimNumber:v('f_claimNo'),clientId:v('f_client'),policyId:v('f_policy'),type:v('f_claimType'),requestedAmount:Number(v('f_req')||0),approvedAmount:0,status:'New',slaDays:Number(v('f_sla')||7),createdAt:new Date().toISOString()}); if(!payload.claimNumber||!payload.clientId) return invalid(State.lang==='ar'?'أكمل رقم المطالبة والعميل.':'Claim number and client required.') }
    else if(kind==='task'){ Object.assign(payload,{title:v('f_title'),type:v('f_type'),priority:v('f_priority'),dueDate:v('f_due'),status:'Open',assignedTo:State.profile?.name||'Demo Broker',clientId:relatedClientFromForm()}); if(!payload.title) return invalid(State.lang==='ar'?'اكتب عنوان المهمة.':'Task title required.') }
    else if(kind==='renewal'){ Object.assign(payload,{clientId:v('f_client'),policyId:v('f_policy'),stage:v('f_stage'),dueDate:v('f_due'),reason:v('f_reason')}); if(!payload.clientId||!payload.policyId) return invalid(State.lang==='ar'?'اختر العميل والوثيقة.':'Client and policy required.') }
    else if(kind==='company'){ Object.assign(payload,{name:v('f_name'),email:v('f_companyEmail'),claimsEmail:v('f_claims'),renewalEmail:v('f_renewal'),status:'Active'}); if(!payload.name) return invalid(State.lang==='ar'?'اكتب اسم الشركة.':'Company name required.') }
    else if(kind==='product'){ Object.assign(payload,{name:v('f_name'),line:v('f_line'),insurer:v('f_insurer'),status:'Active'}); if(!payload.name) return invalid(State.lang==='ar'?'اكتب اسم المنتج.':'Product name required.') }
    else if(kind==='user'){ Object.assign(payload,{name:v('f_name'),email:v('f_email'),role:v('f_role'),status:'Active',permissions:[]}); if(!payload.name||!payload.email) return invalid(State.lang==='ar'?'أكمل بيانات المستخدم.':'User data required.') }
    else if(kind==='document'){ const file=document.getElementById('f_fileInput')?.files?.[0]||null; const insurer=State.cache.companies.find(c=>c.id===v('f_documentInsurer')); Object.assign(payload,{name:v('f_name'),entityType:v('f_entity'),insurerId:v('f_documentInsurer'),insurer:insurer?.name||'',fileName:file?.name||'',fileSize:file?.size||0,status:v('f_status')||'Ready'}); if(!payload.name) return invalid(State.lang==='ar'?'اكتب اسم المستند.':'Document name required.'); if(!file) return invalid(State.lang==='ar'?'اختر ملفًا.':'Choose a file.') }
    else if(kind==='commission'){ Object.assign(payload,{policyId:v('f_policy'),amount:Number(v('f_commAmount')||0),status:v('f_commStatus')||'Pending',date:v('f_commDate')||new Date().toISOString().slice(0,10)}); if(!payload.policyId||!payload.amount) return invalid(State.lang==='ar'?'أكمل البيانات.':'Fill required fields.') }
    else if(kind==='notification'){ Object.assign(payload,{title:v('f_title'),body:v('f_body'),type:v('f_type')||'Info',read:false}); if(!payload.title||!payload.body) return invalid(State.lang==='ar'?'أكمل الحقول.':'Fill required fields.') }
    else return invalid('Unsupported form');

    const map={client:'clients',policy:'policies',claim:'claims',task:'tasks',renewal:'renewals',company:'companies',product:'products',user:'users',document:'documents',notification:'notifications',commission:'commissions'};

    if(State.demo){
      const collection = map[kind], id = 'demo-'+kind+'-'+Date.now();
      if(!State.cache[collection]) State.cache[collection]=[];
      if(kind==='document'){
        const file = document.getElementById('f_fileInput')?.files?.[0]||null;
        if(file) State.fileCache[id]=file;
        payload.fileRef = id;
      }
      State.cache[collection].unshift({id,...payload});
      await Subscription.recordOperation();
      UI.closeModal();
      UI.toast(State.lang==='ar'?'تم الحفظ (تجريبي)':'Saved (demo)');
      renderPage();
      setTimeout(()=>FAB.attach(),30);
      return;
    }

    if(kind==='document'){
      const file = document.getElementById('f_fileInput')?.files?.[0]||null;
      let uploadMeta = {};
      if(file){ uploadMeta = await Files.upload(file, `organizations/${orgId()}/documents/${Date.now()}-${file.name}`); }
      payload.downloadURL = uploadMeta.url||'';
      payload.storagePath = uploadMeta.path||'';
    }
    await DB.add(map[kind], payload);
    await Subscription.recordOperation();
    UI.closeModal();
    UI.toast(t('save'));
    render();
  }catch(e){ console.error(e); UI.toast(friendlyError(e),'bad'); }
}

async function sendDocumentEmail(documentId){
  const doc = (State.cache.documents||[]).find(x=>x.id===documentId); if(!doc) return;
  const to = document.getElementById('emailRecipient')?.value||'';
  const subject = document.getElementById('emailSubject')?.value||doc.name||'Broker OS document';
  const body = document.getElementById('emailBody')?.value||'';
  if(!to){ UI.toast(t('noEmail'),'bad'); return; }
  try{
    if(CONFIG.emailEndpoint && !State.demo){
      const token = await State.user.getIdToken();
      const res = await fetch(CONFIG.emailEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({to,subject,body,documentId,downloadURL:doc.downloadURL||'',fileName:doc.fileName||doc.name||'',organizationId:orgId(),officialEmail:State.profile?.officialEmail||State.org?.officialEmail||State.user?.email||''})});
      if(!res.ok) throw new Error('Email service failed');
      UI.closeModal(); UI.toast(State.lang==='ar'?'تم الإرسال.':'Sent.'); return;
    }
    const localFile = State.fileCache[documentId];
    if(localFile && navigator.canShare && navigator.canShare({files:[localFile]}) && navigator.share){
      await navigator.share({files:[localFile],title:subject,text:body});
      UI.closeModal(); UI.toast(State.lang==='ar'?'تم فتح المشاركة.':'Sharing opened.'); return;
    }
    const mailBody = body + (doc.downloadURL?`\n\n${doc.downloadURL}`:'');
    window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(mailBody)}`;
    UI.closeModal();
  }catch(e){ console.error(e); UI.toast(friendlyError(e),'bad'); }
}

async function ensureUserProfile(user){
  const ref = db.collection(CONFIG.userCollection).doc(user.uid);
  const snap = await ref.get();
  if(snap.exists) return {id:snap.id, ...snap.data()};
  const orgRef = db.collection(CONFIG.orgCollection).doc();
  const org = {name:`${user.displayName||'Broker'} Brokerage`,ownerId:user.uid,officialEmail:user.email||'',plan:'Free',status:'active',createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  const profile = {uid:user.uid,name:user.displayName||user.email,email:user.email||'',phone:user.phoneNumber||'',role:'brokerage_owner',orgId:orgRef.id,status:'active',permissions:['crm','policies','claims','renewals','tasks','medical','analytics','reports'],officialEmail:user.email||'',subscriptionStatus:'free',operationCount:0,subscriptionExpiry:null,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  await orgRef.set(org);
  await ref.set(profile);
  return {id:ref.id, ...profile};
}
function subscribeUser(){
  auth.onAuthStateChanged(async user=>{
    State.user = user;
    if(!user){ stopListeners(); State.profile=null; State.org=null; renderAuth('signin'); return; }
    try{
      State.profile = await ensureUserProfile(user);
      State.org = State.profile.orgId ? await DB.getOrg(State.profile.orgId) : null;
      State.demo = false;
      // Load subscription
      State.subscription = {
        status: State.profile.subscriptionStatus || 'free',
        operationCount: Number(State.profile.operationCount||0),
        expiryDate: State.profile.subscriptionExpiry || null,
        requestedAt: State.profile.subscriptionRequestedAt || null
      };
      render();
      // Realtime listener for admin activation
      Subscription.attachListener();
    }catch(e){
      console.error('Profile load failed', e);
      State.profile = {uid:user.uid, name:user.displayName||user.email, email:user.email, role:'broker', status:'active', orgId:'demo-org', subscriptionStatus:'free', operationCount:0};
      State.org = {id:'demo-org', name:'Brokerage', plan:'Free'};
      State.subscription = {status:'free', operationCount:0, expiryDate:null};
      State.demo = true;
      UI.toast(friendlyError(e),'bad');
      render();
    }
  });
}
function enterDemoMode(){
  State.demo = true;
  State.user = {uid:'demo-user',email:'demo@brokeros.local',displayName:'Demo Broker'};
  State.profile = {uid:'demo-user', name:'Demo Broker', email:'demo@brokeros.local', role:'brokerage_owner', orgId:'demo-org', status:'active', officialEmail:'demo@brokeros.local', accountType:'broker', phone:'01000000000'};
  State.org = {id:'demo-org', name:'Demo Brokerage', plan:'Free'};
  // Demo starts as free with 0 ops used
  if(!State.subscription || State.subscription.status === 'active'){
    State.subscription = {status:'free', operationCount:0, expiryDate:null, requestedAt:null};
  }
  render();
}
function paintBootLogo(){
  const slot = document.getElementById('bootLogoSlot');
  if(slot) slot.innerHTML = brandLogoSVG(80,'mark');
}
function boot(){
  paintBootLogo();
  document.documentElement.dataset.theme = State.theme;
  document.documentElement.lang = State.lang;
  document.documentElement.dir = State.lang==='ar'?'rtl':'ltr';
  try{
    if(LOCAL_PREVIEW){ enterDemoMode(); return; }
    if(!window.firebase||!firebase.initializeApp){
      if((window.__brokerBootWait||0)>=120) return enterDemoMode();
      window.__brokerBootWait = (window.__brokerBootWait||0)+1;
      return setTimeout(boot,100);
    }
    DB.init();
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
    subscribeUser();
  }catch(e){
    console.error('Boot error', e);
    document.getElementById('app').innerHTML = `<div class="boot-screen"><div class="boot-logo">${brandLogoSVG(80,'mark')}</div><div class="boot-brand">Broker OS</div><div class="boot-sub">${State.lang==='ar'?'تعذر التهيئة. جرّب إعادة التحميل.':'Init failed. Try reloading.'}</div><button class="btn btn-primary" style="margin-top:12px" onclick="location.reload()">${State.lang==='ar'?'إعادة المحاولة':'Retry'}</button></div>`;
  }
}

document.addEventListener('change', e=>{ if(e.target.id==='medicalFile') handleMedicalFile(e.target.files?.[0]); });
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openGlobalSearch(); }
  if(e.key==='Escape'){ UI.closeModal(); UI.closeDrawer(); }
});
window.addEventListener('online', ()=>UI.toast(State.lang==='ar'?'متصل':'Online'));
window.addEventListener('offline', ()=>UI.toast(State.lang==='ar'?'غير متصل':'Offline','bad'));
window.addEventListener('beforeunload', ()=>stopListeners());

Object.assign(window,{
  openForm, nav, openQuickActions, openGlobalSearch, runGlobalSearch,
  toggleTheme, toggleLang, renderAuth, handleSignIn, handleSignUp, handleReset, handleGoogle,
  showReset, openClient, quickView, refreshCollection, saveForm, generateReport, exportCSV,
  askAI, saveOfficialEmail, openDocumentEmail, sendDocumentEmail, openCompanyEmail,
  brokerSafeSignOut, enterDemoMode, handleMedicalFile,
  openSubscriptionModal, updateSubDot,
  UI, Auth, State, Algo, DB, FAB, Subscription, SUBSCRIPTION
});

boot();
})();
</script>
</body>
