<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Broker OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{--navy:#0B1F3A;--navy2:#12315C;--gold:#C9A227;--gold2:#E4C660;--bg:#F3F5F9;--card:#FFFFFF;--text:#1B2430;--muted:#6E7A8F;--line:#ECEFF4;
--ok:#1F9D55;--okbg:#E7F8EE;--warn:#D97706;--warnbg:#FEF3E2;--bad:#DC2626;--badbg:#FDEAEA;--info:#2563EB;--infobg:#EAF0FE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Cairo',sans-serif;background:#0d1117;display:flex;align-items:flex-start;justify-content:center;min-height:100vh}
::-webkit-scrollbar{display:none}
.device{width:390px;margin:26px auto;background:#000;border-radius:44px;padding:12px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.screen{position:relative;width:100%;height:800px;background:var(--bg);border-radius:32px;overflow:hidden;display:flex;flex-direction:column}
@media(max-width:460px){body{align-items:stretch}.device{width:100%;margin:0;border-radius:0;padding:0;box-shadow:none}.screen{height:100vh;border-radius:0}}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 2px;font-size:12px;color:var(--text);font-weight:700;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.appbar{padding:6px 18px 12px;background:var(--bg)}
.appbar .row1{display:flex;justify-content:space-between;align-items:center}
.appbar h1{font-size:18.5px;margin:0;color:var(--navy)}
.appbar .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.appbar .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.content{flex:1;overflow-y:auto;padding:4px 18px 100px;-webkit-overflow-scrolling:touch}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(20,30,60,.05)}
.kpi .v{font-size:20px;font-weight:800;color:var(--navy)}.kpi .l{font-size:10.5px;color:var(--muted);margin-top:2px}
.alert{display:flex;gap:10px;background:var(--warnbg);border-radius:14px;padding:12px 14px;margin:12px 0;border:1px solid #fbe3b7}
.alert b{font-size:13px;color:#92400e}.alert p{margin:2px 0 0;font-size:11.5px;color:#92400e}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.qa{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:0 2px 10px rgba(20,30,60,.05);border:none;font-family:inherit}
.qa .ic{width:36px;height:36px;border-radius:12px;background:var(--infobg);color:var(--info);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:15px}
.qa span{font-size:10px;color:var(--text);font-weight:600}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
.sec-title h3{font-size:14px;margin:0;color:var(--navy)}
.activity{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.activity:last-child{border-bottom:none}
.activity .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:0 0 8px}
.activity .t{font-size:12px;color:var(--text)}.activity .d{font-size:10px;color:var(--muted)}
.support{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:16px;padding:16px;color:#fff;margin:14px 0;display:flex;justify-content:space-between;align-items:center}
.support div b{font-size:13px}.support div p{margin:3px 0 0;font-size:10.5px;color:#c9d3e6}
.support button{background:var(--gold);color:var(--navy);border:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:11px;font-family:inherit}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 14px;margin:10px 0;box-shadow:0 2px 10px rgba(20,30,60,.05)}
.searchbar input{border:none;outline:none;flex:1;font-family:inherit;font-size:13px;background:none}
.item-card{background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(20,30,60,.05)}
.item-card .top{display:flex;justify-content:space-between;align-items:flex-start}
.item-card .name{font-size:13px;font-weight:700;color:var(--navy)}
.item-card .meta{font-size:11px;color:var(--muted);margin-top:3px}
.badge{font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}
.fab{position:absolute;bottom:86px;left:20px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--navy);border:none;font-size:22px;font-weight:800;box-shadow:0 8px 20px rgba(201,162,39,.5);z-index:6}
.more-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
.more-item{background:var(--card);border-radius:16px;padding:14px 4px;text-align:center;box-shadow:0 2px 10px rgba(20,30,60,.05);border:none;font-family:inherit}
.more-item .ic{width:38px;height:38px;border-radius:12px;background:var(--infobg);color:var(--info);display:flex;align-items:center;justify-content:center;margin:0 auto 7px;font-size:16px}
.more-item span{font-size:10px;font-weight:600;color:var(--text)}
.form-card{background:var(--card);border-radius:16px;padding:16px;margin-top:8px}
.form-card label{font-size:11px;color:var(--muted);display:block;margin:10px 0 5px}
.form-card label:first-child{margin-top:0}
.form-card input,.form-card select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;background:#fbfcfe}
.form-card button{width:100%;margin-top:16px;background:var(--navy);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;font-family:inherit}
.profile-card{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:18px;padding:20px;color:#fff;margin:10px 0 16px;text-align:center}
.profile-card .av{width:60px;height:60px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;margin:0 auto 10px}
.settings-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:12.5px}
.empty-page{text-align:center;color:var(--muted);font-size:12px;padding:60px 20px}
.bar-bg{background:#eef1f6;border-radius:20px;height:8px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:20px}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding:0 4px 4px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .bar{width:70%;border-radius:6px 6px 0 0;background:var(--navy)}
.chart .lbl{font-size:9.5px;color:var(--muted);margin-top:4px}
.cmp-table{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.cmp-col{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px rgba(20,30,60,.05)}
.cmp-col h4{font-size:11.5px;margin:0 0 8px;color:var(--navy)}
.cmp-col .m{font-size:10px;color:var(--muted);margin-top:6px}
.cmp-col .m b{display:block;font-size:12.5px;color:var(--text)}
.lock{position:absolute;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20}
.lock .ic{font-size:40px;margin-bottom:14px}.lock h2{margin:0 0 8px;font-size:17px}.lock p{color:#c9d3e6;font-size:12.5px;line-height:1.7;margin:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#6E7A8F;font-size:10px;padding:4px 0;border:none;background:none;font-family:inherit}
.tab .ic{font-size:18px;line-height:1}.tab.active{color:var(--navy);font-weight:700}.tab.active .ic{color:var(--gold)}
.loginbox{display:flex;flex-direction:column;justify-content:center;height:100%;padding:30px}
.loginbox h1{color:var(--navy);font-size:19px;margin:0 0 4px}.loginbox p{font-size:12px;color:var(--muted);margin:0 0 20px}
.loginbox input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);font-family:inherit;font-size:13.5px}
.loginbox button{width:100%;background:var(--navy);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:700;font-family:inherit}
.loginerr{color:var(--bad);font-size:11.5px;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div class="device"><div class="screen" id="screen"></div></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBc_zK1eS5vBo1lRFL53cavstrU9ncdydI",
  authDomain: "broker-os-7df4b.firebaseapp.com",
  projectId: "broker-os-7df4b",
  storageBucket: "broker-os-7df4b.firebasestorage.app",
  messagingSenderId: "882880749734",
  appId: "1:882880749734:web:24df7eb1a914100e841467",
  measurementId: "G-W6L9G9RM47"
};
const DEMO = firebaseConfig.apiKey.indexOf('YOUR_')===0;
let db=null, auth=null, ME_UID='u1', ME_NAME='إسلام شاهين';
if(!DEMO){firebase.initializeApp(firebaseConfig); db=firebase.firestore(); auth=firebase.auth();}

const FLAGS_KEY='brokeros_flags', LEADS_KEY='brokeros_leads', USERS_KEY='brokeros_users',
      INSURERS_KEY='brokeros_insurers', PRODUCTS_KEY='brokeros_products', NOTIFS_KEY='brokeros_notifications', CONTENT_KEY='brokeros_page_content';
function J(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function W(k,v){localStorage.setItem(k,JSON.stringify(v))}

const PAGES=[{key:'home',name:'الرئيسية',ic:'⌂'},{key:'clients',name:'العملاء',ic:'◧'},{key:'leads',name:'محتملون',ic:'◈'},
  {key:'quotes',name:'العروض',ic:'◫'},{key:'policies',name:'وثائقي',ic:'◉'},{key:'claims',name:'المطالبات',ic:'✦'},
  {key:'payments',name:'المدفوعات',ic:'◍'},{key:'renewals',name:'التجديدات',ic:'⟳'},{key:'documents',name:'المستندات',ic:'▤'},
  {key:'notifications',name:'الإشعارات',ic:'●'},{key:'analytics',name:'أداء الوسيط',ic:'▲'},{key:'medical',name:'الاستهلاك الطبي',ic:'✚'},
  {key:'commissions',name:'العمولات',ic:'¤'},{key:'compare',name:'مقارنة العروض',ic:'⇄'},{key:'profile',name:'حسابي',ic:'◐'}];
const PINNED=['home','clients','quotes','policies'];
const DEFAULT_INSURERS=['مصر للتأمين','اليانز','ميت لايف','إكسا','ساكو'];
const DEFAULT_PRODUCTS=['تأمين سيارات','تأمين صحي','تأمين حياة','تأمين ممتلكات'];
const DEFAULT_NOTIFS=[{t:'تم قبول عرض سعر سارة يوسف',d:'منذ 10 دقائق'},{t:'بوليصة POL-2291 تنتهي قريبًا',d:'منذ ساعة'},{t:'تحصيل جديد بقيمة 3,200 ج.م',d:'اليوم 10:20 ص'}];

let CACHE={pages:{},widgets:{},pageContent:{},insurers:DEFAULT_INSURERS,products:DEFAULT_PRODUCTS,notifications:DEFAULT_NOTIFS,leads:[],myStatus:'نشط'};
PAGES.forEach(p=>CACHE.pages[p.key]=true); ['kpi','funnel','quickActions','renewalAlerts','activityFeed','supportCard'].forEach(w=>CACHE.widgets[w]=true);
let current='home';

const CLIENTS=[{name:'أحمد فتحي',type:'تأمين سيارات',phone:'0100 000 111',status:'نشط',b:'b-ok'},{name:'منى الشربيني',type:'تأمين صحي',phone:'0111 222 333',status:'نشط',b:'b-ok'},
  {name:'كريم عادل',type:'تأمين ممتلكات',phone:'0122 444 555',status:'مراجعة',b:'b-warn'},{name:'سارة يوسف',type:'تأمين حياة',phone:'0155 666 777',status:'نشط',b:'b-ok'}];
const QUOTES=[{client:'أحمد فتحي',insurer:'مصر للتأمين',premium:'3,200 ج.م',status:'بانتظار الموافقة',b:'b-warn'},{client:'سارة يوسف',insurer:'ميت لايف',premium:'1,850 ج.م',status:'مقبول',b:'b-ok'},{client:'كريم عادل',insurer:'اكسا',premium:'950 ج.م',status:'مرفوض',b:'b-bad'}];
const POLICIES=[{no:'POL-2291',client:'أحمد فتحي',insurer:'مصر للتأمين',expiry:'ينتهي خلال 12 يومًا',b:'b-warn'},{no:'POL-1187',client:'منى الشربيني',insurer:'اليانز',expiry:'سارية حتى مارس 2027',b:'b-ok'},{no:'POL-0965',client:'سارة يوسف',insurer:'ميت لايف',expiry:'سارية حتى يونيو 2027',b:'b-ok'}];
const CLAIMS=[{no:'CLM-551',client:'أحمد فتحي',type:'حادث سيارة',amount:'8,000 ج.م',status:'قيد المعالجة',b:'b-warn'},{no:'CLM-489',client:'منى الشربيني',type:'علاج طبي',amount:'2,300 ج.م',status:'مسدد',b:'b-ok'}];
const PAYMENTS=[{who:'أحمد فتحي',amount:'+ 3,200 ج.م',date:'اليوم 10:20 ص',b:'b-ok'},{who:'عمولة اليانز',amount:'+ 640 ج.م',date:'أمس',b:'b-ok'},{who:'استرداد كريم عادل',amount:'- 300 ج.م',date:'منذ يومين',b:'b-bad'}];
const RENEWALS=[{client:'أحمد فتحي',policy:'POL-2291',days:'12 يومًا',b:'b-warn'},{client:'وائل نجيب',policy:'POL-3310',days:'5 أيام',b:'b-bad'}];
const DOCS=[{name:'بوليصة أحمد فتحي.pdf',size:'220 KB'},{name:'بطاقة رقم قومي - منى.jpg',size:'1.1 MB'},{name:'تقرير مطالبة CLM-551.pdf',size:'340 KB'}];
const ACTIVITY=[{t:'تمت إضافة عميل محتمل جديد',d:'منذ 5 دقائق'},{t:'تم قبول عرض سعر لـ سارة يوسف',d:'منذ ساعة'},{t:'تحصيل دفعة من أحمد فتحي',d:'اليوم'}];
const MEDICAL=[{name:'منى الشربيني',cons:70,meds:45,hosp:10,risk:'متوسط',b:'b-warn'},{name:'سارة يوسف',cons:30,meds:20,hosp:0,risk:'منخفض',b:'b-ok'},{name:'وائل نجيب',cons:90,meds:85,hosp:60,risk:'مرتفع',b:'b-bad'}];
const COMMISSIONS=[{policy:'POL-2291',insurer:'مصر للتأمين',amount:'480 ج.م',status:'مستحقة',b:'b-warn'},{policy:'POL-1187',insurer:'اليانز',amount:'210 ج.م',status:'محصلة',b:'b-ok'},{policy:'POL-0965',insurer:'ميت لايف',amount:'160 ج.م',status:'محصلة',b:'b-ok'}];
const CHART=[{m:'أبريل',v:40},{m:'مايو',v:55},{m:'يونيو',v:48},{m:'يوليو',v:70},{m:'أغسطس',v:62},{m:'سبتمبر',v:82}];
const COMPARE_OFFERS=[{ins:'مصر للتأمين',premium:'3,200 ج.م',cover:'250,000 ج.م',ded:'5%',rate:'4.2 ★'},{ins:'اليانز',premium:'3,450 ج.م',cover:'300,000 ج.م',ded:'3%',rate:'4.6 ★'},{ins:'إكسا',premium:'2,950 ج.م',cover:'200,000 ج.م',ded:'8%',rate:'3.9 ★'}];

function pageOn(k){return CACHE.pages[k]!==false} function widOn(k){return CACHE.widgets[k]!==false}
function itemCard(name,meta,badge,badgeClass){return `<div class="item-card"><div class="top"><div><div class="name">${name}</div><div class="meta">${meta}</div></div><span class="badge ${badgeClass}">${badge}</span></div></div>`}
function renderList(items,mapFn,emptyText){return items.length?`<div style="margin-top:10px">${items.map(mapFn).join('')}</div>`:`<div class="empty-page">${emptyText}</div>`}
function pageTitle(key,def){const c=CACHE.pageContent[key]; return c&&c.title?[c.title,c.subtitle||def[1]]:def;}

function renderHome(){
  let h='';
  if(widOn('renewalAlerts')) h+=`<div class="alert"><div>⚠</div><div><b>تنبيه تجديد</b><p>لديك بوليصتان تنتهيان خلال أقل من 15 يومًا — راجع صفحة التجديدات.</p></div></div>`;
  if(widOn('kpi')) h+=`<div class="kpis"><div class="kpi"><div class="v">${128+CACHE.leads.filter(l=>l.status==='مقبول').length}</div><div class="l">عملاء نشطون</div></div>
    <div class="kpi"><div class="v">${34+CACHE.leads.length}</div><div class="l">فرص مفتوحة</div></div>
    <div class="kpi"><div class="v">18,400</div><div class="l">تحصيل الشهر (ج.م)</div></div>
    <div class="kpi"><div class="v">${CACHE.leads.filter(l=>l.status==='جديد'||l.status==='قيد المراجعة').length}</div><div class="l">بانتظار المراجعة</div></div></div>`;
  if(widOn('quickActions')) h+=`<div class="qa-row"><button class="qa" onclick="goto('leads')"><div class="ic">＋</div><span>عميل جديد</span></button>
    <button class="qa" onclick="goto('quotes')"><div class="ic">◫</div><span>عرض سعر</span></button>
    <button class="qa" onclick="goto('documents')"><div class="ic">▤</div><span>رفع مستند</span></button>
    <button class="qa" onclick="goto('profile')"><div class="ic">☎</div><span>الدعم</span></button></div>`;
  if(widOn('funnel')) h+=`<div class="sec-title"><h3>مسار العمل التجاري</h3></div><div class="kpis">
    <div class="kpi"><div class="v">${CACHE.leads.filter(l=>l.status==='جديد').length}</div><div class="l">عميل محتمل</div></div>
    <div class="kpi"><div class="v">${CACHE.leads.filter(l=>l.status==='قيد المراجعة').length}</div><div class="l">قيد المراجعة</div></div></div>`;
  if(widOn('activityFeed')){h+=`<div class="sec-title"><h3>آخر النشاطات</h3></div><div class="item-card">`;ACTIVITY.forEach(a=>h+=`<div class="activity"><div class="dot"></div><div><div class="t">${a.t}</div><div class="d">${a.d}</div></div></div>`);h+=`</div>`;}
  if(widOn('supportCard')) h+=`<div class="support"><div><b>محتاج مساعدة؟</b><p>فريق الدعم الفني متاح الآن</p></div><button>تواصل</button></div>`;
  return h||`<div class="empty-page">لا توجد عناصر مفعّلة لهذه الشاشة حاليًا.</div>`;
}
function renderClients(){return `<div class="searchbar">🔍<input placeholder="ابحث عن عميل..."></div>`+renderList(CLIENTS,c=>itemCard(c.name,`${c.type} · ${c.phone}`,c.status,c.b),'لا يوجد عملاء بعد');}
function renderLeadsPage(){
  const mine=[...CACHE.leads].filter(l=>l.createdBy===ME_UID||l.submittedBy===ME_NAME).reverse();
  const list=renderList(mine,l=>itemCard(l.name,`${l.type} · ${l.phone||'—'}`,l.status,l.status==='مقبول'?'b-ok':l.status==='مرفوض'?'b-bad':l.status==='قيد المراجعة'?'b-warn':'b-info'),'لم تُضِف أي عميل محتمل بعد.');
  return `<div class="form-card"><label>اسم العميل</label><input id="lName" placeholder="مثال: أحمد فتحي">
    <label>رقم الهاتف</label><input id="lPhone" placeholder="01000000000">
    <label>نوع التأمين</label><select id="lType">${CACHE.products.map(p=>`<option>${typeof p==='string'?p:p.name}</option>`).join('')}</select>
    <button onclick="addLead()">إرسال للمراجعة</button></div>
    <div class="sec-title"><h3>الطلبات المرسلة</h3></div>${list}`;
}
function addLead(){
  const name=document.getElementById('lName').value.trim(), phone=document.getElementById('lPhone').value.trim(), type=document.getElementById('lType').value;
  if(!name||!phone) return;
  if(DEMO){const leads=J(LEADS_KEY,[]); leads.push({id:'L'+Date.now(),name,phone,type,status:'جديد',date:new Date().toLocaleDateString('ar-EG'),submittedBy:ME_NAME}); W(LEADS_KEY,leads); CACHE.leads=leads; renderPage();}
  else{db.collection('leads').add({name,phone,type,status:'جديد',createdBy:ME_UID,submittedBy:ME_NAME,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
}
function renderQuotes(){return renderList(QUOTES,q=>itemCard(q.client,`${q.insurer} · ${q.premium}`,q.status,q.b),'لا توجد عروض أسعار بعد');}
function renderPolicies(){return renderList(POLICIES,p=>itemCard(`${p.no} — ${p.client}`,p.insurer,p.expiry,p.b),'لا توجد بوليصات نشطة بعد');}
function renderClaims(){return renderList(CLAIMS,c=>itemCard(`${c.no} — ${c.client}`,`${c.type} · ${c.amount}`,c.status,c.b),'لا توجد مطالبات مسجلة');}
function renderPayments(){return `<div class="kpis"><div class="kpi" style="grid-column:1/-1"><div class="v">18,400 ج.م</div><div class="l">إجمالي التحصيل هذا الشهر</div></div></div>`+renderList(PAYMENTS,p=>itemCard(p.who,p.date,p.amount,p.b),'لا توجد معاملات بعد');}
function renderRenewals(){return renderList(RENEWALS,r=>itemCard(r.client,r.policy,r.days,r.b),'لا توجد تجديدات قريبة 🎉');}
function renderDocuments(){return renderList(DOCS,d=>`<div class="item-card"><div class="top"><div><div class="name">${d.name}</div><div class="meta">${d.size}</div></div><span class="badge b-info">عرض</span></div></div>`,'لا توجد مستندات محفوظة');}
function renderNotifications(){return `<div class="item-card">${CACHE.notifications.map(n=>`<div class="activity"><div class="dot"></div><div><div class="t">${n.t}</div><div class="d">${n.d}</div></div></div>`).join('')}</div>`;}
function bar(label,val,color){return `<div class="meta" style="margin-top:8px;display:flex;justify-content:space-between"><span>${label}</span><b style="color:var(--text)">${val}%</b></div><div class="bar-bg"><div class="bar-fill" style="width:${val}%;background:${color}"></div></div>`;}
function renderMedical(){return renderList(MEDICAL,m=>`<div class="item-card"><div class="top"><div class="name">${m.name}</div><span class="badge ${m.b}">${m.risk} الاستهلاك</span></div>${bar('استشارات',m.cons,'#2563EB')}${bar('أدوية',m.meds,'#C9A227')}${bar('تنويم',m.hosp,'#DC2626')}</div>`,'لا توجد بيانات استهلاك طبي بعد');}
function renderCommissions(){return `<div class="kpis"><div class="kpi" style="grid-column:1/-1"><div class="v">${COMMISSIONS.filter(c=>c.status==='مستحقة').length} عمولة مستحقة</div><div class="l">إجمالي 480 ج.م بانتظار التحصيل</div></div></div>`+renderList(COMMISSIONS,c=>itemCard(`${c.policy} — ${c.insurer}`,'عمولة وسيط',c.status==='مستحقة'?c.amount+' · مستحقة':c.amount+' · محصلة',c.b),'لا توجد عمولات مسجلة');}
function renderAnalytics(){const max=Math.max(...CHART.map(c=>c.v));return `<div class="kpis"><div class="kpi"><div class="v">62%</div><div class="l">معدل التحويل</div></div><div class="kpi"><div class="v">2,150</div><div class="l">متوسط قيمة البوليصة</div></div>
    <div class="kpi"><div class="v">88%</div><div class="l">معدل الاحتفاظ بالعملاء</div></div><div class="kpi"><div class="v">18,400</div><div class="l">تحصيل هذا الشهر</div></div></div>
    <div class="sec-title"><h3>التحصيل الشهري (آخر 6 أشهر)</h3></div><div class="item-card"><div class="chart">${CHART.map(c=>`<div class="col"><div class="bar" style="height:${(c.v/max*100)}%"></div><div class="lbl">${c.m}</div></div>`).join('')}</div></div>`;}
function renderCompare(){return `<p style="font-size:11.5px;color:var(--muted);margin:8px 0">مقارنة عروض لعميل: <b style="color:var(--text)">أحمد فتحي</b></p>
    <div class="cmp-table">${COMPARE_OFFERS.map(o=>`<div class="cmp-col"><h4>${o.ins}</h4><div class="m">القسط<b>${o.premium}</b></div><div class="m">التغطية<b>${o.cover}</b></div><div class="m">التحمل<b>${o.ded}</b></div><div class="m">التقييم<b>${o.rate}</b></div></div>`).join('')}</div>`;}
function renderProfile(){return `<div class="profile-card"><div class="av">${ME_NAME.split(' ').map(w=>w[0]).slice(0,2).join('')}</div><b>${ME_NAME}</b><p style="margin:4px 0 0;font-size:11.5px;color:#c9d3e6">وسيط تأمين معتمد</p></div>
    <div class="settings-row"><span>اللغة</span><span style="color:var(--muted)">العربية</span></div>
    <div class="settings-row"><span>الإشعارات</span><span style="color:var(--ok);font-weight:700">مفعّلة</span></div>
    <div class="settings-row"><span>الدعم الفني</span><span style="color:var(--info);font-weight:700">تواصل</span></div>
    <div class="settings-row"><span>سياسة الخصوصية</span><span>›</span></div>
    ${!DEMO?`<div class="settings-row" onclick="doSignOut()"><span style="color:var(--bad)">تسجيل الخروج</span><span>›</span></div>`:''}`;
}
function renderMore(){const rest=PAGES.filter(p=>!PINNED.includes(p.key)&&pageOn(p.key)); return rest.length?`<div class="more-grid">${rest.map(p=>`<button class="more-item" onclick="goto('${p.key}')"><div class="ic">${p.ic}</div><span>${p.name}</span></button>`).join('')}</div>`:`<div class="empty-page">لا توجد صفحات إضافية مفعّلة.</div>`;}

const RENDERERS={home:renderHome,clients:renderClients,leads:renderLeadsPage,quotes:renderQuotes,policies:renderPolicies,claims:renderClaims,
  payments:renderPayments,renewals:renderRenewals,documents:renderDocuments,notifications:renderNotifications,analytics:renderAnalytics,
  medical:renderMedical,commissions:renderCommissions,compare:renderCompare,profile:renderProfile};
const TITLES={home:['مرحبًا، إسلام 👋','إليك ملخص أعمالك اليوم'],clients:['العملاء','قائمة عملائك وبياناتهم'],leads:['العملاء المحتملون','استقبال ومتابعة الطلبات الجديدة'],
  quotes:['عروض الأسعار','متابعة عروض التأمين'],policies:['وثائقي','البوليصات النشطة والمنتهية'],claims:['المطالبات','متابعة حالة مطالبات عملائك'],
  payments:['المدفوعات','سجل التحصيل والمعاملات'],renewals:['التجديدات','البوليصات القريبة من الانتهاء'],documents:['المستندات','خزنة الوثائق الآمنة'],
  notifications:['الإشعارات','آخر التحديثات'],analytics:['أداء الوسيط','تحليلات ومؤشرات الأداء'],medical:['الاستهلاك الطبي','تحليل استخدام التأمين الصحي لعملائك'],
  commissions:['العمولات','متابعة عمولاتك المستحقة والمحصلة'],compare:['مقارنة العروض','قارن عروض شركات التأمين لعميلك'],profile:['حسابي','الإعدادات والدعم الفني'],more:['المزيد','كل الخدمات في مكان واحد']};

function goto(key){current=key;renderPage();}

function appShellHTML(){
  return `<div class="statusbar"><span id="clock">9:41</span><span>●●●●  🔋</span></div>
  <div class="appbar"><div class="row1"><div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div><div class="avatar">${ME_NAME.split(' ').map(w=>w[0]).slice(0,2).join('')}</div></div></div>
  <div class="content" id="content"></div>
  <button class="fab" id="fab" style="display:none">+</button>
  <div class="tabbar" id="tabbar" style="position:absolute;bottom:0;inset-inline:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid #ECEFF4;display:flex;padding:8px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5"></div>
  <div class="lock" id="lockScreen" style="display:none"></div>`;
}
function loginHTML(err){
  return `<div class="loginbox"><h1>تسجيل الدخول</h1><p>ادخل إلى تطبيق الوسيط الخاص بك</p>
    <input id="lEmail" type="email" placeholder="البريد الإلكتروني"><input id="lPass" type="password" placeholder="كلمة المرور">
    <button onclick="doSignIn()">دخول</button><div class="loginerr">${err||''}</div></div>`;
}
function doSignIn(){
  const email=document.getElementById('lEmail').value.trim(), pass=document.getElementById('lPass').value;
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{document.getElementById('screen').innerHTML=loginHTML('فشل تسجيل الدخول: '+e.message);});
}
function doSignOut(){auth.signOut();}

function renderPage(){
  if(!pageOn(current) && current!=='more') current='home';
  const def=TITLES[current]||['',''];
  const [title,sub]=current==='more'?def:pageTitle(current,def);
  document.getElementById('content').innerHTML = current==='more' ? renderMore() : (RENDERERS[current]?RENDERERS[current]():'');
  document.getElementById('pageTitle').textContent=title; document.getElementById('pageSub').textContent=sub;
  document.getElementById('fab').style.display=(current==='clients'||current==='quotes'||current==='policies')?'flex':'none';
  const tabs=[]; PINNED.forEach(k=>{if(pageOn(k)) tabs.push(PAGES.find(p=>p.key===k));});
  if(PAGES.some(p=>!PINNED.includes(p.key)&&pageOn(p.key))) tabs.push({key:'more',name:'المزيد',ic:'▦'});
  const tb=document.getElementById('tabbar'); tb.innerHTML='';
  tabs.forEach(t=>{const b=document.createElement('button');b.className='tab'+(current===t.key?' active':'');b.innerHTML=`<span class="ic">${t.ic}</span>${t.name}`;b.onclick=()=>goto(t.key);tb.appendChild(b);});
}
function checkLock(){
  if(CACHE.myStatus!=='نشط'){
    document.getElementById('lockScreen').style.display='flex';
    document.getElementById('lockScreen').innerHTML=`<div class="ic">⛔</div><h2>تم إيقاف هذا الحساب</h2><p>قامت إدارة المنصة بإيقاف حسابك مؤقتًا.<br>للاستفسار يرجى التواصل مع الدعم الفني.</p>`;
    return true;
  }
  document.getElementById('lockScreen').style.display='none'; return false;
}
function render(){document.getElementById('screen').innerHTML=appShellHTML(); if(checkLock())return; renderPage();}
function clock(){const el=document.getElementById('clock'); if(el) el.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
setInterval(clock,30000);

/* ---- Demo mode: identical behaviour to before, via localStorage ---- */
function loadDemoAll(){
  const f=J(FLAGS_KEY,{}); CACHE.pages={...CACHE.pages,...(f.pages||{})}; CACHE.widgets={...CACHE.widgets,...(f.widgets||{})};
  CACHE.pageContent=J(CONTENT_KEY,{});
  CACHE.insurers=J(INSURERS_KEY,DEFAULT_INSURERS); CACHE.products=J(PRODUCTS_KEY,DEFAULT_PRODUCTS);
  CACHE.notifications=J(NOTIFS_KEY,DEFAULT_NOTIFS); CACHE.leads=J(LEADS_KEY,[]);
  const users=J(USERS_KEY,null); const me=users&&users.find(u=>u.id===ME_UID); CACHE.myStatus=me?me.status:'نشط';
}
if(DEMO){
  loadDemoAll(); render();
  window.addEventListener('storage',()=>{loadDemoAll();render();});
  setInterval(()=>{loadDemoAll();render();},2500);
}else{
  document.getElementById('screen').innerHTML=loginHTML();
  auth.onAuthStateChanged(user=>{
    if(!user){document.getElementById('screen').innerHTML=loginHTML(); return;}
    ME_UID=user.uid; ME_NAME=user.displayName||user.email;
    db.collection('platformSettings').doc('appConfig').onSnapshot(doc=>{
      const d=doc.data()||{}; CACHE.pages={...CACHE.pages,...(d.pages||{})}; CACHE.widgets={...CACHE.widgets,...(d.widgets||{})}; CACHE.pageContent=d.pageContent||{}; if(document.getElementById('content')) renderPage();
    });
    db.collection('insurers').onSnapshot(s=>{CACHE.insurers=s.docs.map(d=>d.data().name);});
    db.collection('products').onSnapshot(s=>{CACHE.products=s.docs.map(d=>d.data().name); if(current==='leads') renderPage();});
    db.collection('broadcastNotifications').orderBy('ts','desc').limit(20).onSnapshot(s=>{CACHE.notifications=s.docs.map(d=>d.data()); if(current==='notifications') renderPage();});
    db.collection('leads').where('createdBy','==',user.uid).onSnapshot(s=>{CACHE.leads=s.docs.map(d=>({id:d.id,...d.data()})); if(document.getElementById('content')) renderPage();});
    db.collection('users').doc(user.uid).onSnapshot(doc=>{CACHE.myStatus=(doc.data()||{}).status||'نشط'; render();});
  });
}
</script>
</body>
</html>
