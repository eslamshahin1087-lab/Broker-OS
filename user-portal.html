<style>
:root{
  --navy:#0B1F3A;--navy2:#15366A;--gold:#C9A227;--gold2:#E4C660;--gold-soft:#FBF1D6;
  --bg:#F2F5FA;--card:#FFFFFF;--text:#1B2430;--muted:#6E7A8F;--line:#EDF0F6;
  --ok:#1F9D55;--okbg:#E7F8EE;--warn:#D97706;--warnbg:#FEF3E2;--bad:#DC2626;--badbg:#FDEAEA;--info:#2563EB;--infobg:#EAF0FE;--purple:#7C5CD6;--purplebg:#F1ECFC;
  --shadow:0 3px 14px rgba(20,30,60,.06);--shadow-lg:0 16px 40px rgba(20,30,60,.16);
  --radius-sm:12px;--radius-md:16px;--radius-lg:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Cairo',sans-serif;background:#090D16;display:flex;align-items:flex-start;justify-content:center;min-height:100vh}
::-webkit-scrollbar{display:none}
.device{width:390px;margin:26px auto;background:#000;border-radius:46px;padding:12px;box-shadow:0 35px 80px rgba(0,0,0,.6)}
.screen{position:relative;width:100%;height:812px;background:var(--bg);border-radius:34px;overflow:hidden;display:flex;flex-direction:column}
@media(max-width:460px){body{align-items:stretch}.device{width:100%;margin:0;border-radius:0;padding:0;box-shadow:none}.screen{height:100vh;border-radius:0}}
button,input,select,textarea{font-family:inherit;color:inherit;outline:none}
button{cursor:pointer}
.logo-mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);font-size:16px;box-shadow:0 8px 22px rgba(201,162,39,.35)}

.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 2px;font-size:12px;color:var(--text);font-weight:700;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.appbar{padding:8px 18px 14px;background:var(--bg)}
.appbar .row1{display:flex;justify-content:space-between;align-items:center}
.appbar h1{font-size:19px;color:var(--navy);font-weight:800}
.appbar .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.appbar .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--navy2));color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;border:2px solid var(--gold-soft)}
.content{flex:1;overflow-y:auto;padding:4px 18px 104px;-webkit-overflow-scrolling:touch}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:10px 0}
.kpi{background:var(--card);border-radius:var(--radius-md);padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;margin-bottom:8px}
.kpi .v{font-size:21px;font-weight:800;color:var(--navy)}.kpi .l{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:600}

.alert{display:flex;gap:11px;background:var(--warnbg);border-radius:var(--radius-md);padding:13px 15px;margin:12px 0;border:1px solid #fbe3b7}
.alert .ic{width:34px;height:34px;border-radius:11px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--warn);font-size:14px;flex-shrink:0}
.alert b{font-size:12.5px;color:#92400e}.alert p{margin:2px 0 0;font-size:11px;color:#92400e;line-height:1.6}

.qa-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.qa{background:var(--card);border-radius:var(--radius-md);padding:12px 4px;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.qa:active{transform:scale(.94)}
.qa .ic{width:38px;height:38px;border-radius:12px;background:var(--infobg);color:var(--info);display:flex;align-items:center;justify-content:center;margin:0 auto 7px;font-size:15px}
.qa span{font-size:10px;color:var(--text);font-weight:700}

.sec-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 9px}
.sec-title h3{font-size:14.5px;color:var(--navy);font-weight:800}
.sec-title .link{font-size:11px;color:var(--info);font-weight:700}

.goal-card{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--radius-lg);padding:18px;color:#fff;margin:12px 0}
.goal-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.goal-card b{font-size:13px}.goal-card .pct{font-size:19px;font-weight:800;color:var(--gold2)}
.goal-bar-bg{background:rgba(255,255,255,.14);border-radius:99px;height:9px;overflow:hidden}
.goal-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.goal-card .foot{display:flex;justify-content:space-between;margin-top:9px;font-size:10.5px;color:#c9d3e6}

.task-item{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.task-item .chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:all .15s}
.task-item .chk.done{background:var(--ok);border-color:var(--ok)}
.task-item .t{font-size:12.5px;font-weight:700;color:var(--text)}
.task-item .t.done{text-decoration:line-through;color:var(--muted)}
.task-item .d{font-size:10.5px;color:var(--muted);margin-top:2px}
.task-item .tic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}

.activity{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.activity:last-child{border-bottom:none}
.activity .ic{width:30px;height:30px;border-radius:10px;background:var(--gold-soft);color:#a3781a;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.activity .t{font-size:12px;color:var(--text);font-weight:600}.activity .d{font-size:10px;color:var(--muted);margin-top:2px}

.support{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--radius-lg);padding:17px;color:#fff;margin:14px 0;display:flex;justify-content:space-between;align-items:center}
.support div b{font-size:13px}.support div p{margin:3px 0 0;font-size:10.5px;color:#c9d3e6}
.support button{background:var(--gold);color:var(--navy);padding:9px 15px;border-radius:11px;font-weight:800;font-size:11px}

.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:13px;padding:11px 15px;margin:10px 0;box-shadow:var(--shadow);color:var(--muted)}
.searchbar input{border:none;flex:1;font-size:13px;background:none}

.item-card{background:var(--card);border-radius:var(--radius-md);padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .15s}
.item-card:active{transform:scale(.98)}
.item-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item-card .name{font-size:13.5px;font-weight:800;color:var(--navy)}
.item-card .meta{font-size:11px;color:var(--muted);margin-top:3px}
.item-card .quick{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.qbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:10px;font-size:10.5px;font-weight:700}
.qbtn.call{background:var(--infobg);color:var(--info)}
.qbtn.wa{background:#e5f9ee;color:#1a9a51}
.qbtn.view{background:var(--gold-soft);color:#a3781a}

.badge{font-size:10px;font-weight:800;padding:4px 11px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}
.b-bad{background:var(--badbg);color:var(--bad)}.b-info{background:var(--infobg);color:var(--info)}.b-purple{background:var(--purplebg);color:var(--purple)}

.fab{position:absolute;bottom:88px;left:20px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-size:22px;font-weight:800;box-shadow:0 10px 26px rgba(201,162,39,.5);z-index:6;display:flex;align-items:center;justify-content:center}

.more-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px}
.more-item{background:var(--card);border-radius:var(--radius-md);padding:15px 4px;text-align:center;box-shadow:var(--shadow)}
.more-item .ic{width:38px;height:38px;border-radius:12px;background:var(--infobg);color:var(--info);display:flex;align-items:center;justify-content:center;margin:0 auto 7px;font-size:15px}
.more-item span{font-size:10px;font-weight:700;color:var(--text)}

.form-card{background:var(--card);border-radius:var(--radius-md);padding:17px;margin-top:8px;box-shadow:var(--shadow)}
.form-card label{font-size:11px;color:var(--muted);display:block;margin:11px 0 5px;font-weight:700}
.form-card label:first-child{margin-top:0}
.form-card input,.form-card select,.form-card textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:13px;background:#FAFBFD;font-family:inherit}
.form-card button{width:100%;margin-top:17px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:13px;border-radius:12px;font-weight:800;font-size:13px}

.profile-card{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--radius-lg);padding:22px;color:#fff;margin:10px 0 16px;text-align:center}
.profile-card .av{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto 11px}
.settings-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:13px;padding:13px 15px;margin-bottom:8px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
.settings-row i{color:var(--muted);margin-left:10px}
.empty-page{text-align:center;color:var(--muted);font-size:12px;padding:60px 20px}

.bar-bg{background:#eef1f6;border-radius:20px;height:8px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:20px}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding:0 4px 4px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart .bar{width:70%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--navy2),var(--navy))}
.chart .lbl{font-size:9.5px;color:var(--muted);margin-top:4px}

.donut-wrap{display:flex;align-items:center;gap:18px;padding:6px 2px}
.donut{width:118px;height:118px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.donut .hole{width:70px;height:70px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .hole b{font-size:15px;color:var(--navy)}.donut .hole span{font-size:8.5px;color:var(--muted)}
.legend{flex:1}
.legend .li{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-bottom:8px;font-weight:600}
.legend .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.legend .pc{margin-inline-start:auto;color:var(--muted);font-weight:700}

.cmp-table{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.cmp-col{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.cmp-col h4{font-size:11.5px;margin:0 0 8px;color:var(--navy)}
.cmp-col .m{font-size:10px;color:var(--muted);margin-top:6px}
.cmp-col .m b{display:block;font-size:12.5px;color:var(--text)}

.lock{position:absolute;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20}
.lock .ic{font-size:38px;margin-bottom:14px;color:var(--gold)}.lock h2{margin:0 0 8px;font-size:17px}.lock p{color:#c9d3e6;font-size:12.5px;line-height:1.7;margin:0}

.tabbar{position:absolute;bottom:0;inset-inline:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9AA6BC;font-size:9.5px;padding:5px 0;font-weight:700}
.tab .ic{font-size:16px;line-height:1}.tab.active{color:var(--navy)}.tab.active .ic{color:var(--gold)}

.loginbox{display:flex;flex-direction:column;justify-content:center;height:100%;padding:34px;background:radial-gradient(ellipse at 30% 15%,var(--navy2) 0%,var(--navy) 55%,#071527 100%)}
.loginbox .logo-mark{margin:0 auto 18px}
.loginbox h1{color:#fff;font-size:20px;margin:0 0 4px;text-align:center}.loginbox p{font-size:12px;color:#b9c4da;margin:0 0 24px;text-align:center}
.loginbox input{width:100%;padding:13px 15px;margin-bottom:11px;border-radius:13px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font-size:13.5px}
.loginbox input::placeholder{color:#8090ac}
.loginbox button{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);padding:14px;border-radius:13px;font-weight:800;font-size:13.5px;margin-top:4px}
.loginerr{color:#ff9d94;font-size:11.5px;margin-top:10px;min-height:16px;text-align:center}

.overlay{position:absolute;inset:0;background:rgba(10,15,25,.6);z-index:50;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-height:88%;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.overlay.show .sheet{transform:translateY(0)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h3{font-size:15.5px;color:var(--navy)}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);color:var(--muted);font-size:13px;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:6px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:11px;font-weight:700;color:var(--muted)}
.seg button.active{background:var(--navy);color:#fff}
.toastwrap{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:7px;align-items:center;width:90%}
.toast{background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:12px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px}
.toast i{color:var(--gold2)}
</style>
</head>

function pageOn(k){return CACHE.pages[k]!==false} function widOn(k){return CACHE.widgets[k]!==false}
function waLink(phone){return `https://wa.me/2${phone}`}
function itemCard(c){
  const quick=c.phone?`<div class="quick"><a class="qbtn call" href="tel:${c.phone}"><i class="fa-solid fa-phone"></i>اتصال</a><a class="qbtn wa" target="_blank" href="${waLink(c.phone)}"><i class="fa-brands fa-whatsapp"></i>واتساب</a>${c.isClient?`<button class="qbtn view" onclick="openClient('${c.name}')"><i class="fa-solid fa-user"></i>الملف</button>`:''}</div>`:'';
  return `<div class="item-card" ${c.isClient?`onclick="openClient('${c.name}')"`:''}><div class="top"><div><div class="name">${c.name}</div><div class="meta">${c.meta}</div></div><span class="badge ${c.badgeClass}">${c.badge}</span></div>${quick}</div>`;
}
function renderList(items,mapFn,emptyText){return items.length?`<div style="margin-top:10px">${items.map(mapFn).join('')}</div>`:`<div class="empty-page">${emptyText}</div>`}
function pageTitle(key,def){const c=CACHE.pageContent[key]; return c&&c.title?[c.title,c.subtitle||def[1]]:def;}

function renderLeadsPage(){
  const mine=[...CACHE.leads].filter(l=>l.createdBy===ME_UID||l.submittedBy===ME_NAME).reverse();
  const list=renderList(mine,l=>itemCard({name:l.name,meta:`${l.type} · ${l.phone||'—'}`,badge:l.status,badgeClass:l.status==='مقبول'?'b-ok':l.status==='مرفوض'?'b-bad':l.status==='قيد المراجعة'?'b-warn':'b-info',phone:l.phone}),'لم تُضِف أي عميل محتمل بعد.');
  return `<div class="form-card"><label>اسم العميل</label><input id="lName" placeholder="مثال: أحمد فتحي">
    <label>رقم الهاتف</label><input id="lPhone" placeholder="01000000000">
    <label>نوع التأمين</label><select id="lType">${CACHE.products.map(p=>`<option>${typeof p==='string'?p:p.name}</option>`).join('')}</select>
    <button onclick="addLead()"><i class="fa-solid fa-paper-plane"></i> إرسال للمراجعة</button></div>
    <div class="sec-title"><h3>الطلبات المرسلة</h3></div>${list}`;
}
function addLead(){
  const name=document.getElementById('lName').value.trim(), phone=document.getElementById('lPhone').value.trim(), type=document.getElementById('lType').value;
  if(!name||!phone) return;
  if(DEMO){const leads=J(LEADS_KEY,[]); leads.push({id:'L'+Date.now(),name,phone,type,status:'جديد',date:new Date().toLocaleDateString('ar-EG'),submittedBy:ME_NAME}); W(LEADS_KEY,leads); CACHE.leads=leads; renderPage(); toast('تم إرسال الطلب للمراجعة');}
  else{db.collection('leads').add({name,phone,type,status:'جديد',createdBy:ME_UID,submittedBy:ME_NAME,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
}

function donut(data){
  let acc=0; const stops=data.map(d=>{const s=acc; acc+=d.pct; return `${d.color} ${s}% ${acc}%`;}).join(',');
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div class="hole"><b>${data.length}</b><span>فئات</span></div></div>
    <div class="legend">${data.map(d=>`<div class="li"><span class="dot" style="background:${d.color}"></span>${d.name}<span class="pc">${d.pct}%</span></div>`).join('')}</div></div>`;
}

function taskRow(t){
  const [ic,bg,fg]=taskIcon(t.type);
  return `<div class="task-item"><div class="tic" style="background:${bg};color:${fg}"><i class="fa-solid ${ic}"></i></div>
    <div class="chk ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${t.done?'<i class="fa-solid fa-check"></i>':''}</div>
    <div style="flex:1"><div class="t ${t.done?'done':''}">${t.t}</div><div class="d">${t.d} · ${t.client}</div></div></div>`;
}
function toggleTask(id){const t=CACHE.tasks.find(x=>x.id===id); if(!t) return; t.done=!t.done; W(TASKS_KEY,CACHE.tasks); renderPage();}
function renderTasks(){
  const pending=CACHE.tasks.filter(t=>!t.done), done=CACHE.tasks.filter(t=>t.done);
  return `<div class="kpis"><div class="kpi"><div class="v">${pending.length}</div><div class="l">مهام معلّقة</div></div><div class="kpi"><div class="v">${done.length}</div><div class="l">مكتملة</div></div></div>
    <div class="sec-title"><h3>قيد التنفيذ</h3></div>${pending.length?pending.map(taskRow).join(''):'<div class="empty-page" style="padding:20px">لا توجد مهام معلّقة 🎉</div>'}
    ${done.length?`<div class="sec-title"><h3>مكتملة</h3></div>${done.map(taskRow).join('')}`:''}`;
}
function renderCompare(){return `<div class="cmp-table">${COMPARE_OFFERS.map(o=>`<div class="cmp-col"><h4>${o.ins}</h4><div class="m">القسط<b>${o.premium}</b></div><div class="m">التغطية<b>${o.cover}</b></div><div class="m">التحمل<b>${o.ded}</b></div><div class="m">التقييم<b>${o.rate}</b></div></div>`).join('')}</div>`;}
function renderMore(){
  const items=PAGES.filter(p=>!PINNED.includes(p.key)&&p.key!=='profile'&&pageOn(p.key));
  return `<div class="more-grid">${items.map(p=>`<button class="more-item" onclick="goto('${p.key}')"><div class="ic"><i class="fa-solid ${p.ic}"></i></div><span>${p.name}</span></button>`).join('')}
    <button class="more-item" onclick="goto('profile')"><div class="ic"><i class="fa-solid fa-user-gear"></i></div><span>حسابي</span></button></div>`;
}
function renderProfile(){
  return `<div class="profile-card"><div class="av">${ME_NAME.split(' ').map(w=>w[0]).slice(0,2).join('')}</div><div style="font-weight:800;font-size:15px">${ME_NAME}</div><div style="font-size:11.5px;color:#c9d3e6;margin-top:3px">وسيط تأمين معتمد</div></div>
    <div class="settings-row" onclick="goto('portfolio')"><span><i class="fa-solid fa-chart-pie"></i> المحفظة التأمينية</span><i class="fa-solid fa-chevron-left"></i></div>
    <div class="settings-row" onclick="goto('tasks')"><span><i class="fa-solid fa-list-check"></i> المهام والمتابعات</span><i class="fa-solid fa-chevron-left"></i></div>
    <div class="settings-row"><span><i class="fa-solid fa-bell"></i> إعدادات الإشعارات</span><label class="switch" style="width:36px;height:20px;flex:0 0 36px"><input type="checkbox" checked style="opacity:0"></label></div>
    <div class="settings-row"><span><i class="fa-solid fa-moon"></i> الوضع الليلي</span><i class="fa-solid fa-chevron-left"></i></div>
    <div class="settings-row"><span><i class="fa-solid fa-headset"></i> الدعم الفني</span><i class="fa-solid fa-chevron-left"></i></div>
    <div class="settings-row" onclick="doSignOut()" style="color:var(--bad)"><span><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</span></div>`;
}

const RENDERERS={home:renderHome,clients:renderClients,leads:renderLeadsPage,quotes:renderQuotes,policies:renderPolicies,claims:renderClaims,payments:renderPayments,
  renewals:renderRenewals,documents:renderDocuments,notifications:renderNotifications,analytics:renderAnalytics,portfolio:renderPortfolio,tasks:renderTasks,
  medical:renderMedical,commissions:renderCommissions,compare:renderCompare,profile:renderProfile};

function goto(k){current=k; renderPage();}

function appShellHTML(){
  return `<div class="toastwrap" id="toastwrap"></div>
  <div class="statusbar"><span id="clock">9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-three-quarters"></i></span></div>
  <div class="appbar"><div class="row1"><div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div><div class="avatar">${ME_NAME.split(' ').map(w=>w[0]).slice(0,2).join('')}</div></div></div>
  <div class="content" id="content"></div>
  <button class="fab" id="fab" style="display:none"><i class="fa-solid fa-plus"></i></button>
  <div class="tabbar" id="tabbar"></div>
  <div class="overlay" id="clientOverlay"><div class="sheet"><div class="sheet-head"><h3>ملف العميل</h3><div class="sheet-close" onclick="closeSheet('clientOverlay')"><i class="fa-solid fa-xmark"></i></div></div><div id="clientSheetBody"></div></div></div>
  <div class="lock" id="lockScreen" style="display:none"></div>`;
}
function loginHTML(err){
  return `<div class="loginbox"><div class="logo-mark">BO</div><h1>تسجيل الدخول</h1><p>ادخل إلى تطبيق الوسيط الخاص بك</p>
    <input id="lEmail" type="email" placeholder="البريد الإلكتروني"><input id="lPass" type="password" placeholder="كلمة المرور">
    <button onclick="doSignIn()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button><div class="loginerr">${err||''}</div></div>`;
}
function doSignIn(){
  const email=document.getElementById('lEmail').value.trim(), pass=document.getElementById('lPass').value;
  auth.signInWithEmailAndPassword(email,pass).catch(e=>{document.getElementById('screen').innerHTML=loginHTML('فشل تسجيل الدخول: '+e.message);});
}
function doSignOut(){ if(DEMO){toast('تسجيل الخروج غير مفعّل في الوضع التجريبي');return;} auth.signOut(); }

function renderPage(){
  if(!pageOn(current) && current!=='more') current='home';
  const def=TITLES[current]||['',''];
  const [title,sub]=current==='more'?def:pageTitle(current,def);
  document.getElementById('content').innerHTML = current==='more' ? renderMore() : (RENDERERS[current]?RENDERERS[current]():'');
  document.getElementById('pageTitle').textContent=title; document.getElementById('pageSub').textContent=sub;
  document.getElementById('fab').style.display=(current==='clients'||current==='quotes'||current==='policies')?'flex':'none';
  const tabs=[]; PINNED.forEach(k=>{if(pageOn(k)) tabs.push(PAGES.find(p=>p.key===k));});
  if(PAGES.some(p=>!PINNED.includes(p.key)&&pageOn(p.key))) tabs.push({key:'more',name:'المزيد',ic:'fa-grip'});
  const tb=document.getElementById('tabbar'); tb.innerHTML='';
  tabs.forEach(t=>{const b=document.createElement('button');b.className='tab'+(current===t.key?' active':'');b.innerHTML=`<span class="ic"><i class="fa-solid ${t.ic}"></i></span>${t.name}`;b.onclick=()=>goto(t.key);tb.appendChild(b);});
}
function checkLock(){
  if(CACHE.myStatus!=='نشط'){
    document.getElementById('lockScreen').style.display='flex';
    document.getElementById('lockScreen').innerHTML=`<div class="ic"><i class="fa-solid fa-lock"></i></div><h2>تم إيقاف هذا الحساب</h2><p>قامت إدارة المنصة بإيقاف حسابك مؤقتًا.<br>للاستفسار يرجى التواصل مع الدعم الفني.</p>`;
    return true;
  }
  document.getElementById('lockScreen').style.display='none'; return false;
}
function render(){document.getElementById('screen').innerHTML=appShellHTML(); if(checkLock())return; renderPage();}
function clock(){const el=document.getElementById('clock'); if(el) el.textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
setInterval(clock,30000);

function loadDemoAll(){
  const f=J(FLAGS_KEY,{}); CACHE.pages={...CACHE.pages,...(f.pages||{})}; CACHE.widgets={...CACHE.widgets,...(f.widgets||{})};
  CACHE.pageContent=J(CONTENT_KEY,{});
  CACHE.insurers=J(INSURERS_KEY,DEFAULT_INSURERS); CACHE.products=J(PRODUCTS_KEY,DEFAULT_PRODUCTS);
  CACHE.notifications=J(NOTIFS_KEY,DEFAULT_NOTIFS); CACHE.leads=J(LEADS_KEY,[]);
  CACHE.tasks=J(TASKS_KEY,null)||(W(TASKS_KEY,DEFAULT_TASKS),DEFAULT_TASKS);
  const users=J(USERS_KEY,null); const me=users&&users.find(u=>u.id===ME_UID); CACHE.myStatus=me?me.status:'نشط';
}
if(DEMO){
  loadDemoAll(); render();
  window.addEventListener('storage',()=>{loadDemoAll();if(document.getElementById('content'))renderPage();});
  setInterval(()=>{loadDemoAll();if(document.getElementById('content'))renderPage();},4000);
}else{
  document.getElementById('screen').innerHTML=loginHTML();
  auth.onAuthStateChanged(user=>{
    if(!user){document.getElementById('screen').innerHTML=loginHTML(); return;}
    ME_UID=user.uid; ME_NAME=user.displayName||user.email;
    render();
    db.collection('platformSettings').doc('appConfig').onSnapshot(doc=>{
      const d=doc.data()||{}; CACHE.pages={...CACHE.pages,...(d.pages||{})}; CACHE.widgets={...CACHE.widgets,...(d.widgets||{})}; CACHE.pageContent=d.pageContent||{}; if(document.getElementById('content')) renderPage();
    });
    db.collection('insurers').onSnapshot(s=>{CACHE.insurers=s.docs.map(d=>d.data().name);});
    db.collection('products').onSnapshot(s=>{CACHE.products=s.docs.map(d=>d.data().name); if(current==='leads') renderPage();});
    db.collection('broadcastNotifications').orderBy('ts','desc').limit(20).onSnapshot(s=>{CACHE.notifications=s.docs.map(d=>d.data()); if(current==='notifications') renderPage();});
    db.collection('leads').where('createdBy','==',user.uid).onSnapshot(s=>{CACHE.leads=s.docs.map(d=>({id:d.id,...d.data()})); if(document.getElementById('content')) renderPage();});
    db.collection('users').doc(user.uid).onSnapshot(doc=>{CACHE.myStatus=(doc.data()||{}).status||'نشط'; render();});
  });
}
document.addEventListener('click',e=>{ if(e.target.classList&&e.target.classList.contains('overlay')) e.target.classList.remove('show'); });
</script>
</body>
</html>
