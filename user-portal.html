<style>
/* ============================================================
   BROKER OS v17 — DESIGN TOKENS
   Unified light/dark system with elevation layers
   ============================================================ */
:root{
  /* Typography */
  --font-app:'IBM Plex Sans Arabic','Readex Pro',system-ui,-apple-system,sans-serif;
  --font-latin:'Manrope',system-ui,sans-serif;
  --font-mono:'SF Mono','Roboto Mono',monospace;

  /* Brand (indigo→violet from logo) */
  --brand-500:#4E3FC7;
  --brand-600:#3F32A8;
  --brand-400:#7C5AE0;
  --brand-300:#A66CDA;
  --brand-gradient:linear-gradient(135deg,#4E3FC7 0%,#7C5AE0 55%,#A66CDA 100%);
  --brand-gradient-soft:linear-gradient(135deg,rgba(78,63,199,.08) 0%,rgba(166,108,218,.06) 100%);

  /* Semantic status */
  --success-500:#1B9A62;
  --success-600:#137A4C;
  --warning-500:#C1811A;
  --warning-600:#9C6810;
  --danger-500:#D93025;
  --danger-600:#B0241A;
  --info-500:#3569D6;
  --info-600:#2751B0;

  /* Elevation & shape */
  --radius-xs:8px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-xl:26px;
  --radius-full:999px;

  /* Spacing scale */
  --sp-1:4px;
  --sp-2:8px;
  --sp-3:12px;
  --sp-4:16px;
  --sp-5:20px;
  --sp-6:24px;
  --sp-8:32px;

  /* Motion */
  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --dur-fast:140ms;
  --dur:200ms;
  --dur-slow:320ms;

  /* Layout */
  --app-width:430px;
  --topbar-h:70px;
  --bottomnav-h:72px;
}

/* ============================================================
   LIGHT THEME
   ============================================================ */
:root,
:root[data-theme="light"]{
  color-scheme:light;

  --bg:#F5F6FA;
  --bg-elev-0:#F5F6FA;
  --bg-elev-1:#FFFFFF;
  --bg-elev-2:#FAFAFC;
  --bg-elev-3:#F1F1F5;

  --surface:#FFFFFF;
  --surface-2:#FAFAFC;
  --surface-3:#F4F4F8;
  --surface-inverse:#1B1A20;

  --line:#E7E5EE;
  --line-strong:#D4D1DE;

  --text-1:#171522;
  --text-2:#4A4656;
  --text-3:#7A7688;
  --text-inverse:#FFFFFF;

  --icon-1:#4A4656;
  --icon-2:#7A7688;

  --primary:#4E3FC7;
  --primary-hover:#3F32A8;
  --primary-soft:#EFEBFF;
  --primary-on-soft:#4E3FC7;

  --success-bg:#E6F5EE;
  --success-fg:#0E7A4C;
  --warning-bg:#FEF3E2;
  --warning-fg:#9C6810;
  --danger-bg:#FCEAE8;
  --danger-fg:#B0241A;
  --info-bg:#EBF0FE;
  --info-fg:#2751B0;

  --shadow-sm:0 1px 2px rgba(23,21,34,.04),0 2px 6px rgba(23,21,34,.03);
  --shadow-md:0 4px 12px rgba(23,21,34,.06),0 8px 20px rgba(23,21,34,.04);
  --shadow-lg:0 12px 28px rgba(23,21,34,.10),0 24px 60px rgba(23,21,34,.08);

  --overlay:rgba(20,18,32,.45);
  --scrim:rgba(20,18,32,.30);
}

/* ============================================================
   DARK THEME (consistent elevation ladder)
   ============================================================ */
:root[data-theme="dark"]{
  color-scheme:dark;

  --bg:#0B0B14;
  --bg-elev-0:#0B0B14;
  --bg-elev-1:#15141F;
  --bg-elev-2:#1C1B28;
  --bg-elev-3:#242333;

  --surface:#15141F;
  --surface-2:#1C1B28;
  --surface-3:#242333;
  --surface-inverse:#F5F5F7;

  --line:#2A2838;
  --line-strong:#3A374D;

  --text-1:#F2F0F7;
  --text-2:#C8C4D4;
  --text-3:#8F8A9E;
  --text-inverse:#0B0B14;

  --icon-1:#C8C4D4;
  --icon-2:#8F8A9E;

  /* Brand lightened for dark contrast */
  --primary:#9B84F2;
  --primary-hover:#B096F7;
  --primary-soft:rgba(155,132,242,.14);
  --primary-on-soft:#C5B6FB;

  /* Status with dark-optimized contrast */
  --success-bg:rgba(27,154,98,.16);
  --success-fg:#4ED9A0;
  --warning-bg:rgba(193,129,26,.16);
  --warning-fg:#F0B854;
  --danger-bg:rgba(217,48,37,.16);
  --danger-fg:#F17A70;
  --info-bg:rgba(53,105,214,.16);
  --info-fg:#7BA0F0;

  --shadow-sm:0 1px 2px rgba(0,0,0,.32),0 2px 6px rgba(0,0,0,.24);
  --shadow-md:0 4px 14px rgba(0,0,0,.42),0 8px 22px rgba(0,0,0,.28);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55),0 28px 70px rgba(0,0,0,.40);

  --overlay:rgba(0,0,0,.66);
  --scrim:rgba(0,0,0,.50);
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:var(--font-app);
  background:var(--bg);
  color:var(--text-1);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  text-rendering:optimizeLegibility;
  display:flex;justify-content:center;align-items:center;
  overscroll-behavior:none;
  touch-action:manipulation;
  transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease);
}
button,input,select,textarea{font:inherit;font-family:var(--font-app);color:inherit}
button{border:0;cursor:pointer;background:none}
a{color:inherit;text-decoration:none}
[data-lucide],svg.lucide{
  width:1em;height:1em;
  stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
  flex:0 0 auto;
  color:currentColor;
  transition:color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{
  width:100%;height:100dvh;display:flex;justify-content:center;align-items:stretch;
  background:var(--bg);
}
.shell.mobile-app-shell{
  width:min(100%,var(--app-width));height:min(100dvh,920px);
  margin:0;border-radius:0;overflow:hidden;
  background:var(--bg);box-shadow:none;
  display:block;position:relative;
}
.mobile-app-shell .workspace{
  height:100%;min-height:0;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--bg);
}

/* ============================================================
   TOPBAR
   ============================================================ */
.app-topbar{
  min-height:var(--topbar-h);
  padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  position:relative;z-index:30;
}
.brand-inline{min-width:0;flex:1;display:flex;align-items:center;gap:8px}
.app-symbol{
  width:38px;height:38px;border-radius:12px;
  background:var(--surface);
  border:1px solid var(--line);
  display:grid;place-items:center;flex:0 0 auto;padding:3px;
  box-shadow:var(--shadow-sm);
  transition:transform var(--dur-fast) var(--ease);
}
.app-symbol:active{transform:scale(.94)}
.app-symbol svg{width:100%;height:100%;display:block}
.page-back{
  width:34px;height:34px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line);
  color:var(--icon-1);display:grid;place-items:center;flex:0 0 auto;
  transition:all var(--dur-fast) var(--ease);
}
.page-back:active{transform:scale(.94);background:var(--surface-3)}
.page-title{min-width:0;flex:1;overflow:hidden}
.page-title .eyebrow{
  font-size:8px;color:var(--text-3);font-weight:500;
  letter-spacing:.3px;margin-bottom:1px;
}
.page-title h1{
  font-size:15px;line-height:1.2;margin:0;
  color:var(--text-1);font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.top-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto}

.icon-btn{
  width:36px;height:36px;min-width:36px;border-radius:11px;
  background:var(--surface);border:1px solid var(--line);
  color:var(--icon-1);
  display:inline-flex;align-items:center;justify-content:center;
  transition:all var(--dur-fast) var(--ease);
  position:relative;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text-1);border-color:var(--line-strong)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.accent{
  background:var(--primary);color:#fff;border-color:transparent;
  box-shadow:0 6px 14px color-mix(in srgb,var(--primary) 30%,transparent);
}
.icon-btn.accent:hover{background:var(--primary-hover)}
.avatar{
  width:36px;height:36px;border-radius:11px;
  background:var(--brand-gradient);color:#fff;
  font-weight:700;font-size:11px;
  display:inline-flex;align-items:center;justify-content:center;
  border:0;position:relative;
  transition:transform var(--dur-fast) var(--ease);
}
.avatar:active{transform:scale(.94)}
.notif-dot{
  position:absolute;width:7px;height:7px;border-radius:50%;
  background:var(--danger-500);top:7px;inset-inline-end:7px;
  box-shadow:0 0 0 3px var(--surface);
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.55}}

/* ============================================================
   CONTENT SCROLL
   ============================================================ */
.app-content-scroll{
  position:relative;flex:1;min-height:0;
  overflow-x:hidden;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  background:var(--bg);
}
.mobile-app-shell .content{
  width:100%;max-width:none;margin:0;
  padding:12px 12px calc(var(--bottomnav-h) + 16px + env(safe-area-inset-bottom,0px));
  background:var(--bg);
  scrollbar-width:none;
}
.mobile-app-shell .content::-webkit-scrollbar{display:none}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.app-bottom-nav{
  display:grid;position:absolute;
  left:10px;right:10px;
  bottom:calc(8px + env(safe-area-inset-bottom,0px));
  height:var(--bottomnav-h);
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:2px;padding:6px;border-radius:22px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--line);
  box-shadow:var(--shadow-lg);
  z-index:70;
}
.app-bottom-nav .nav-btn{
  height:100%;min-height:52px;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;background:transparent;color:var(--text-3);
  transition:all var(--dur-fast) var(--ease);
  position:relative;
}
.app-bottom-nav .nav-btn:active{transform:scale(.96)}
.app-bottom-nav .nav-btn.active{
  background:var(--primary-soft);color:var(--primary);
}
.app-bottom-nav .nav-icon{width:22px;height:22px;display:grid;place-items:center;transition:transform var(--dur-fast) var(--ease)}
.app-bottom-nav .nav-btn.active .nav-icon{transform:translateY(-1px)}
.app-bottom-nav .nav-icon svg{width:19px;height:19px}
.app-bottom-nav .nav-label{font-size:9px;font-weight:600;letter-spacing:.1px}

/* ============================================================
   CARDS & LAYOUT
   ============================================================ */
.page-view{display:grid;gap:12px;min-width:0;width:100%}
.grid{display:grid;gap:14px}
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  transition:all var(--dur) var(--ease);
}
.card.interactive{cursor:pointer}
.card.interactive:active{transform:scale(.985);box-shadow:var(--shadow-md)}
.pad{padding:14px}

.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-head h2,.section-head h3{margin:0;font-size:13px;color:var(--text-1);font-weight:700;letter-spacing:-.15px}
.section-head p{margin:3px 0 0;font-size:9.5px;color:var(--text-3);line-height:1.5}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  min-height:42px;padding:0 14px;border-radius:var(--radius-sm);
  font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:all var(--dur-fast) var(--ease);
  border:1px solid transparent;
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:var(--primary);color:#fff;
  box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 26%,transparent);
}
.btn-primary:hover{background:var(--primary-hover)}
.btn-soft{background:var(--primary-soft);color:var(--primary-on-soft)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-outline{background:var(--surface);border-color:var(--line);color:var(--text-1)}
.btn-outline:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn-danger{background:var(--danger-bg);color:var(--danger-fg)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger-500) 22%,transparent)}

/* ============================================================
   LIST ITEMS
   ============================================================ */
.list{display:grid;gap:8px}
.list-item{
  display:flex;align-items:center;gap:10px;
  padding:11px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--radius-sm);
  min-width:0;transition:all var(--dur-fast) var(--ease);
}
.list-item:hover{background:var(--surface-2);border-color:var(--line-strong)}
.list-item .li-icon{
  width:36px;height:36px;border-radius:11px;
  background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;flex:0 0 auto;
}
.list-item .li-main{min-width:0;flex:1;overflow:hidden}
.list-item .li-title{font-size:11px;font-weight:600;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-sub{font-size:9.5px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-actions{display:flex;gap:5px;flex:0 0 auto}

/* ============================================================
   FORMS
   ============================================================ */
.input{
  height:44px;width:100%;
  border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius-sm);padding:0 12px;
  font-size:11.5px;color:var(--text-1);
  transition:all var(--dur-fast) var(--ease);
}
.input::placeholder{color:var(--text-3)}
.input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);
  background:var(--surface);
}
textarea.input{height:auto;min-height:100px;padding:11px;resize:vertical;font-family:var(--font-app)}
select.input{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--icon-2) 50%),linear-gradient(135deg,var(--icon-2) 50%,transparent 50%);background-position:calc(100% - 16px) center,calc(100% - 11px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-inline-end:34px}
html[dir="rtl"] select.input{background-position:16px center,11px center}

.form-grid{display:grid;grid-template-columns:1fr;gap:11px}
.field{display:grid;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:10px;font-weight:600;color:var(--text-2)}
.field small{font-size:9px;color:var(--text-3)}

/* ============================================================
   STATUS PILLS (dark-mode consistent)
   ============================================================ */
.status{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:var(--radius-full);
  font-size:9px;font-weight:700;letter-spacing:.1px;
  flex:0 0 auto;border:1px solid transparent;
}
.status.ok{background:var(--success-bg);color:var(--success-fg);border-color:color-mix(in srgb,var(--success-500) 20%,transparent)}
.status.warn{background:var(--warning-bg);color:var(--warning-fg);border-color:color-mix(in srgb,var(--warning-500) 20%,transparent)}
.status.bad{background:var(--danger-bg);color:var(--danger-fg);border-color:color-mix(in srgb,var(--danger-500) 20%,transparent)}
.status.info{background:var(--info-bg);color:var(--info-fg);border-color:color-mix(in srgb,var(--info-500) 20%,transparent)}
.status.purple{background:var(--primary-soft);color:var(--primary-on-soft);border-color:color-mix(in srgb,var(--primary) 20%,transparent)}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line);background:var(--surface-2);
  padding:6px 10px;border-radius:var(--radius-full);
  font-size:9.5px;font-weight:600;color:var(--text-2);
}

/* ============================================================
   METRIC CARD
   ============================================================ */
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.metric-card{
  display:grid;grid-template-columns:38px 1fr;grid-template-rows:auto auto;
  column-gap:10px;align-items:center;
  padding:12px;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  transition:all var(--dur) var(--ease);
}
.metric-card:active{transform:scale(.985)}
.metric-card .metric-icon{
  grid-row:1/3;width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;color:#fff;font-size:0;
}
.metric-card .metric-icon svg{width:19px;height:19px;color:#fff}
.metric-icon.red{background:linear-gradient(135deg,#4E3FC7,#7C5AE0)}
.metric-icon.violet{background:linear-gradient(135deg,#7C5AE0,#A66CDA)}
.metric-icon.amber{background:linear-gradient(135deg,#C1811A,#E0A140)}
.metric-icon.blue{background:linear-gradient(135deg,#3569D6,#6D8FF0)}
.metric-icon.green{background:linear-gradient(135deg,#1B9A62,#4EC58B)}
.metric-card b{font-size:14px;font-weight:700;color:var(--text-1);line-height:1.15}
.metric-card small{font-size:9px;color:var(--text-3);font-weight:600;margin-top:2px}
.metric-card .metric-trend{
  grid-column:2;font-size:8.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:3px;margin-top:3px;
}
.metric-trend.up{color:var(--success-fg)}
.metric-trend.down{color:var(--danger-fg)}

/* ============================================================
   HERO
   ============================================================ */
.welcome-hero{
  display:grid;grid-template-columns:minmax(0,1fr) 88px;
  gap:10px;align-items:stretch;
  padding:18px;border-radius:var(--radius-xl);
  position:relative;overflow:hidden;min-height:184px;
  background:var(--brand-gradient-soft);
  border:1px solid color-mix(in srgb,var(--primary) 14%,var(--line));
  color:var(--text-1);
}
:root[data-theme="dark"] .welcome-hero{
  background:linear-gradient(140deg,rgba(78,63,199,.18) 0%,rgba(166,108,218,.10) 60%,rgba(78,63,199,.08) 100%);
  border-color:color-mix(in srgb,var(--primary) 22%,var(--line));
}
.welcome-hero::after{
  content:"";position:absolute;width:240px;height:240px;
  inset-inline-end:-110px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--primary) 16%,transparent),transparent 68%);
  pointer-events:none;
}
.welcome-copy{position:relative;z-index:2;min-width:0}
.eyebrow-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:var(--radius-full);
  background:var(--surface);
  border:1px solid color-mix(in srgb,var(--primary) 18%,var(--line));
  color:var(--primary-on-soft);
  font-size:9px;font-weight:700;letter-spacing:.1px;
}
.welcome-copy h2{
  font-size:24px;line-height:1.15;margin:11px 0 7px;
  color:var(--text-1);letter-spacing:-.4px;
  font-family:var(--font-latin);font-weight:800;
}
.welcome-copy p{
  margin:0;color:var(--text-2);font-size:10.5px;line-height:1.75;
}
.hero-cta-row{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
.btn-ghost-light{
  background:var(--surface);color:var(--primary-on-soft);
  border:1px solid color-mix(in srgb,var(--primary) 18%,var(--line));
}
.btn-ghost-light:hover{background:var(--surface-2)}
.hero-orb{position:relative;z-index:1;display:grid;place-items:center}
.hero-orb > svg{
  width:68px;height:68px;border-radius:20px;
  box-shadow:var(--shadow-md);
  position:relative;z-index:3;
  background:var(--surface);
  padding:4px;
}
.orb-ring{
  position:absolute;border:1px solid color-mix(in srgb,var(--primary) 12%,transparent);
  border-radius:50%;
}
.orb-ring.r1{width:86px;height:86px}
.orb-ring.r2{width:124px;height:124px;border-color:color-mix(in srgb,var(--primary) 6%,transparent)}

/* ============================================================
   COMMAND SEARCH
   ============================================================ */
.command-strip{display:grid;gap:9px}
.command-search{
  width:100%;height:46px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius-md);
  display:flex;align-items:center;gap:10px;padding:0 13px;
  color:var(--text-3);font-size:11px;font-weight:600;
  box-shadow:var(--shadow-sm);
  transition:all var(--dur-fast) var(--ease);
  text-align:start;
}
.command-search:hover{border-color:var(--line-strong)}
.command-search:active{transform:scale(.985);border-color:var(--primary)}
.command-search span{flex:1;color:var(--text-3)}
.command-search kbd{
  font-size:9px;padding:3px 6px;
  border:1px solid var(--line);border-bottom-width:2px;
  border-radius:6px;background:var(--surface-2);
  color:var(--text-3);font-family:var(--font-latin);
}

/* ============================================================
   ANIMATED INSIGHT STRIP
   ============================================================ */
.insight-strip{
  position:relative;overflow:hidden;
  padding:2px 0 4px;
  mask-image:linear-gradient(to right,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%);
}
.insight-strip-track{
  display:flex;gap:8px;width:max-content;
  animation:insightMarquee 36s linear infinite;
  will-change:transform;
  padding-inline-end:8px;
}
.insight-strip:hover .insight-strip-track,
.insight-strip:active .insight-strip-track,
.insight-strip:focus-within .insight-strip-track{animation-play-state:paused}
@keyframes insightMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
html[dir="ltr"] .insight-strip-track{animation-name:insightMarqueeLTR}
@keyframes insightMarqueeLTR{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.insight-chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  padding:8px 11px;border-radius:13px;
  background:var(--surface);border:1px solid var(--line);
  color:var(--text-2);font-size:9.5px;font-weight:700;
  white-space:nowrap;box-shadow:var(--shadow-sm);
}
.insight-chip strong{color:var(--primary);font-size:11.5px;font-weight:800;font-family:var(--font-latin)}
.insight-chip svg{color:var(--primary)}
.insight-chip.alert svg{color:var(--warning-500)}
.insight-chip.alert strong{color:var(--warning-fg)}

/* ============================================================
   FEATURE TILES
   ============================================================ */
.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.feature-tile{
  display:flex;align-items:center;gap:10px;
  width:100%;min-height:88px;padding:11px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  text-align:start;
  transition:all var(--dur) var(--ease);
  position:relative;overflow:hidden;
}
.feature-tile::before{
  content:"";position:absolute;inset:0;
  background:var(--brand-gradient-soft);
  opacity:0;transition:opacity var(--dur) var(--ease);pointer-events:none;
}
.feature-tile:hover::before{opacity:1}
.feature-tile:hover{border-color:color-mix(in srgb,var(--primary) 25%,var(--line));box-shadow:var(--shadow-md)}
.feature-tile:active{transform:scale(.98)}
.feature-icon{
  width:38px;height:38px;flex:0 0 auto;
  display:grid;place-items:center;border-radius:12px;
  background:var(--primary-soft);color:var(--primary);
  position:relative;z-index:1;
}
.feature-tile:nth-child(4n+2) .feature-icon{background:color-mix(in srgb,var(--warning-500) 14%,transparent);color:var(--warning-fg)}
.feature-tile:nth-child(4n+3) .feature-icon{background:color-mix(in srgb,var(--success-500) 14%,transparent);color:var(--success-fg)}
.feature-tile:nth-child(4n) .feature-icon{background:color-mix(in srgb,var(--info-500) 14%,transparent);color:var(--info-fg)}
.feature-copy{min-width:0;flex:1;display:grid;gap:2px;position:relative;z-index:1}
.feature-copy b{font-size:10.5px;color:var(--text-1);font-weight:600;line-height:1.3}
.feature-copy small{
  font-size:8.5px;line-height:1.35;color:var(--text-3);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.feature-arrow{color:var(--text-3);flex:0 0 auto;position:relative;z-index:1}

/* ============================================================
   HOME PANELS
   ============================================================ */
.home-stack{display:grid;gap:12px;padding-bottom:10px}
.home-module-section + .home-module-section{margin-top:4px}
.home-module-section .section-head{margin-bottom:8px}
.home-panels{display:grid;gap:10px}

.mini-row{
  display:grid;grid-template-columns:32px minmax(0,1fr) auto;
  gap:9px;align-items:center;width:100%;
  padding:10px 0;border-top:1px solid var(--line);
  background:transparent;text-align:start;
  transition:background var(--dur-fast) var(--ease);
}
.mini-row:first-of-type{border-top:0;padding-top:2px}
.mini-row:last-of-type{padding-bottom:2px}
.mini-row:hover{background:var(--surface-2);margin-inline:-8px;padding-inline:8px;border-radius:10px;border-top-color:transparent}
.mini-row + .mini-row:hover{margin-top:0}
.row-icon{
  width:32px;height:32px;border-radius:10px;
  display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary);
}
.mini-row b{font-size:10.5px;font-weight:600;color:var(--text-1)}
.mini-row small{font-size:9px;color:var(--text-3);margin-top:1px}
.row-badge{
  font-size:9px;font-weight:700;
  padding:4px 8px;border-radius:var(--radius-full);
  background:var(--warning-bg);color:var(--warning-fg);
}
.row-badge.ok{background:var(--success-bg);color:var(--success-fg)}
.row-badge.bad{background:var(--danger-bg);color:var(--danger-fg)}
.row-arrow{color:var(--text-3)}

/* ============================================================
   AI HOME CARD
   ============================================================ */
.ai-home-card{
  display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;
  padding:15px;border-radius:var(--radius-lg);
  background:var(--brand-gradient-soft);
  border:1px solid color-mix(in srgb,var(--primary) 16%,var(--line));
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
:root[data-theme="dark"] .ai-home-card{
  background:linear-gradient(140deg,rgba(78,63,199,.18),rgba(166,108,218,.10));
  border-color:color-mix(in srgb,var(--primary) 24%,var(--line));
}
.ai-home-icon{
  width:48px;height:48px;border-radius:15px;
  display:grid;place-items:center;
  background:var(--brand-gradient);color:#fff;
  box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 30%,transparent);
}
.ai-home-copy b{font-size:13px;color:var(--text-1);font-weight:700}
.ai-home-copy p{margin:3px 0 10px;font-size:9.5px;line-height:1.6;color:var(--text-2)}
.ai-chips{display:flex;gap:5px;overflow:auto;scrollbar-width:none}
.ai-chips::-webkit-scrollbar{display:none}
.ai-chips button{
  padding:6px 10px;border-radius:10px;
  background:var(--surface);color:var(--primary-on-soft);
  font-size:9px;font-weight:600;white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--primary) 16%,var(--line));
  transition:all var(--dur-fast) var(--ease);
}
.ai-chips button:hover{background:var(--primary-soft);border-color:var(--primary)}

/* ============================================================
   EMAIL HOME CARD
   ============================================================ */
.email-home-card{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:13px 14px;box-shadow:var(--shadow-sm);
}
.email-copy{min-width:0;flex:1}
.email-copy b{display:block;font-size:11px;color:var(--text-1);font-weight:700;margin-bottom:2px}
.email-copy span{display:block;font-size:9.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.email-icon{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary);flex:0 0 auto;
}
.email-actions{display:flex;gap:6px;flex:0 0 auto}
.email-contact{
  display:flex;align-items:center;gap:9px;
  padding:9px 11px;border-radius:var(--radius-sm);
  background:var(--surface-2);border:1px solid var(--line);
  margin-top:8px;
}
.email-contact svg{color:var(--primary)}
.email-contact strong{font-size:10.5px;color:var(--text-1);display:block;font-weight:600}
.email-contact small{display:block;color:var(--text-3);font-size:9px;margin-top:1px}

/* ============================================================
   FAB
   ============================================================ */
.quick-fab{
  position:absolute;
  right:18px;
  bottom:calc(var(--bottomnav-h) + 20px + env(safe-area-inset-bottom,0px));
  height:52px;border-radius:16px;
  background:var(--brand-gradient);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  gap:7px;padding:0 16px;
  font-size:10.5px;font-weight:700;
  box-shadow:0 14px 28px color-mix(in srgb,var(--primary) 34%,transparent);
  z-index:60;
  transition:all var(--dur-fast) var(--ease);
}
.quick-fab:hover{transform:translateY(-2px);box-shadow:0 18px 34px color-mix(in srgb,var(--primary) 40%,transparent)}
.quick-fab:active{transform:scale(.95)}

/* ============================================================
   PAGE HEAD
   ============================================================ */
.inner-page-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:10px;margin-bottom:10px;padding:2px 1px 0;
}
.inner-page-copy{min-width:0;flex:1}
.inner-page-kicker{
  display:flex;align-items:center;gap:6px;
  font-size:9.5px;color:var(--primary);font-weight:700;
  margin-bottom:4px;
}
.inner-page-kicker svg{color:var(--primary)}
.inner-page-copy h2{
  margin:0;font-size:20px;line-height:1.2;
  color:var(--text-1);letter-spacing:-.35px;font-weight:700;
}
.inner-page-copy p{margin:4px 0 0;color:var(--text-3);font-size:10px;line-height:1.5}
.inner-page-actions{display:flex;align-items:center;flex:0 0 auto}
.page-add-btn{height:40px;border-radius:var(--radius-sm);padding:0 12px;font-size:10.5px}

/* ============================================================
   TOOLBAR / SEARCH
   ============================================================ */
.mobile-toolbar{display:block;margin-bottom:11px}
.mobile-search{
  width:100%;min-width:0;height:44px;border-radius:var(--radius-sm);
  background:var(--surface);display:flex;align-items:center;gap:8px;
  padding:0 13px;border:1px solid var(--line);
  color:var(--text-3);transition:all var(--dur-fast) var(--ease);
}
.mobile-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
.mobile-search input{border:0;outline:0;background:transparent;width:100%;font-size:11.5px;color:var(--text-1)}
.mobile-search input::placeholder{color:var(--text-3)}

/* ============================================================
   COLLECTION CARD
   ============================================================ */
.collection-card{padding:10px;border-radius:var(--radius-lg)}
.collection-summary{
  display:flex;align-items:center;gap:10px;
  padding:4px 2px 10px;border-bottom:1px solid var(--line);
  margin-bottom:9px;
}
.summary-icon{
  width:36px;height:36px;border-radius:12px;
  background:var(--primary-soft);color:var(--primary);
  display:grid;place-items:center;flex:0 0 auto;
}
.collection-summary > span:nth-child(2){display:flex;flex-direction:column;min-width:0;flex:1}
.collection-summary b{font-size:11.5px;color:var(--text-1);font-weight:600}
.collection-summary small{font-size:9px;color:var(--text-3);margin-top:2px}
.collection-add-icon{
  width:36px;height:36px;min-width:36px;border-radius:12px;
  background:var(--primary-soft);color:var(--primary);
  border-color:transparent;
}
.collection-list{gap:8px}

/* ============================================================
   MORE PAGE
   ============================================================ */
.more-page{display:grid;gap:12px}
.more-hero{
  padding:14px;border-radius:var(--radius-lg);
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:10px;
}
.account-avatar{
  width:48px;height:48px;border-radius:15px;
  background:var(--brand-gradient);color:#fff;
  display:grid;place-items:center;
  font-size:14px;font-weight:700;flex:0 0 auto;
}
.more-hero .copy{min-width:0;flex:1;display:grid;gap:2px}
.more-hero .copy b{font-size:12px;color:var(--text-1)}
.more-hero .copy small{font-size:9px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more-section{display:grid;gap:8px}
.more-section-title{font-size:9.5px;color:var(--text-3);font-weight:700;margin:1px 2px 0;text-transform:uppercase;letter-spacing:.4px}
.more-grid-page{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.more-item-row{
  display:flex;align-items:center;gap:9px;padding:11px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
  min-width:0;transition:all var(--dur-fast) var(--ease);
}
.more-item-row:hover{background:var(--surface-2);border-color:var(--line-strong);transform:translateY(-1px)}
.more-item-row:active{transform:scale(.98)}
.more-item-icon{
  width:36px;height:36px;border-radius:12px;
  display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary);flex:0 0 auto;
}
.more-item-copy{flex:1;min-width:0;display:grid;gap:2px}
.more-item-copy b{font-size:10px;color:var(--text-1);font-weight:600}
.more-item-copy small{font-size:8px;color:var(--text-3);line-height:1.35}
.more-item-arrow{color:var(--text-3)}
.more-control-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.more-control{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-height:64px;
  border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius-md);color:var(--text-1);
  font-size:9.5px;font-weight:600;
  transition:all var(--dur-fast) var(--ease);
}
.more-control:hover{background:var(--surface-2);border-color:var(--line-strong)}
.more-control:active{transform:scale(.98)}
.more-control.danger{color:var(--danger-fg);background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger-500) 22%,var(--line))}

/* ============================================================
   MODAL / DRAWER
   ============================================================ */
.modal-wrap{
  position:fixed;inset:0;z-index:110;
  background:var(--overlay);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:none;align-items:flex-end;justify-content:center;
  opacity:0;transition:opacity var(--dur) var(--ease);
}
.modal-wrap.show{display:flex;opacity:1}
.modal{
  width:min(100%,var(--app-width));max-height:88dvh;
  overflow:auto;background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  box-shadow:var(--shadow-lg);
  animation:slideUp var(--dur-slow) var(--ease-out);
}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-head{
  position:sticky;top:0;background:var(--surface);
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;border-bottom:1px solid var(--line);z-index:2;
}
.modal-head h3{font-size:13.5px;margin:0;font-weight:700;color:var(--text-1)}
.modal-body{padding:14px}
.modal-actions{
  display:flex;justify-content:flex-end;gap:8px;
  padding:12px 14px;border-top:1px solid var(--line);
  background:var(--surface);position:sticky;bottom:0;
}
.drawer{position:fixed;inset:0;z-index:100;pointer-events:none}
.drawer.show{pointer-events:auto}
.drawer::before{
  content:"";position:absolute;inset:0;
  background:var(--overlay);backdrop-filter:blur(6px);
  opacity:0;transition:opacity var(--dur) var(--ease);
}
.drawer.show::before{opacity:1}
.drawer-panel{
  position:absolute;inset-inline:0;bottom:0;
  width:100%;max-height:91dvh;
  background:var(--bg);
  border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  transform:translateY(100%);
  transition:transform var(--dur-slow) var(--ease-out);
  box-shadow:var(--shadow-lg);
  overflow:auto;
}
.drawer.show .drawer-panel{transform:translateY(0)}
.drawer-head{
  position:sticky;top:0;z-index:2;
  background:color-mix(in srgb,var(--surface) 96%,transparent);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;
}
.drawer-body{padding:14px}

/* ============================================================
   AUTH
   ============================================================ */
.auth-page{
  width:100%;min-height:100dvh;
  display:flex;justify-content:center;
  background:var(--bg);padding:0;
}
.auth-shell{
  width:min(100%,var(--app-width));height:100dvh;min-height:0;
  display:flex;flex-direction:column;
  background:var(--surface);overflow:hidden;
  box-shadow:none;
}
.auth-brand{
  padding:26px 20px 18px;text-align:center;
  background:var(--brand-gradient-soft);
  border-bottom:1px solid var(--line);
}
:root[data-theme="dark"] .auth-brand{
  background:linear-gradient(180deg,rgba(78,63,199,.20),rgba(166,108,218,.10));
}
.auth-brand svg{
  width:96px;height:96px;
  margin:0 auto 12px;display:block;
  border-radius:24px;
  box-shadow:var(--shadow-md);
  background:var(--surface);
  padding:8px;
}
.auth-brand h1{
  font-size:24px;margin:6px 0 4px;
  color:var(--text-1);font-family:var(--font-latin);font-weight:800;letter-spacing:-.5px;
}
.auth-brand .tagline{
  font-size:9.5px;color:var(--text-3);
  margin:auto;max-width:290px;line-height:1.6;
}
.auth-brand .bullets{
  display:grid;grid-template-columns:1fr 1fr;
  gap:7px;margin-top:14px;
}
.auth-brand .bullet{
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-size:8.5px;color:var(--text-2);
  background:var(--surface);
  border:1px solid var(--line);
  padding:8px 5px;border-radius:12px;font-weight:500;
}
.auth-brand .bullet svg{color:var(--primary)}
.auth-card{flex:1;padding:18px 16px 28px;overflow:auto;background:var(--surface)}
.auth-tabs{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  background:var(--surface-2);
  border:1px solid var(--line);
  padding:4px;border-radius:13px;margin-bottom:14px;
}
.auth-tab{
  height:38px;border-radius:10px;
  color:var(--text-3);font-size:11px;font-weight:600;
  background:transparent;
  transition:all var(--dur-fast) var(--ease);
}
.auth-tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
.auth-title{font-size:19px;margin:0 0 4px;color:var(--text-1);font-weight:700}
.auth-sub{margin:0 0 16px;font-size:10.5px;color:var(--text-3)}
.auth-form{display:grid;gap:11px}
.auth-row{display:grid;grid-template-columns:1fr;gap:10px}
.checkbox{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text-2)}
.checkbox input{accent-color:var(--primary);width:15px;height:15px}

.account-type-head{display:flex;align-items:flex-start;justify-content:space-between;margin:2px 0 8px}

/* ============================================================
   ADVANCED ALGORITHMS ENGINE
   ============================================================ */
const Algo = {
  /* Business days between two dates, excluding weekends + custom holidays */
  businessDays(from, to, holidays=[]){
    const f=new Date(from), t=new Date(to);
    if(!(f instanceof Date)||!(t instanceof Date)||isNaN(f)||isNaN(t)) return 0;
    let count=0; const cur=new Date(f);
    const hSet=new Set(holidays.map(h=>new Date(h).toDateString()));
    while(cur<t){
      cur.setDate(cur.getDate()+1);
      const day=cur.getDay();
      if(day!==5&&day!==6&&!hSet.has(cur.toDateString())) count++;
    }
    return count;
  },

  /* Client Risk Score (0=low risk, 100=high risk) */
  clientRisk(client, ctx={}){
    const {policies=[], claims=[], renewals=[], tasks=[]} = ctx;
    const cid = client.id;
    const cPol = policies.filter(p=>p.clientId===cid);
    const cClm = claims.filter(c=>c.clientId===cid);
    const cRen = renewals.filter(r=>r.clientId===cid);
    const cTask = tasks.filter(t=>t.clientId===cid);

    let score=30; // baseline
    // Active policies: more = lower risk
    score -= Math.min(20, cPol.length * 5);
    // Open claims: more = higher risk
    const openClaims = cClm.filter(c=>!['Closed','Paid','Rejected'].includes(c.status));
    score += Math.min(25, openClaims.length * 8);
    // Renewal stage
    const lostRen = cRen.filter(r=>String(r.stage||'').toLowerCase()==='lost');
    score += Math.min(20, lostRen.length * 10);
    // Overdue tasks
    const overdueTasks = cTask.filter(t=>String(t.status||'').toLowerCase()!=='closed' && t.dueDate && new Date(t.dueDate) < new Date());
    score += Math.min(15, overdueTasks.length * 5);
    // Stale client (no recent activity in 90d)
    const last = cPol.concat(cClm).map(x=>new Date(x.startDate||x.createdAt||0)).sort((a,b)=>b-a)[0];
    if(last && (Date.now()-last.getTime())>90*86400000) score += 10;

    return Math.max(0, Math.min(100, Math.round(score)));
  },

  /* Renewal Probability (0..1) — logistic-inspired */
  renewalProbability(policy, ctx={}){
    const {renewals=[], claims=[], clients=[]} = ctx;
    if(!policy || !policy.expiryDate) return null;
    const days = Math.max(0, (new Date(policy.expiryDate)-Date.now())/86400000);
    const client = clients.find(c=>c.id===policy.clientId);
    const r = renewals.find(x=>x.policyId===policy.id);

    // Features
    const daysScore = Math.max(0, Math.min(1, 1 - days/120)); // closer expiry → higher prob in pipeline
    const stageMap = {'Due':0.15,'Contacted':0.35,'Negotiation':0.55,'Quotation':0.70,'Approved':0.88,'Renewed':0.99,'Lost':0.02};
    const stageScore = stageMap[r?.stage] ?? 0.30;
    const claimRatio = (()=>{
      const c = claims.filter(x=>x.policyId===policy.id).reduce((s,x)=>s+(Number(x.requestedAmount)||0),0);
      const p = Number(policy.premium)||1;
      return Math.min(1, c/p);
    })();
    const claimPenalty = 1 - claimRatio*0.4;
    const clientBonus = client?.status==='Active' ? 0.08 : (client?.status==='Review' ? -0.05 : 0);
    const loyaltyBonus = client ? Math.min(0.15, (ctx.policies||[]).filter(p=>p.clientId===client.id).length*0.03) : 0;

    const p = 0.25*daysScore + 0.40*stageScore + 0.15*claimPenalty + clientBonus + loyaltyBonus + 0.05;
    return Math.max(0.02, Math.min(0.98, p));
  },

  /* Claim Anomaly Detection — Z-score on requested amounts */
  claimAnomaly(claim, allClaims=[]){
    const amounts = allClaims.map(c=>Number(c.requestedAmount)||0).filter(n=>n>0);
    if(amounts.length<3 || !claim) return {isAnomaly:false, z:0, severity:'none'};
    const mean = amounts.reduce((a,b)=>a+b,0)/amounts.length;
    const variance = amounts.reduce((s,v)=>s+(v-mean)**2,0)/amounts.length;
    const sd = Math.sqrt(variance) || 1;
    const z = ((Number(claim.requestedAmount)||0) - mean) / sd;
    const isAnomaly = Math.abs(z) > 2;
    return {isAnomaly, z, severity: Math.abs(z)>3?'critical':Math.abs(z)>2?'high':'normal', mean, sd};
  },

  /* Portfolio Health Index (0..100) */
  portfolioHealth(policies=[], claims=[], renewals=[]){
    if(!policies.length) return {score:0, grade:'—', parts:{}};
    const totalPremium = policies.reduce((s,p)=>s+(Number(p.premium)||0),0);
    const totalClaims = claims.reduce((s,c)=>s+(Number(c.requestedAmount)||0),0);
    const lossRatio = totalPremium ? totalClaims/totalPremium : 0;
    const openClaims = claims.filter(c=>!['Closed','Paid','Rejected'].includes(c.status)).length;
    const closedRens = renewals.filter(r=>['Renewed','Lost'].includes(r.stage));
    const renewed = closedRens.filter(r=>r.stage==='Renewed').length;
    const renewalRate = closedRens.length ? renewed/closedRens.length : 0.7;

    const lossScore = Math.max(0, 100 - lossRatio*250); // 40% loss → 0
    const claimsScore = Math.max(0, 100 - openClaims*8);
    const renewalScore = renewalRate*100;
    const diversityScore = Math.min(100, new Set(policies.map(p=>p.insurer)).size * 20);

    const score = Math.round(0.35*lossScore + 0.25*claimsScore + 0.25*renewalScore + 0.15*diversityScore);
    const grade = score>=85?'A':score>=70?'B':score>=55?'C':score>=40?'D':'E';
    return {score, grade, parts:{lossScore:Math.round(lossScore), claimsScore:Math.round(claimsScore), renewalScore:Math.round(renewalScore), diversityScore}};
  },

  /* Commission Forecast — weighted moving average */
  commissionForecast(policies=[], months=3){
    if(!policies.length) return 0;
    const now = new Date();
    const buckets = Array(12).fill(0);
    policies.forEach(p=>{
      const d = new Date(p.startDate||p.expiryDate||now);
      const idx = (now.getMonth()-d.getMonth()+12)%12;
      if(idx<12) buckets[idx] += Number(p.commission)||0;
    });
    // Weight recent months more
    const weights = [0.35,0.25,0.15,0.10,0.05,0.04,0.03,0.02,0.005,0.005,0,0];
    let total = 0;
    for(let i=0;i<12;i++) total += buckets[i]*weights[i];
    // Extend
    return Math.round(total * (1 + months*0.05));
  },

  /* Task Priority Score (Eisenhower-inspired) */
  taskPriorityScore(task, ctx={}){
    let score = 50;
    const prio = String(task.priority||'').toLowerCase();
    score += prio==='high'?30 : prio==='medium'?10 : -5;
    if(task.dueDate){
      const days = (new Date(task.dueDate)-Date.now())/86400000;
      if(days<0) score += 25;         // overdue
      else if(days<2) score += 18;
      else if(days<7) score += 8;
    }
    if(task.type==='Claims') score += 6;
    if(task.type==='Renewal') score += 4;
    return Math.max(0, Math.min(100, score));
  },

  /* Client Lifetime Value (simplified DCF) */
  clientLTV(client, ctx={}, years=3, discountRate=0.12){
    const {policies=[], claims=[]} = ctx;
    const cPol = policies.filter(p=>p.clientId===client.id);
    const avgCommission = cPol.length ? cPol.reduce((s,p)=>s+(Number(p.commission)||0),0)/cPol.length : 0;
    const annualCommission = avgCommission * Math.max(1, cPol.length);
    const retention = String(client.status).toLowerCase()==='active' ? 0.85 : 0.55;
    let ltv = 0, retention_cum = 1;
    for(let y=0;y<years;y++){
      retention_cum *= retention;
      ltv += (annualCommission * retention_cum) / Math.pow(1+discountRate, y+1);
    }
    return Math.round(ltv);
  },

  /* Loss Ratio for a given scope */
  lossRatio(policies=[], claims=[]){
    const premium = policies.reduce((s,p)=>s+(Number(p.premium)||0),0);
    const losses = claims.reduce((s,c)=>s+(Number(c.requestedAmount)||0),0);
    return premium ? losses/premium : null;
  },

  /* Trend direction from array of numbers */
  trend(values=[]){
    if(values.length<2) return 'flat';
    const first = values.slice(0, Math.ceil(values.length/2)).reduce((a,b)=>a+b,0);
    const last = values.slice(-Math.ceil(values.length/2)).reduce((a,b)=>a+b,0);
    const delta = last-first;
    if(Math.abs(delta)/Math.max(1,first) < 0.05) return 'flat';
    return delta>0?'up':'down';
  }
};

function t(k){return (T[State.lang]&&T[State.lang][k])||k}
function setTheme(theme){State.theme=theme;localStorage.setItem('brokeros_theme',theme);document.documentElement.dataset.theme=theme;render()}
function toggleTheme(){setTheme(State.theme==='light'?'dark':'light')}
function toggleLang(){State.lang=State.lang==='ar'?'en':'ar';localStorage.setItem('brokeros_lang',State.lang);document.documentElement.lang=State.lang;document.documentElement.dir=State.lang==='ar'?'rtl':'ltr';render()}
function uid(){return State.user?.uid||'demo'}
function orgId(){return State.profile?.orgId||State.org?.id||'demo-org'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function initials(name){return String(name||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'BO'}
function money(n){return new Intl.NumberFormat(State.lang==='ar'?'ar-EG':'en-US',{maximumFractionDigits:0}).format(Number(n)||0)}
function daysLeft(date){const d=new Date(date);return Math.ceil((d-new Date())/86400000)}
function formatDate(d){try{return new Date(d).toLocaleDateString(State.lang==='ar'?'ar-EG':'en-GB',{day:'2-digit',month:'short',year:'numeric'})}catch{return '—'}}
function statusClass(s){const x=String(s||'').toLowerCase();
  if(['active','approved','paid','closed','renewed','نشط','مقبول','مسدد','مغلق'].some(v=>x.includes(v)))return'ok';
  if(['rejected','overdue','lost','مرفوض','متأخر','مفقود'].some(v=>x.includes(v)))return'bad';
  if(['review','pending','submitted','under','contacted','negotiation','quotation','مراجعة','قيد','متابعة','تفاوض'].some(v=>x.includes(v)))return'warn';
  return'info'}
function v(id){return document.getElementById(id)?.value?.trim()||''}
function nameSafe(s){return String(s).replace(/[^a-zA-Z0-9._/-]+/g,'-')}

  const map = {
    'auth/invalid-email': State.lang==='ar'?'البريد الإلكتروني غير صالح.':'Invalid email address.',
    'auth/user-not-found': State.lang==='ar'?'لا يوجد حساب بهذا البريد.':'No account with this email.',

    'auth/invalid-credential': State.lang==='ar'?'بيانات الاعتماد غير صحيحة.':'Invalid credentials.',
    'auth/email-already-in-use': State.lang==='ar'?'البريد مستخدم بالفعل.':'Email already in use.',
    'auth/weak-password': State.lang==='ar'?'كلمة المرور ضعيفة.':'Password is too weak.',
    'auth/too-many-requests': State.lang==='ar'?'محاولات كثيرة. حاول لاحقًا.':'Too many attempts. Try later.',
    'auth/network-request-failed': State.lang==='ar'?'تحقق من اتصال الإنترنت.':'Check your network.',

/* ============================================================
   FIRESTORE (hardened)
   ============================================================ */
const DB = {
  init(){
    if(!window.firebase||!firebase.initializeApp) throw new Error('Firebase SDK unavailable');
    if(!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
    db = firebase.firestore();
    auth = firebase.auth();
    storage = firebase.storage();
    window.db = db; window.auth = auth; window.storage = storage;

    // Offline persistence with safe fallback
    try{
      db.enablePersistence({synchronizeTabs:true}).catch(err=>{
        if(err.code==='failed-precondition') console.warn('Persistence disabled: multiple tabs');
        else if(err.code==='unimplemented') console.warn('Persistence not supported');
      });
    }catch(e){console.warn('Persistence init failed',e)}

    // Auth language
    try{auth.useDeviceLanguage()}catch{}
  },

  /* Multi-tenant query builder */
  q(col, extra=[]){
    let query = db.collection(col).where('orgId','==',orgId()).limit(CONFIG.batchSize);
    for(const [f,op,val] of extra) query = query.where(f,op,val);
    return query;
  },

  /* Create */
  async add(col, data){
    if(!FIREBASE_READY()) throw new Error('Firebase not ready');
    const ref = db.collection(col).doc();
    const payload = {
      ...data,
      orgId: orgId(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: uid()
    };
    await ref.set(payload);
    await this.audit('create', col, ref.id, {});
    return ref.id;
  },

  /* Update */
  async set(col, id, data){
    if(!FIREBASE_READY()) throw new Error('Firebase not ready');
    await db.collection(col).doc(id).set({
      ...data,
      orgId: orgId(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    },{merge:true});
    await this.audit('update', col, id, {});
  },

  /* Delete */
  async del(col, id){
    if(!FIREBASE_READY()) throw new Error('Firebase not ready');
    await db.collection(col).doc(id).delete();
    await this.audit('delete', col, id, {});
  },

  /* Batch write (e.g. import) */
  async batchAdd(col, items=[]){
    if(!FIREBASE_READY()) throw new Error('Firebase not ready');
    const chunks = [];
    for(let i=0;i<items.length;i+=450) chunks.push(items.slice(i,i+450));
    for(const chunk of chunks){
      const batch = db.batch();
      for(const item of chunk){
        const ref = db.collection(col).doc();
        batch.set(ref, {
          ...item,
          orgId: orgId(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      await batch.commit();
    }
  },

  /* Audit log */
  async audit(action, collection, recordId, meta={}){
    try{
      if(!FIREBASE_READY()) return;
      await db.collection('auditLogs').add({
        orgId: orgId(),
        actorId: uid(),
        actorName: State.profile?.name || State.user?.email || '',
        action, collection, recordId, meta,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(e){console.warn('Audit failed',e)}
  },

  /* Realtime listener with auto-cleanup */
  listen(col, handler, extra=[]){
    if(!FIREBASE_READY()){handler([]);return ()=>{}}
    const unsub = this.q(col, extra).onSnapshot(
      snap => handler(snap.docs.map(d=>({id:d.id,...d.data()}))),
      err => {console.warn('listener error', col, err); handler([])}
    );
    State.listeners.push(unsub);
    return unsub;
  },

  /* Get single document */
  async getOne(col, id){
    if(!FIREBASE_READY()) return null;
    const d = await db.collection(col).doc(id).get();
    return d.exists ? {id:d.id, ...d.data()} : null;
  },

  /* Get org by id */
  async getOrg(id){
    if(!FIREBASE_READY()) return null;
    const d = await db.collection(CONFIG.orgCollection).doc(id).get();
    return d.exists ? {id:d.id, ...d.data()} : null;
  }
};

const Auth = {
  async signIn(email,password){
    if(!FIREBASE_READY()) throw new Error('Firebase unavailable');
    return auth.signInWithEmailAndPassword(email, password);
  },

  async signUp({name,email,password,phone,organization,accountType='broker',licenseNumber='',experienceYears='',city='',specialization=''}){
    if(!FIREBASE_READY()) throw new Error('Firebase unavailable');
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const user = cred.user;
    const normalizedType = ['broker','office','company'].includes(accountType)?accountType:'broker';
    const isOwner = normalizedType !== 'broker';

    // Create org doc
    const orgRef = db.collection(CONFIG.orgCollection).doc();
    await orgRef.set({
      name: organization || `${name} Brokerage`,
      ownerId: user.uid,
      accountType: normalizedType,
      licenseNumber: String(licenseNumber||''),
      experienceYears: Number(experienceYears)||0,
      city: String(city||''),
      specialization: String(specialization||''),
      officialEmail: String(email||''),
      plan: 'Free',
      status: 'active',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Permissions by account type
    const permissions = isOwner
      ? ['crm','policies','claims','renewals','tasks','medical','analytics','reports','team','organization']
      : ['crm','policies','claims','renewals','tasks','medical','analytics','reports'];

    // Create user doc
    await db.collection(CONFIG.userCollection).doc(user.uid).set({
      uid: user.uid,
      name, email,
      phone: phone||'',
      accountType: normalizedType,
      role: isOwner ? 'brokerage_owner' : 'broker',
      orgId: orgRef.id,

      specialization: String(specialization||''),

      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    try{ await user.updateProfile({displayName:name}); }catch{}
    try{ await user.sendEmailVerification(); }catch{}
    return cred;
  },

  async reset(email){
    if(!FIREBASE_READY()) throw new Error('Firebase unavailable');
    return auth.sendPasswordResetEmail(email);
  },

  async google(){
    if(!FIREBASE_READY()) throw new Error('Firebase unavailable');

  }
};

const Files = {

/* ============================================================
   LOCAL AI
   ============================================================ */
function buildLocalAI(prompt){
  const q = String(prompt||'').toLowerCase();
  const c=State.cache.clients||[], p=State.cache.policies||[], cl=State.cache.claims||[], r=State.cache.renewals||[], tks=State.cache.tasks||[];
  const openClaims = cl.filter(x=>!['Closed','Paid','Rejected','مغلق','مسدد','مرفوض'].includes(x.status));
  const duePolicies = p.map(x=>({...x, days:daysLeft(x.expiryDate)})).filter(x=>Number.isFinite(x.days)&&x.days>=0&&x.days<=45).sort((a,b)=>a.days-b.days).slice(0,5);
  const totalPremium = p.reduce((s,x)=>s+(Number(x.premium)||0),0);
  const totalClaims = cl.reduce((s,x)=>s+(Number(x.requestedAmount)||0),0);
  const lr = Algo.lossRatio(p, cl);
  const health = Algo.portfolioHealth(p, cl, r);

  if(/تجديد|renewal|ينته|expiry/.test(q)){
    return `Renewal analysis\n\nPolicies due within 45 days: ${duePolicies.length}\n${duePolicies.map(x=>`• ${x.policyNumber||'Policy'} — ${Math.max(0,x.days)} ${t('days')} — P(renew): ${(Algo.renewalProbability(x,{renewals:r,claims:cl,clients:c,policies:p})*100).toFixed(0)}%`).join('\n')||'• None currently'}\n\nRule-based operational signal.`;
  }
  if(/مطالب|claim|sla/.test(q)){
    return `Claims snapshot\n\nOpen claims: ${openClaims.length}\nTotal requested: ${money(totalClaims)}\nLoss ratio: ${lr==null?'—':(lr*100).toFixed(1)+'%'}\n\nNo medical or legal conclusion is generated.`;
  }
  if(/عميل|client|customer/.test(q)){
    return `CRM snapshot\n\nClients: ${c.length}\nAvg risk score: ${c.length ? Math.round(c.reduce((s,x)=>s+Algo.clientRisk(x,{policies:p,claims:cl,renewals:r,tasks:tks}),0)/c.length) : 0}\nPolicies: ${p.length}\nOpen claims: ${openClaims.length}`;
  }
  if(/شركة|portfolio|محفظ/.test(q)){
    return `Portfolio health\n\nIndex: ${health.score}/100 (Grade ${health.grade})\nLoss ratio: ${lr==null?'—':(lr*100).toFixed(1)+'%'}\nRenewal score: ${health.parts.renewalScore||0}\nDiversity: ${health.parts.diversityScore||0}`;
  }
  return `Broker OS brief\n\nClients: ${c.length}\nPolicies: ${p.length}\nOpen claims: ${openClaims.length}\nRenewals: ${r.length}\nTasks: ${tks.length}\nPremium: ${money(totalPremium)}\nPortfolio Health: ${health.score}/100 (${health.grade})`;
}

const AI = {
  async ask(prompt, context={}){
    if(!String(prompt||'').trim()) throw new Error('Empty prompt');
    if(!CONFIG.aiEndpoint) return {configured:false, local:true, text:buildLocalAI(prompt)};
    const token = State.user ? await State.user.getIdToken() : '';
    const safeContext = {
      ...context,
      organizationId: orgId(),
      dataPolicy:'Only use supplied aggregates. Do not invent facts. Do not return secrets.'
    };
    const r = await fetch(CONFIG.aiEndpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json', ...(token?{Authorization:`Bearer ${token}`}:{})},
      body: JSON.stringify({prompt:String(prompt).slice(0,2000), context:safeContext})
    });
    if(!r.ok) throw new Error('AI request failed');
    return await r.json();
  },
  localMedical(rows){
    if(!rows.length) return null;
    const values = rows.map(r=>{for(const k of ['cost','amount','totalCost','approvedAmount','requestedAmount']){const n=Number(r[k]);if(Number.isFinite(n))return n}return 0});
    const total = values.reduce((a,b)=>a+b,0), claims = rows.length, avg = claims?total/claims:0;
    const mean = avg, variance = claims?values.reduce((s,v)=>s+(v-mean)**2,0)/claims:0, sd = Math.sqrt(variance), highCostThreshold = sd?mean+2*sd:mean*2;
    const highCost = rows.filter((_,i)=>values[i]>=highCostThreshold&&values[i]>0).length;
    const inpatient = rows.filter(r=>String(r.type||r.category||'').toLowerCase().includes('inpatient')).length;
    const outpatient = rows.filter(r=>String(r.type||r.category||'').toLowerCase().includes('outpatient')).length;
    const providers = {}; rows.forEach((r,i)=>{const p=r.provider||r.providerName||'Unknown';providers[p]=(providers[p]||0)+values[i]});
    const topProviders = Object.entries(providers).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const missingCost = values.filter(v=>v===0).length;
    return {claims,total,avg,inpatient,outpatient,highCost,highCostThreshold,missingCostRate:claims?missingCost/claims*100:0,topProviders};
  }
};

function runGlobalSearch(query){
  const q = String(query||'').trim().toLowerCase(), out = document.getElementById('smartSearchResults');
  if(!out) return;
  if(q.length<2){ out.innerHTML = `<div class="empty"><div class="empty-icon">${UI.icon('search',24)}</div><div>${esc(t('smartSearchHint'))}</div></div>`; UI.refreshIcons(); return; }
  const sources = [['clients','clients'],['policies','policies'],['claims','claims'],['renewals','renewals'],['tasks','tasks'],['documents','documents'],['companies','companies'],['products','products']];
  const hits = [];
  for(const [type,label] of sources){
    for(const x of (State.cache[type]||[])){
      if(JSON.stringify(x).toLowerCase().includes(q)) hits.push({type,label,item:x});
      if(hits.length>=14) break;
    }
    if(hits.length>=14) break;
  }
  out.innerHTML = hits.length ? hits.map(h=>{
    const icon = h.type==='clients'?'user-round':h.type==='policies'?'shield-check':h.type==='claims'?'file-warning':h.type==='companies'?'building-2':h.type==='products'?'layers-3':'search';

function refreshCollection(type){
  const s = document.getElementById('globalSearch')?.value||'';

  UI.refreshIcons(); ensureIconsReady();
}

async function handleMedicalFile(file){
  const out=document.getElementById('medicalResult'), narrative=document.getElementById('medicalNarrative');
  if(!file) return;
  out.innerHTML = `<div class="notice info">${UI.icon('loader-circle',15)} Processing ${esc(file.name)}…</div>`;
  UI.refreshIcons();
  try{
    let rows=[];
    const ext = file.name.toLowerCase().split('.').pop();
    if(ext==='csv'){ rows=parseCSV(await file.text()) }
    else if(['xlsx','xls'].includes(ext)){ const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const sheet=wb.Sheets[wb.SheetNames[0]]; rows=XLSX.utils.sheet_to_json(sheet,{defval:''}); }
    else { out.innerHTML=`<div class="notice ai">${UI.icon('info',15)} PDF/Image ready for backend OCR.</div>`; UI.refreshIcons(); return; }
    const m = AI.localMedical(rows);
    out.innerHTML = `<div class="metric-grid">

      <div class="metric-card"><span class="metric-icon blue">${UI.icon('hospital',19)}</span><b>${m.inpatient}</b><small>Inpatient</small></div>
    </div>`;
    narrative.textContent = `Executive Summary\n\nClaims: ${m.claims}\nTotal: ${money(m.total)}\nAverage: ${money(m.avg)}\nInpatient: ${m.inpatient}\nOutpatient: ${m.outpatient}\nHigh-cost: ${m.highCost}\n\nTop providers:\n${m.topProviders.map(x=>'- '+x[0]+': '+money(x[1])).join('\n')}`;
    UI.refreshIcons();
  }catch(e){ console.error(e); out.innerHTML=`<div class="notice danger">${t('unknownError')}</div>`; UI.refreshIcons(); }
}
function parseCSV(text){const lines=text.split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];const headers=parseCSVLine(lines[0]);return lines.slice(1).map(line=>{const vals=parseCSVLine(line),o={};headers.forEach((h,i)=>o[h]=vals[i]??'');return o})}
function parseCSVLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}

  UI.refreshIcons(); ensureIconsReady();
  animateMetricCounts(page);
}
function animateMetricCounts(root){
  if(!root||window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('[data-count-target]').forEach(node=>{
    const target = Math.max(0, Number(node.getAttribute('data-count-target')||0));
    if(!target) return;
    const start = performance.now(), duration = 620;
    const step = now=>{
      const p = Math.min(1,(now-start)/duration), e = 1-Math.pow(1-p,3);
      node.textContent = String(Math.round(target*e));
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function render(){
  stopListeners();
  if(!State.user){ renderAuth('signin'); return; }
  document.getElementById('app').innerHTML = shell();
  UI.refreshIcons();
  setupData();
  renderPage();
  setTimeout(()=>ensureIconsReady(),0);
}

    if(kind==='client'){ Object.assign(payload,{name:v('f_name'),company:v('f_company'),phone:v('f_phone'),email:v('f_email'),type:v('f_type'),status:v('f_status'),accountOwner:State.profile?.name||'Demo Broker'}); if(!payload.name) return invalid(State.lang==='ar'?'اكتب اسم العميل.':'Client name is required.') }

    else if(kind==='company'){ Object.assign(payload,{name:v('f_name'),email:v('f_companyEmail'),claimsEmail:v('f_claims'),renewalEmail:v('f_renewal'),status:'Active'}); if(!payload.name) return invalid(State.lang==='ar'?'اكتب اسم الشركة.':'Company name required.') }
    else if(kind==='product'){ Object.assign(payload,{name:v('f_name'),line:v('f_line'),insurer:v('f_insurer'),status:'Active'}); if(!payload.name) return invalid(State.lang==='ar'?'اكتب اسم المنتج.':'Product name required.') }
    else if(kind==='user'){ Object.assign(payload,{name:v('f_name'),email:v('f_email'),role:v('f_role'),status:'Active',permissions:[]}); if(!payload.name||!payload.email) return invalid(State.lang==='ar'?'أكمل بيانات المستخدم.':'User data required.') }
    else if(kind==='document'){ const file=document.getElementById('f_fileInput')?.files?.[0]||null; const insurer=State.cache.companies.find(c=>c.id===v('f_documentInsurer')); Object.assign(payload,{name:v('f_name'),entityType:v('f_entity'),insurerId:v('f_documentInsurer'),insurer:insurer?.name||'',fileName:file?.name||'',fileSize:file?.size||0,status:v('f_status')||'Ready'}); if(!payload.name) return invalid(State.lang==='ar'?'اكتب اسم المستند.':'Document name required.'); if(!file) return invalid(State.lang==='ar'?'اختر ملفًا.':'Choose a file.') }
    else if(kind==='commission'){ Object.assign(payload,{policyId:v('f_policy'),amount:Number(v('f_commAmount')||0),status:v('f_commStatus')||'Pending',date:v('f_commDate')||new Date().toISOString().slice(0,10)}); if(!payload.policyId||!payload.amount) return invalid(State.lang==='ar'?'أكمل البيانات.':'Fill required fields.') }
    else if(kind==='notification'){ Object.assign(payload,{title:v('f_title'),body:v('f_body'),type:v('f_type')||'Info',read:false}); if(!payload.title||!payload.body) return invalid(State.lang==='ar'?'أكمل الحقول.':'Fill required fields.') }
    else return invalid('Unsupported form');

    const map={client:'clients',policy:'policies',claim:'claims',task:'tasks',renewal:'renewals',company:'companies',product:'products',user:'users',document:'documents',notification:'notifications',commission:'commissions'};

    if(State.demo){
      const collection = map[kind], id = 'demo-'+kind+'-'+Date.now();
      if(!State.cache[collection]) State.cache[collection]=[];
      if(kind==='document'){
        const file = document.getElementById('f_fileInput')?.files?.[0]||null;

      State.cache[collection].unshift({id,...payload});
      UI.closeModal();
      UI.toast(State.lang==='ar'?'تم الحفظ (تجريبي)':'Saved (demo)');
      renderPage();
      return;
    }

    if(kind==='document'){
      const file = document.getElementById('f_fileInput')?.files?.[0]||null;
      let uploadMeta = {};

      payload.downloadURL = uploadMeta.url||'';
      payload.storagePath = uploadMeta.path||'';
    }
    await DB.add(map[kind], payload);
    UI.closeModal();
    UI.toast(t('save'));
    render();
  }catch(e){ console.error(e); UI.toast(friendlyError(e),'bad'); }

  UI.modal(t(kind),formBody(kind,relatedId),`<button class="btn btn-outline" onclick="UI.closeModal()">${t('cancel')}</button><button class="btn btn-primary" onclick="saveForm('${kind}')">${UI.icon('save',15)} ${t('save')}</button>`);
}

/* ============================================================
   OFFICIAL EMAIL + DOCUMENT SENDING
   ============================================================ */
async function saveOfficialEmail(){
  const email = v('officialEmailInput');
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ UI.toast(State.lang==='ar'?'أدخل بريدًا صحيحًا.':'Enter a valid email.','bad'); return; }
  try{
    if(State.demo){
      State.profile = {...(State.profile||{}),officialEmail:email};
      State.org = {...(State.org||{}),officialEmail:email};
      UI.toast(t('emailSaved')); renderPage(); return;
    }
    await Promise.all([
      DB.set(CONFIG.userCollection, uid(), {officialEmail:email}),
      State.org?.id ? DB.set(CONFIG.orgCollection, State.org.id, {officialEmail:email}) : Promise.resolve()
    ]);
    State.profile = {...(State.profile||{}),officialEmail:email};
    State.org = {...(State.org||{}),officialEmail:email};
    UI.toast(t('emailSaved')); renderPage();
  }catch(e){ console.error(e); UI.toast(friendlyError(e),'bad'); }
}
function insurerEmailOptions(){
  const companies = State.cache.companies||[];
  return companies.flatMap(c=>[
    c.email?{company:c,label:t('insurerEmail'),email:c.email}:null,
    c.claimsEmail?{company:c,label:t('claimsEmail'),email:c.claimsEmail}:null,
    c.renewalEmail?{company:c,label:t('renewalEmail'),email:c.renewalEmail}:null
  ]).filter(Boolean).map(x=>`<option value="${esc(x.email)}">${esc(x.company.name)} — ${esc(x.label)} — ${esc(x.email)}</option>`).join('');
}
function openCompanyEmail(companyId){
  const c = (State.cache.companies||[]).find(x=>x.id===companyId); if(!c) return;
  const to = c.email||c.claimsEmail||c.renewalEmail;
  if(!to){ UI.toast(t('noEmail'),'bad'); return; }
  window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent('Broker OS — '+(State.org?.name||State.profile?.name||'Insurance Broker'))}`;
}
function openDocumentEmail(documentId){
  const doc = (State.cache.documents||[]).find(x=>x.id===documentId); if(!doc) return;
  const opts = insurerEmailOptions();
  if(!opts){ UI.toast(State.lang==='ar'?'أضف بريد شركة أولًا.':'Add insurer email first.','bad'); return; }
  const official = State.profile?.officialEmail||State.org?.officialEmail||State.user?.email||'';
  const subjectDefault = doc.name||doc.fileName||'Broker OS document';
  const bodyDefault = State.lang==='ar'
    ? `مرحبًا،\nأرفق لكم المستند التالي عبر Broker OS.\n\nالمستند: ${subjectDefault}\nالبريد الرسمي: ${official}`
    : `Hello,\nPlease find the document shared via Broker OS.\n\nDocument: ${subjectDefault}\nOfficial email: ${official}`;
  UI.modal(t('sendDocument'),`<div class="form-grid">
    <div class="field full"><label>${t('chooseInsurer')}</label><select class="input" id="emailRecipient">${opts}</select></div>
    <div class="field full"><label>${t('emailSubject')}</label><input class="input" id="emailSubject" value="${esc(subjectDefault)}"></div>
    <div class="field full"><label>${t('emailBody')}</label><textarea class="input" id="emailBody" rows="5">${esc(bodyDefault)}</textarea></div>
    <div class="field full"><div class="email-contact">${UI.icon('paperclip',16)}<span><strong>${t('sendReady')}</strong><small>${esc(doc.downloadURL||doc.fileName||'Local')}${official?` · ${esc(official)}`:''}</small></span></div></div>
  </div>`,`<button class="btn btn-outline" onclick="UI.closeModal()">${t('cancel')}</button><button class="btn btn-primary" onclick="sendDocumentEmail('${esc(documentId)}')">${UI.icon('send',15)} ${t('send')}</button>`);
}
async function sendDocumentEmail(documentId){
  const doc = (State.cache.documents||[]).find(x=>x.id===documentId); if(!doc) return;
  const to = document.getElementById('emailRecipient')?.value||'';
  const subject = document.getElementById('emailSubject')?.value||doc.name||'Broker OS document';
  const body = document.getElementById('emailBody')?.value||'';
  if(!to){ UI.toast(t('noEmail'),'bad'); return; }
  try{
    if(CONFIG.emailEndpoint && !State.demo){
      const token = await State.user.getIdToken();
      const res = await fetch(CONFIG.emailEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({to,subject,body,documentId,downloadURL:doc.downloadURL||'',fileName:doc.fileName||doc.name||'',organizationId:orgId(),officialEmail:State.profile?.officialEmail||State.org?.officialEmail||State.user?.email||''})});
      if(!res.ok) throw new Error('Email service failed');
      UI.closeModal(); UI.toast(State.lang==='ar'?'تم الإرسال.':'Sent.'); return;
    }
    const localFile = State.fileCache[documentId];
    if(localFile && navigator.canShare && navigator.canShare({files:[localFile]}) && navigator.share){
      await navigator.share({files:[localFile],title:subject,text:body});
      UI.closeModal(); UI.toast(State.lang==='ar'?'تم فتح المشاركة.':'Sharing opened.'); return;
    }
    const mailBody = body + (doc.downloadURL?`\n\n${doc.downloadURL}`:'');
    window.location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(mailBody)}`;
    UI.closeModal();
  }catch(e){ console.error(e); UI.toast(friendlyError(e),'bad'); }
}

/* ============================================================
   SIGN OUT
   ============================================================ */
function brokerSafeSignOut(){
  try{
    if(State.demo){
      State.demo=false; State.user=null; State.profile=null; State.org=null;
      stopListeners(); renderAuth('signin'); UI.toast(t('signedOut')); return;
    }
    Auth.signOut().then(()=>UI.toast(t('signedOut'))).catch(e=>UI.toast(friendlyError(e),'bad'));
  }catch(e){ console.error(e); UI.toast(friendlyError(e),'bad'); }
}

/* ============================================================
   BOOT
   ============================================================ */
async function ensureUserProfile(user){
  const ref = db.collection(CONFIG.userCollection).doc(user.uid);
  const snap = await ref.get();
  if(snap.exists) return {id:snap.id, ...snap.data()};
  const orgRef = db.collection(CONFIG.orgCollection).doc();
  const org = {
    name: `${user.displayName||'Broker'} Brokerage`,
    ownerId: user.uid,
    officialEmail: user.email||'',
    plan: 'Free',
    status: 'active',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  const profile = {
    uid: user.uid,
    name: user.displayName||user.email,
    email: user.email||'',
    phone: user.phoneNumber||'',
    role: 'brokerage_owner',
    orgId: orgRef.id,
    status: 'active',
    permissions: ['crm','policies','claims','renewals','tasks','medical','analytics','reports'],
    officialEmail: user.email||'',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  await orgRef.set(org);
  await ref.set(profile);
  return {id:ref.id, ...profile};
}
function subscribeUser(){
  auth.onAuthStateChanged(async user=>{
    State.user = user;
    if(!user){ stopListeners(); State.profile=null; State.org=null; renderAuth('signin'); return; }
    try{
      State.profile = await ensureUserProfile(user);
      State.org = State.profile.orgId ? await DB.getOrg(State.profile.orgId) : null;
      State.demo = false;
      render();
    }catch(e){
      console.error('Profile load failed', e);
      State.profile = {uid:user.uid, name:user.displayName||user.email, email:user.email, role:'broker', status:'active', orgId:'demo-org'};
      State.org = {id:'demo-org', name:'Brokerage', plan:'Free'};
      State.demo = true;
      UI.toast(friendlyError(e),'bad');
      render();
    }
  });
}
function enterDemoMode(){
  State.demo = true;
  State.user = {uid:'demo-user',email:'demo@brokeros.local',displayName:'Demo Broker'};
  State.profile = {uid:'demo-user', name:'Demo Broker', email:'demo@brokeros.local', role:'brokerage_owner', orgId:'demo-org', status:'active', officialEmail:'demo@brokeros.local'};
  State.org = {id:'demo-org', name:'Demo Brokerage', plan:'Free'};
  render();
}
function paintBootLogo(){
  const slot = document.getElementById('bootLogoSlot');
  if(slot) slot.innerHTML = brandLogoSVG(80,'mark');
}
function boot(){
  paintBootLogo();
  document.documentElement.dataset.theme = State.theme;
  document.documentElement.lang = State.lang;
  document.documentElement.dir = State.lang==='ar'?'rtl':'ltr';
  try{
    if(LOCAL_PREVIEW){ enterDemoMode(); return; }
    if(!window.firebase||!firebase.initializeApp){
      if((window.__brokerBootWait||0)>=120) return enterDemoMode();
      window.__brokerBootWait = (window.__brokerBootWait||0)+1;
      return setTimeout(boot,100);
    }
    DB.init();
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
    subscribeUser();
  }catch(e){
    console.error('Boot error', e);
    document.getElementById('app').innerHTML = `<div class="boot-screen"><div class="boot-logo">${brandLogoSVG(80,'mark')}</div><div class="boot-brand">Broker OS</div><div class="boot-sub">${State.lang==='ar'?'تعذر التهيئة. جرّب إعادة التحميل.':'Init failed. Try reloading.'}</div><button class="btn btn-primary" style="margin-top:12px" onclick="location.reload()">${State.lang==='ar'?'إعادة المحاولة':'Retry'}</button></div>`;
  }
}

Object.assign(window,{

boot();
